<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <style>

      /* Typography Styles */
      .brand-title {
        font-family: 'Montserrat', 'Inter', 'Helvetica Neue', sans-serif;
        font-weight: 800;
        font-size: 132px;
        letter-spacing: -2px;
      }
      .brand-subtitle {
        font-family: 'Montserrat', 'Inter', 'Helvetica Neue', sans-serif;
        font-weight: 400;
        font-size: 28px;
        fill: #B8C0CC;
        letter-spacing: 15px;
      }

      /* --- LOADING ANIMATIONS (2.8s Infinite Loop) --- */

      /* 1. Cart Frame Draw */
      .cart-body {
        stroke-dasharray: 550;
        stroke-dashoffset: 550;
        animation: drawCart 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .cart-base {
        stroke-dasharray: 250;
        stroke-dashoffset: 250;
        animation: drawBase 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }

      /* 2. Wheels pop, subtle bounce */
      .wheel-1, .wheel-2 {
        transform-box: fill-box;
        transform-origin: center;
        animation: popWheel 2.8s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }
      .wheel-2 {
        animation-delay: 0.08s;
      }

      /* 3. Bars Grow Upward */
      .bar-1, .bar-2, .bar-3 {
        transform-origin: 0px 332px;
      }
      .bar-1 { animation: growBar1 2.8s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }
      .bar-2 { animation: growBar2 2.8s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }
      .bar-3 { animation: growBar3 2.8s cubic-bezier(0.34, 1.56, 0.64, 1) infinite; }

      /* 4. Trend Arrow Shoot */
      .arrow-line {
        stroke-dasharray: 320;
        stroke-dashoffset: 320;
        animation: shootArrow 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .arrow-head {
        transform-box: fill-box;
        transform-origin: center;
        animation: popHead 2.8s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }

      /* 5. Brand text fade and slide */
      .text-title {
        animation: fadeSlideText 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .text-sub {
        animation: fadeSlideSub 2.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .cart-group {
        animation: cartFloat 2.8s ease-in-out infinite;
      }

      /* --- KEYFRAMES --- */
      @keyframes drawCart {
        0% { stroke-dashoffset: 550; opacity: 1; }
        20%, 85% { stroke-dashoffset: 0; opacity: 1; }
        95%, 100% { stroke-dashoffset: 0; opacity: 0; }
      }
      @keyframes drawBase {
        0%, 10% { stroke-dashoffset: 250; opacity: 1; }
        25%, 85% { stroke-dashoffset: 0; opacity: 1; }
        95%, 100% { stroke-dashoffset: 0; opacity: 0; }
      }
      @keyframes popWheel {
        0%, 12% { transform: scale(0); opacity: 0; }
        25%, 85% { transform: scale(1); opacity: 1; }
        95%, 100% { transform: scale(0); opacity: 0; }
      }
      @keyframes growBar1 {
        0%, 18% { transform: scaleY(0); opacity: 0; }
        32%, 85% { transform: scaleY(1); opacity: 1; }
        95%, 100% { transform: scaleY(0); opacity: 0; }
      }
      @keyframes growBar2 {
        0%, 24% { transform: scaleY(0); opacity: 0; }
        38%, 85% { transform: scaleY(1); opacity: 1; }
        95%, 100% { transform: scaleY(0); opacity: 0; }
      }
      @keyframes growBar3 {
        0%, 30% { transform: scaleY(0); opacity: 0; }
        44%, 85% { transform: scaleY(1); opacity: 1; }
        95%, 100% { transform: scaleY(0); opacity: 0; }
      }
      @keyframes shootArrow {
        0%, 38% { stroke-dashoffset: 320; opacity: 1; }
        55%, 85% { stroke-dashoffset: 0; opacity: 1; }
        95%, 100% { stroke-dashoffset: 0; opacity: 0; }
      }
      @keyframes popHead {
        0%, 48% { transform: scale(0); opacity: 0; }
        58%, 85% { transform: scale(1); opacity: 1; }
        95%, 100% { transform: scale(0); opacity: 0; }
      }
      @keyframes fadeSlideText {
        0%, 25% { transform: translateX(-18px); opacity: 0; }
        45%, 85% { transform: translateX(0); opacity: 1; }
        95%, 100% { transform: translateX(10px); opacity: 0; }
      }
      @keyframes fadeSlideSub {
        0%, 35% { transform: translateY(10px); opacity: 0; }
        55%, 85% { transform: translateY(0); opacity: 1; }
        95%, 100% { transform: translateY(5px); opacity: 0; }
      }
      @keyframes cartFloat {
        0%, 50%, 100% { transform: translate(20px, -18px) scale(0.75); }
        68% { transform: translate(20px, -23px) scale(0.75); }
      }
    </style>

    <!-- Bar Chart Gradient -->
    <linearGradient id="bar-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#19E68C" />
      <stop offset="100%" stop-color="#119966" />
    </linearGradient>

    <!-- Blue Arrow Gradient -->
    <linearGradient id="arrow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D6EFD" />
      <stop offset="100%" stop-color="#0099FF" />
    </linearGradient>
  </defs>

  <!-- Dark Banner Background -->
  <rect width="1200" height="360" fill="#121418" />

  <!-- Left Animated Icon Group -->
  <g class="cart-group" transform="translate(20, -18) scale(0.75)">
    <!-- Green Bar Chart -->
    <g fill="url(#bar-grad)">
      <rect class="bar-1" x="172" y="210" width="38" height="122" rx="4" />
      <rect class="bar-2" x="228" y="168" width="38" height="164" rx="4" />
      <rect class="bar-3" x="284" y="128" width="38" height="204" rx="4" />
    </g>

    <!-- Trend Arrow Knockout (Synchronized with Blue Arrow) -->
    <g stroke="#121418" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path class="arrow-line" d="M 164 306 L 236 244 L 274 282 L 368 192" />
    </g>

    <!-- Shopping Cart Frame & Base -->
    <g stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path class="cart-body" d="M 88 144 H 126 L 166 332 H 332 L 352 248" />
      <path class="cart-base" d="M 166 332 C 140 332, 140 368, 166 368 H 322" />
    </g>

    <!-- Cart Wheels -->
    <g fill="none" stroke="#FFFFFF" stroke-width="14">
      <circle class="wheel-1" cx="188" cy="402" r="16" />
      <circle class="wheel-2" cx="300" cy="402" r="16" />
    </g>

    <!-- Blue Trend Arrow -->
    <g>
      <path class="arrow-line" d="M 164 306 L 236 244 L 274 282 L 368 192" stroke="url(#arrow-grad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <polygon class="arrow-head" points="392,168 340,180 378,218" fill="url(#arrow-grad)" />
    </g>
  </g>

  <!-- Right Animated Typography Lockup -->
  <g class="text-title">
    <text x="352" y="228" class="brand-title" textLength="760" lengthAdjust="spacingAndGlyphs">
      <tspan fill="#FFFFFF">Cart</tspan><tspan fill="#16C976">Vibe</tspan>
    </text>
  </g>
  
  <g class="text-sub">
    <text x="358" y="284" class="brand-subtitle" textLength="650" lengthAdjust="spacing">RECEIPT TRACKING</text>
  </g>
</svg>