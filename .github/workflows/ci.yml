---
name: CI - Build and Test

on:
  push:
    # Tests only: the image is published by publish-image.yml. Dependabot's branches (.github/dependabot.yml) are
    # tested like a feature branch, so an update proposal shows a result before anyone merges it.
    branches: [main, 'feature/**', 'dependabot/**']
    paths:
      - 'api/**'
      - 'desktop/**'
      - 'docker/**'
      - '.dockerignore'
      - '.github/workflows/**'
  # Dispatched by regenerate-clients.yml, whose GITHUB_TOKEN push cannot trigger the push event.
  workflow_dispatch:

# Least privilege: every job only reads the repository. The coverage summary writes a local file, and the gha layer
# cache and the failure artifact use the runner's own token, not GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A feature branch runs only the jobs its change touches. main runs every job on every push: the filter compares a
  # push with the one before it, a skipped job counts as passed, and publish-image.yml publishes :latest after a
  # passing run, so a filtered run on main could publish a commit whose failing tests were never run again.
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      desktop: ${{ steps.filter.outputs.desktop }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
            image:
              - 'docker/**'
              - '.dockerignore'
              # A change to how the image is tested is tested: the smoke job runs for it.
              - '.github/workflows/ci.yml'
            desktop:
              - 'desktop/**'
              # check:csp compares the built index.html with the script-src hash in the nginx config.
              - 'docker/default.conf'
              # i18n:check reads the Go texts the API translates (and the error messages the desktop shows),
              # so a Go-only change still runs it.
              - 'api/internal/**/*.go'
              - 'api/internal/i18n/locales/**'

  test-api:
    needs: detect-changes
    if: github.ref == 'refs/heads/main' || needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    container: golang:1.26-trixie
    steps:
      - uses: actions/checkout@v7
      - name: Mark workspace as safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # The libraries the build links, plus what only the tests run (Chromium, a PDF-enabled ImageMagick policy).
      - name: Install app dependencies
        run: bash set-up-dependencies.sh --with-test-tools
        working-directory: ./api
      - name: Build
        run: go build -v ./...
        working-directory: ./api
      - name: Vet
        run: go vet ./...
        working-directory: ./api
      # SA: likely bugs. S1: simpler code that means the same. U1000: unused code. Left out on purpose: ST (style,
      # inherited in bulk) and SA1029 (plain string keys in request contexts, shared by the middleware and every
      # handler: a change of its own). The checks are named here, not in a staticcheck.conf, so the list is in one place.
      - name: Static analysis
        if: ${{ !cancelled() }}
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 -checks "SA*,S1*,U1000,-SA1029" ./...
        working-directory: ./api
      # Fails only for an advisory in code this module really calls (the standard library included).
      - name: Known vulnerabilities
        if: ${{ !cancelled() }}
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: ./api
      - name: Test
        if: ${{ !cancelled() }}
        # Failures are also raised as annotations, so they can be read without access to the log.
        shell: bash
        run: |
          set -o pipefail
          if ! go test -coverprofile=coverage.out -covermode=atomic -v ./... 2>&1 | tee test.log; then
            # Only failures: a passing test's t.Log lines look like assertion output too.
            grep -E -B3 -- "^\s*--- FAIL|^panic:" test.log | grep -vE "^\s*(=== RUN|--- PASS)" | head -60 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi
        working-directory: ./api

  test-desktop:
    needs: detect-changes
    if: github.ref == 'refs/heads/main' || needs.detect-changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
      - name: Install dependencies
        run: npm ci --verbose
        working-directory: ./desktop
      # The packages the app depends on at run time (dev tools are left out, so an advisory in a test runner does not
      # stop a release). A finding is fixed as desktop/docs/lockfile.md describes, usually with an override.
      - name: Known vulnerabilities
        run: npm audit --omit=dev
        working-directory: ./desktop
      # The English catalogue is generated from the code and every language file must match it (see desktop/CLAUDE.md).
      - name: Check translations
        run: npm run i18n:check
        working-directory: ./desktop
      - name: Run tests
        run: npm run test:ci
        working-directory: ./desktop
      # The spec build compiles components JIT, so strict template type-checking only happens in a real
      # build -- without this a template error would first surface in the Docker image build.
      - name: Build
        # Errors are also raised as annotations, so they can be read without access to the log.
        shell: bash
        run: |
          set -o pipefail
          if ! npm run build 2>&1 | tee build.log; then
            grep -E "ERROR|error TS|error NG|\[ERROR\]" -A3 build.log | head -60 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi
        working-directory: ./desktop
      # The inline theme script in the built index.html must be allowed by docker/default.conf, or the CSP blocks it.
      - name: Check CSP script hash
        run: npm run check:csp
        working-directory: ./desktop
      # The demo (desktop/docs/demo.md) builds from the same sources; none of it may reach the production bundle above.
      - name: Build the demo
        run: npm run build:demo
        working-directory: ./desktop
      - name: Check the demo is compiled out of the production build
        run: npm run check:demo
        working-directory: ./desktop
      - name: Generate coverage report
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: desktop/coverage/cartvibe/cobertura-coverage.xml
          format: markdown
          output: both
          badge: true

  # The image as it ships (nginx, the Go API, the built app), on its own as on the NAS, driven by the Playwright specs that
  # are known to pass (`e2e:smoke`, see desktop/docs/e2e.md). The rest of the suite is not run here: many specs predate
  # the family rework. The job also proves what only a running container can show: compression and cache headers, a
  # clean stop, and the database snapshot a new version takes before it migrates.
  e2e-smoke:
    needs: detect-changes
    if: github.ref == 'refs/heads/main' || needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.desktop == 'true' || needs.detect-changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Throwaway values for a container that lives as long as this job.
      E2E_BASE_URL: http://localhost:8091
      E2E_NO_WEBSERVER: "1"
      API_URL: http://localhost:8091
      E2E_USER_USERNAME: e2e-user
      E2E_USER_PASSWORD: e2e-user-password
      E2E_ADMIN_USERNAME: e2e-admin
      E2E_ADMIN_PASSWORD: e2e-admin-password
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Shares its layer cache with publish-image.yml, so a code-only change rebuilds only the last layers.
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: cartvibe:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # One container and nothing else: the job queue lives in the app's own database.
      - name: Start the app
        run: |
          docker network create e2e
          docker run -d --name cartvibe --network e2e -p 8091:80             -e TZ=Europe/Paris -e SECRET_KEY=ci-secret-key -e ENCRYPTION_KEY=ci-encryption-key             -e DB_ENGINE=sqlite -e DB_FILENAME=app.db             cartvibe:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8091/api/featureConfig > /dev/null; then exit 0; fi
            sleep 2
          done
          docker logs cartvibe --tail 100
          exit 1
      # The image's HEALTHCHECK must turn healthy: docker-compose.vps.yml starts Caddy only then.
      - name: The container reports healthy
        run: |
          for i in $(seq 1 30); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' cartvibe)" = healthy ] && exit 0
            sleep 5
          done
          docker inspect --format '{{json .State.Health}}' cartvibe
          exit 1
      # docker/default.conf: scripts travel compressed, and a file with a content hash in its name is cached for good.
      # A GET, not a HEAD: nginx does not compress (or say it would) when only the headers are asked for.
      - name: The app's scripts are compressed and cached
        run: |
          main=$(curl -fsS http://localhost:8091/ | grep -oE 'main-[A-Za-z0-9_-]{8}\.js' | head -1)
          test -n "$main"
          headers=$(curl -fsS -H 'Accept-Encoding: gzip' -D - -o /dev/null "http://localhost:8091/$main")
          echo "$headers"
          echo "$headers" | grep -qi '^content-encoding: gzip'
          echo "$headers" | grep -qi '^cache-control:.*immutable'
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
      - name: Install dependencies
        run: npm ci
        working-directory: ./desktop
      - name: Install the browser
        run: npx playwright install --with-deps chromium
        working-directory: ./desktop
      # A fresh database only has admin / admin; the specs sign in as these two.
      - name: Create the e2e accounts
        run: node e2e/seed-accounts.mjs
        working-directory: ./desktop
      - name: Run the smoke specs
        run: npm run e2e:smoke
        working-directory: ./desktop
      # nginx answers 429 past its request limit (10 a second per address), and every spec shares this runner's
      # address. Counted, with the paths, so a run can tell a spec that is wrong from one that was starved.
      - name: Requests the rate limit refused during the specs
        if: ${{ !cancelled() }}
        run: |
          docker exec cartvibe sh -c 'awk "\$9 == 429" /var/log/nginx/access.log | wc -l'
          docker exec cartvibe sh -c 'awk "\$9 == 429 {print \$6, \$7}" /var/log/nginx/access.log | sed -E "s/[0-9]+/N/g" | sort | uniq -c | sort -rn | head -20'
      # docker/entrypoint.sh waits for the API and nginx to finish, so a stop ends with exit code 0, well inside the
      # 30 seconds the compose files allow (a killed container reports 137).
      - name: A stop is clean
        run: |
          start=$(date +%s)
          docker stop --time 30 cartvibe
          took=$(( $(date +%s) - start ))
          code=$(docker inspect --format '{{.State.ExitCode}}' cartvibe)
          echo "stopped in ${took}s with exit code ${code}"
          [ "$code" = "0" ] && [ "$took" -lt 25 ]
      # The same data under another version, as after an update on the NAS: the API must copy the database to
      # sqlite/backups before it migrates, then record the version it started as.
      - name: A new version snapshots the database first
        run: |
          docker run -d --name cartvibe-next --network e2e --volumes-from cartvibe             -e VERSION=ci-next -e TZ=Europe/Paris -e SECRET_KEY=ci-secret-key -e ENCRYPTION_KEY=ci-encryption-key             -e DB_ENGINE=sqlite -e DB_FILENAME=app.db             cartvibe:ci
          for i in $(seq 1 30); do
            if docker exec cartvibe-next grep -qx ci-next /app/cartvibe-api/sqlite/backups/last-version 2> /dev/null; then
              docker exec cartvibe-next sh -c 'ls -l /app/cartvibe-api/sqlite/backups/app-upgrade-*.db'
              exit 0
            fi
            sleep 2
          done
          docker logs cartvibe-next --tail 100
          exit 1
      - name: Container logs
        if: failure()
        run: |
          docker logs cartvibe --tail 200
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: desktop/playwright-report
          if-no-files-found: ignore
