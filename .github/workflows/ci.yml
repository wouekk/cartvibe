---
name: CI - Build and Test

on:
  push:
    # Tests only: the image is published by publish-image.yml.
    branches: [main, 'feature/**']
    paths:
      - 'api/**'
      - 'desktop/**'
      - 'mobile/**'
      - 'docker/**'
      - '.github/workflows/**'
  # Dispatched by regenerate-clients.yml, whose GITHUB_TOKEN push cannot trigger the push event.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      desktop: ${{ steps.filter.outputs.desktop }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
            desktop:
              - 'desktop/**'
            mobile:
              - 'mobile/**'

  test-api:
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    container: golang:1.26-trixie
    steps:
      - uses: actions/checkout@v4
      - name: Mark workspace as safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install app dependencies
        run: sh set-up-dependencies.sh
        working-directory: ./api
      - name: Build
        run: go build -v ./...
        working-directory: ./api
      - name: Test
        # Failures are also raised as annotations, so they can be read without access to the log.
        shell: bash
        run: |
          set -o pipefail
          if ! go test -coverprofile=coverage.out -covermode=atomic -v ./... 2>&1 | tee test.log; then
            # Only failures: a passing test's t.Log lines look like assertion output too.
            grep -E -B3 -- "^\s*--- FAIL|^panic:" test.log | grep -vE "^\s*(=== RUN|--- PASS)" | head -60 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi
        working-directory: ./api
      - name: Test imap client
        run: |
          . wranglervenv/bin/activate
          python3 -m unittest discover -s ./imap-client
        working-directory: ./api

  test-desktop:
    needs: detect-changes
    if: needs.detect-changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.6"
      - name: Install dependencies
        run: npm ci --verbose
        working-directory: ./desktop
      - name: Run tests
        run: npm run test:ci
        working-directory: ./desktop
      # Jest compiles components JIT, so strict template type-checking only happens in a real
      # build -- without this a template error would first surface in the Docker image build.
      - name: Build
        # Errors are also raised as annotations, so they can be read without access to the log.
        shell: bash
        run: |
          set -o pipefail
          if ! npm run build 2>&1 | tee build.log; then
            grep -E "ERROR|error TS|error NG|\[ERROR\]" -A3 build.log | head -60 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi
        working-directory: ./desktop
      - name: Generate coverage report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: desktop/coverage/receipt-wrangler-desktop/cobertura-coverage.xml
          format: markdown
          output: both
          badge: true

  # Flutter unit/widget tests. Fast and hermetic -- no emulator, no backend --
  # so unlike the advisory mobile-e2e workflow this one is gating.
  #
  # `flutter analyze` is deliberately NOT run here: it currently exits 1 on 111
  # pre-existing issues (0 errors), 78 of which are inside the generated client
  # under mobile/api/, which the repo forbids hand-editing. Gating on it would
  # fail the build for reasons unrelated to the change under test. Enabling it
  # means first excluding api/** in mobile/analysis_options.yaml (empty today)
  # and clearing the remainder in lib/ + test/.
  test-mobile:
    needs: detect-changes
    if: needs.detect-changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    # Least-privilege GITHUB_TOKEN: this job only reads the repo source. Mirrors
    # the same hardening applied to mobile-e2e.yml for the CodeQL
    # actions-missing-workflow-permissions alert.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Don't leave the token in .git/config for later steps to pick up
          # (zizmor "artipacked"); nothing here pushes.
          persist-credentials: false
      # Pinned to the same version as .github/workflows/mobile-e2e.yml -- keep
      # the two in sync so unit and e2e runs can't drift onto different SDKs.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
        working-directory: ./mobile
      - name: Run tests
        run: flutter test
        working-directory: ./mobile
