---
# Publishes this fork's monolith image to GitHub Container Registry, so the Synology runs a
# pre-built image (docker-compose.yml: image: ghcr.io/<owner>/cartvibe:latest) instead of
# building from source on the NAS.
#
# It runs after CI succeeds on main, so a commit whose tests fail never becomes :latest. The
# upstream project publishes to Docker Hub from ci.yml instead; this workflow is fork-only.
name: Publish image

on:
  workflow_run:
    workflows: ['CI - Build and Test']
    types: [completed]
    branches: [main]
  workflow_dispatch:
  # Weekly rebuild of main without the layer cache, so Debian security updates reach :latest even when no code changed
  # (the cached apt layers would otherwise keep the packages of the first build for ever).
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: publish-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: |
      github.repository_owner != 'Receipt-Wrangler' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit CI tested, not whatever main points at by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Image name and build info
        id: meta
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/cartvibe" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          # A manual run from a branch publishes :preview, never :latest, so trying a branch on the NAS
          # cannot replace what main published.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.ref_name }}" != "main" ]; then
            echo "tag=preview" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
          echo "date=$(date +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.sha }}
          build-args: |
            VERSION=sha-${{ steps.meta.outputs.sha }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          # Reuse the dependency layers between builds (see the note at the top of the Dockerfile).
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Always fetch the newest base images; the weekly run also rebuilds every layer.
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
      # A vulnerability report for what was just published (the run's Artifacts). It never fails the run: most findings
      # are Debian packages without a fix yet, and the report is read, not gated on.
      - name: Scan the image
        uses: anchore/scan-action@v7
        with:
          image: ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.sha }}
          fail-build: false
          output-format: table
          output-file: grype-report.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: grype-report-${{ steps.meta.outputs.tag }}-${{ steps.meta.outputs.sha }}
          path: grype-report.txt
          if-no-files-found: ignore
