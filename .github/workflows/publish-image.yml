---
# Publishes this fork's monolith image to GitHub Container Registry, so the Synology runs a
# pre-built image (docker-compose.yml: image: ghcr.io/<owner>/receipt-wrangler:latest) instead of
# building from source on the NAS.
#
# It runs after CI succeeds on main, so a commit whose tests fail never becomes :latest. The
# upstream project publishes to Docker Hub from ci.yml instead; this workflow is fork-only.
name: Publish image

on:
  workflow_run:
    workflows: ['CI - Build and Test']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: |
      github.repository_owner != 'Receipt-Wrangler' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI tested, not whatever main points at by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Image name and build info
        id: meta
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/receipt-wrangler" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          # A manual run from a branch publishes :preview, never :latest, so trying a branch on the NAS
          # cannot replace what main published.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.ref_name }}" != "main" ]; then
            echo "tag=preview" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
          echo "date=$(date +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3.8.0
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (amd64)
        uses: docker/build-push-action@v6.13.0
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.sha }}
          build-args: |
            VERSION=sha-${{ steps.meta.outputs.sha }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          # Reuse the dependency layers between builds (see the note at the top of the Dockerfile).
          cache-from: type=gha
          cache-to: type=gha,mode=max
