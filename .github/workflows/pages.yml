---
name: Project page

# site/ is an Astro project, and desktop/ is built a second time in its `demo` configuration (desktop/docs/demo.md) and
# published under /demo/ of the same artifact. Every push that touches either builds both; only main deploys.
on:
  push:
    branches: [main, 'feature/**']
    paths: ["site/**", "desktop/**", "CHANGELOG.md", ".github/workflows/pages.yml"]
  workflow_dispatch:
    inputs:
      shots:
        description: "Regenerate the site screenshots from the demo and commit them to this branch (not main)"
        type: boolean
        default: false
      only:
        description: "With shots: redo one screenshot only (SHOTS_ONLY, e.g. dashboard or dashboard-phone-dark)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || !inputs.shots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            desktop/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - name: Site unit tests (roadmap mapping, cache, changelog parser)
        run: npm test
        working-directory: site
      # The demo: the real app with an in-memory backend. The production build is made too, because the check below
      # proves the demo is not inside it.
      - run: npm ci
        working-directory: desktop
      - run: npm run build:demo
        working-directory: desktop
      - run: npm run build
        working-directory: desktop
      - name: The demo is compiled out of the production build
        run: npm run check:demo
        working-directory: desktop
      - name: Smoke-test the built demo
        run: |
          npx playwright install --with-deps chromium
          npm run e2e:demo
        working-directory: desktop
      # The site's browser tests borrow the Playwright and Chromium installed for the demo smoke test above.
      - name: Site browser tests (wordmark, footer, roadmap against a mocked GitHub, home page)
        run: npm run test:e2e
        working-directory: site
      - name: Publish the demo under /demo/
        run: |
          mkdir -p site/dist/demo
          cp -r desktop/dist/cartvibe-demo/browser/. site/dist/demo/
      # On a branch the built page is kept for three days, so it can be looked at before it reaches main.
      - uses: actions/upload-artifact@v7
        if: github.ref != 'refs/heads/main'
        with:
          name: site-preview
          path: site/dist
          retention-days: 3
      - uses: actions/configure-pages@v6
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: site/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # After a deploy, tell the IndexNow search engines (Bing and others) that the sitemap's pages changed
  # (site/tools/indexnow.mjs, docs/site.md "Search and sharing"). Only public URLs are sent. A failure here never fails
  # the deploy: the engines still find changes through the sitemap.
  indexnow:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: site/tools
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
      - run: node site/tools/indexnow.mjs

  # Manual: the site's screenshots come from a browser and Linux fonts, so CI takes them (site/tools/shots.mjs) and commits
  # the .webp files to the branch it was started on.
  shots:
    if: github.event_name == 'workflow_dispatch' && inputs.shots && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm ci
        working-directory: site
      - run: npm run build:demo
        working-directory: desktop
      - run: npx playwright install --with-deps chromium
        working-directory: desktop
      - name: Serve the demo and take the screenshots
        env:
          SHOTS_ONLY: ${{ inputs.only }}
        run: |
          node tools/serve-demo.cjs > /tmp/serve-demo.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4300/demo/ > /dev/null && break; sleep 1; done
          cd ../site
          npm run shots
        working-directory: desktop
      - name: Commit the screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/src/assets/shots
          git diff --cached --quiet && { echo "No change."; exit 0; }
          git commit -m "chore(site): regenerate the screenshots from the demo"
          git push
