---
# Regenerates desktop/src/open-api and mobile/api from api/swagger.yml and commits them back to the
# branch. It exists for machines without the generator toolchain (Java + Node + Dart): the clients
# are still produced by api/generate-client.sh, patches included, never edited by hand.
#
# A commit pushed with GITHUB_TOKEN does not trigger push workflows, so this dispatches CI itself
# once the regenerated clients are on the branch.
name: Regenerate API clients

on:
  push:
    branches: ['feature/**']
    paths:
      - 'api/swagger.yml'
  workflow_dispatch:

concurrency:
  group: regenerate-clients-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  regenerate:
    # Never commit to main from CI; regenerate on the feature branch and merge.
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Pinned to the same Flutter (and so Dart) as ci.yml: a different Dart resolution can
      # reformat unrelated .g.dart files.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: stable
          cache: true
      - name: Generate desktop client
        run: ./generate-client.sh desktop ../desktop/src/open-api
        working-directory: ./api
      - name: Generate mobile client (applies the dart-dio patches)
        run: ./generate-client.sh mobile ../mobile/api
        working-directory: ./api
      - name: Build mobile client serializers
        run: |
          dart pub get
          dart run build_runner build
        working-directory: ./mobile/api
      - name: Analyze mobile client (errors only)
        run: dart analyze --no-fatal-warnings
        working-directory: ./mobile/api
      - name: Commit regenerated clients
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/src/open-api mobile/api
          if git diff --cached --quiet; then
            echo "Clients already match swagger.yml"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Regenerate API clients from swagger.yml"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run CI against the regenerated clients
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "${GITHUB_REF_NAME}"
