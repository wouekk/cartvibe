# Regenerates desktop/src/open-api from api/swagger.yml and commits it back to the branch. It exists
# for machines without the generator toolchain (Java + Node): the client is still produced by
# api/generate-client.sh, never edited by hand.
#
# A commit pushed with GITHUB_TOKEN does not trigger push workflows, so this dispatches CI itself
# once the regenerated clients are on the branch.
name: Regenerate API clients

on:
  push:
    branches: ['feature/**']
    paths:
      - 'api/swagger.yml'
  workflow_dispatch:

concurrency:
  group: regenerate-clients-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  regenerate:
    # Never commit to main from CI; regenerate on the feature branch and merge.
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate desktop client
        run: ./generate-client.sh desktop ../desktop/src/open-api
        working-directory: ./api
      - name: Commit regenerated clients
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/src/open-api
          if git diff --cached --quiet; then
            echo "Clients already match swagger.yml"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Regenerate API clients from swagger.yml"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run CI against the regenerated clients
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref "${GITHUB_REF_NAME}"
