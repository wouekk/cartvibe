# HSTS only when the request reached the proxy over TLS (the Synology proxy sets X-Forwarded-Proto); an empty value
# makes nginx omit the header, so plain-http LAN use is unaffected.
map $http_x_forwarded_proto $hsts {
    https "max-age=31536000";
    default "";
}

# Define rate limits
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;        # General API rate limit
# /api/login throttle. 30 per minute with burst 10 (see location block
# below) — the e2e suite issues 3 logins per run (1 setup + 2 auth smoke
# tests), and we want headroom for accidental retries without making
# brute-force trivially cheap. Do not raise without considering both the
# e2e budget and the attacker's effective rate.
limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=signup:10m rate=2r/m;      # Very strict signup rate limit
limit_req_zone $binary_remote_addr zone=oauth:10m rate=30r/m;      # OAuth endpoints; authorize POST does credential auth
limit_req_zone $binary_remote_addr zone=recipe:10m rate=10r/m;     # Recipe preview: each call may make the API download a web page

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The client address behind a reverse proxy (the Synology proxy, Caddy on a VPS), so the rate limits above key
    # on each visitor rather than on the proxy. Only private networks are trusted to set X-Forwarded-For; a request
    # from a public address keeps its own address whatever header it sends.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # No nginx version in error pages and headers. The security headers apply to every response; a location that sets
    # its own add_header (the two cache rules below) must repeat them, because nginx does not inherit add_header then.
    server_tokens off;

    # A request over one of the limits above is told so (429 Too Many Requests), not that the server is down (nginx's
    # default 503).
    limit_req_status 429;

    # Compress text on the way out: the app's scripts and styles, the language files and the API's JSON. Debian's
    # nginx.conf switches gzip on for text/html only, which left about 1.5 MB of JavaScript uncompressed on a first
    # load. Set here, inside the server block, because `gzip on` at http level is already in nginx.conf and a
    # directive may not repeat at one level. Event streams, images, PDFs and ZIP exports are not in the list.
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml text/plain;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_vary on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security $hsts always;

    # Dotfiles and source maps are never served (the exact-match /.well-known locations below still win).
    location ~ /\.(?!well-known) { return 404; }
    location ~* \.map$ { return 404; }

    # Login endpoint with strict rate limiting
    location /api/login {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Signup endpoint with very strict rate limiting. The path is spelled as the API routes it (/api/signUp): nginx
    # matches a prefix case-sensitively, and under the old lowercase spelling this limit never applied.
    location /api/signUp {
        limit_req zone=signup burst=1 nodelay;  # Almost no burst allowed
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Recipe preview. The API downloads the page the person names, so this is throttled well below the general zone:
    # 10 a minute with a burst of 5 leaves room for a family pasting several links, and no use as a free page fetcher.
    location ~ ^/api/shopping-list/group/\d+/recipe/preview$ {
        client_max_body_size 512k;
        limit_req zone=recipe burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Shopping list live updates (SSE). Buffering is disabled and the read
    # timeout raised so events flush promptly and the stream stays open; the API
    # also sends X-Accel-Buffering: no and a heartbeat every 25s.
    location ~ ^/api/shopping-list/group/\d+/stream$ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Household export (Export & import tab). The ZIP can hold every photo, so it is passed through
    # unbuffered: buffered, nginx would spool it to disk and cut it at proxy_max_temp_file_size.
    location = /api/backup/export {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # Household import upload (Export & import tab): an export with every photo, up to 4 GB like the API's own
    # cap, passed through as it arrives instead of spooled to disk first.
    location = /api/backup/import {
        client_max_body_size 4G;
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # General API endpoints with more lenient rate limiting
    location /api/ {
        client_max_body_size 50M;
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- MCP integration (enabled at runtime via System Settings; the API returns
    #     404 on these paths while the MCP server is disabled) ---

    # OAuth 2.0 discovery documents (RFC 8414 / RFC 9728) must be served from
    # well-known root paths so MCP clients such as Claude can find them.
    location = /.well-known/oauth-authorization-server {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/oauth-protected-resource {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth registration, authorize (login), and token endpoints. Strict rate
    # limiting because the authorize POST authenticates user credentials.
    location /oauth/ {
        limit_req zone=oauth burst=10 nodelay;
        # No form-action here: the authorize POST redirects to the connector's own redirect_uri.
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP Streamable HTTP endpoint. Buffering is disabled and the read timeout
    # raised so long-lived SSE response streams flush promptly and stay open.
    location /mcp {
        client_max_body_size 50M;
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # The app shell is never served from a browser cache without asking the server first, so a new image shows
    # up on the next load (before this, browsers kept the old index.html, even in a private window).
    location / {
        client_max_body_size 50M;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security $hsts always;
        # Report-Only until the browser console is clean on the NAS; then rename to Content-Security-Policy.
        # The hash is the theme script in index.html (over LF text); `node tools/check-csp-hash.cjs` in desktop/ verifies it.
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'sha256-2LfBVcLipIidhV5/Z0O02r2VFRcgR7W7itOJ28eHqZg='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://images.openfoodfacts.org; font-src 'self' data:; connect-src 'self' https://world.openfoodfacts.org; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        try_files $uri $uri/ /index.html;
    }

    # Build output carries a content hash in its name (main-3FA9C1D2.js, chunk-_H_hYCWH.js, the fonts under /media/),
    # so it can be kept for a year. The hash is eight characters of A-Z, a-z, 0-9, "_" and "-".
    location ~ "-[A-Za-z0-9_-]{8}\.(js|css|woff2)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security $hsts always;
        try_files $uri =404;
    }
}
