# Synology stack. Paste this into Dockhand (or Container Manager) as a plain compose stack: the NAS
# only downloads the image GitHub publishes after CI passes on main (.github/workflows/
# publish-image.yml); nothing is built on the NAS. To update: pull the image, then redeploy (README, "Updating on a
# Synology").
services:
  cartvibe:
    image: ghcr.io/wouekk/cartvibe:latest
    # Asks the registry whenever compose itself brings the stack up. A stack manager's "redeploy" can still reuse the
    # image it already has, which is why the update steps pull first.
    pull_policy: always
    container_name: cartvibe
    restart: unless-stopped
    # Time to finish the requests in hand and stop the background jobs before Docker kills the container (the default is 10 s).
    stop_grace_period: 30s
    # Nothing in the container can gain more rights than it starts with, and it keeps only the capabilities its start
    # needs: handing the folders to the API's user and dropping to it, port 80 for that user where the Docker in
    # use still reserves low ports, and stopping the API. CI starts the image with exactly these (ci.yml,
    # "Start the app").
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
      - KILL
    ports:
      - "8091:80" # Change 8091 if that port is already used on your Synology
    environment:
      - TZ=Europe/Paris
      # Set both in Dockhand's environment variables. Use letters and digits only: compose reads a
      # "$" as the start of a variable name and silently drops it (write "$$" for a literal one). The deploy stops
      # with the message below when one is missing, rather than starting the app with an empty key.
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set}
      # Database: the built-in SQLite engine. The file lives in the sqlite volume below,
      # so keep DB_FILENAME the same across updates or the app starts with an empty database.
      - DB_ENGINE=sqlite
      - DB_FILENAME=app.db
      # Background jobs (reading receipts, reminders, clean-up) are kept in the same database: there is no second
      # service. A stack from before had a "valkey" service and a "valkey-data" volume; both can be deleted.
      # The API runs as this user and group, which must be able to write the three folders below. Set both in
      # Dockhand's environment variables, to the DSM user that owns the folders (`id <user>` over SSH, for example
      # 1026 and 100). Left unset, the image's own user (10001) is used. If the folders refuse the user, the container
      # does not start and its log says so: set these two. ALLOW_ROOT=1 runs the API as root instead, as versions
      # before 0.19 did by themselves; the About page then says so.
      - PUID=${PUID:-}
      - PGID=${PGID:-}
      - ALLOW_ROOT=${ALLOW_ROOT:-}
      # Optional: warranty reminders as device notifications (Web Push). Generate the pair once
      # (npx web-push generate-vapid-keys) and keep it; left empty, reminders stay in the app's notifications.
      # Device notifications also need the app served over HTTPS.
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
    volumes:
      # Left of the colon is the folder on the NAS: change /volume2 to the volume your "docker" shared folder is on
      # (often /volume1). The app also keeps its own database snapshots in sqlite/backups.
      - /volume2/docker/cartvibe/sqlite:/app/cartvibe-api/sqlite
      - /volume2/docker/cartvibe/data:/app/cartvibe-api/data
      - /volume2/docker/cartvibe/logs:/app/cartvibe-api/logs
