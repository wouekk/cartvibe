# Synology stack. Paste this into Dockhand (or Container Manager) as a plain compose stack: the NAS
# only downloads the image GitHub publishes after CI passes on main (.github/workflows/
# publish-image.yml); nothing is built on the NAS. To update, redeploy: pull_policy always fetches the newest image.
services:
  cartvibe:
    image: ghcr.io/wouekk/cartvibe:latest
    # Check the registry on every deploy, so a redeploy never reuses a cached older :latest.
    pull_policy: always
    container_name: cartvibe
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8091:80" # Change 8091 if that port is already used on your Synology
    environment:
      - TZ=Europe/Paris
      # Set both in Dockhand's environment variables. Use letters and digits only: compose reads a
      # "$" as the start of a variable name and silently drops it (write "$$" for a literal one).
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      # Database: the built-in SQLite engine. The file lives in the sqlite volume below,
      # so keep DB_FILENAME the same across updates or the app starts with an empty database.
      - DB_ENGINE=sqlite
      - DB_FILENAME=app.db
      # Background jobs (OCR, email polling, cleanup) queue through Redis. The image does not
      # include it, so it runs as the second service below.
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # The API runs as this user and group, which must be able to write the three folders below. Set both in
      # Dockhand's environment variables, to the DSM user that owns the folders (`id <user>` over SSH, for example
      # 1026 and 100). Left unset, the image's own user is tried, and the API falls back to root if the folders refuse it.
      - PUID=${PUID:-}
      - PGID=${PGID:-}
    volumes:
      - /volume2/docker/cartvibe/sqlite:/app/cartvibe-api/sqlite
      - /volume2/docker/cartvibe/data:/app/cartvibe-api/data
      - /volume2/docker/cartvibe/logs:/app/cartvibe-api/logs

  redis:
    image: redis:7.4-alpine
    container_name: cartvibe-redis
    restart: unless-stopped
    # Persist queued jobs across restarts.
    # tcp-backlog 128 matches the NAS kernel's somaxconn, which silences the "TCP backlog 511" warning; one household never needs more.
    command: ["redis-server", "--appendonly", "yes", "--tcp-backlog", "128"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      # A Docker-managed volume, so there is no NAS folder to create first.
      - redis-data:/data

volumes:
  redis-data:
