services:
  receipt-wrangler:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    container_name: receipt-wrangler
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8091:80" # Change 8091 if that port is already used on your Synology
    environment:
      - TZ=Europe/Paris
      # Generate two random 32+ character strings in Dockhand environment variables:
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      # Database: the built-in SQLite engine. The file lives in the sqlite volume below,
      # so keep DB_FILENAME the same across rebuilds or the app starts with an empty database.
      - DB_ENGINE=sqlite
      - DB_FILENAME=app.db
      # Background jobs (OCR, email polling, cleanup) queue through Redis. The image does not
      # include it, so it runs as the second service below.
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - /volume2/docker/receipt-wrangler/sqlite:/app/receipt-wrangler-api/sqlite
      - /volume2/docker/receipt-wrangler/data:/app/receipt-wrangler-api/data
      - /volume2/docker/receipt-wrangler/logs:/app/receipt-wrangler-api/logs

  redis:
    image: redis:7.4-alpine
    container_name: receipt-wrangler-redis
    restart: unless-stopped
    # Persist queued jobs across restarts.
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      # A Docker-managed volume, so there is no NAS folder to create first.
      - redis-data:/data

volumes:
  redis-data:
