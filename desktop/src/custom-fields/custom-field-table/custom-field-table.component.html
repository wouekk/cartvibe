<app-settings-page
  width="wide"
  title="Custom Fields"
  description="Capture extra structured data on receipts with custom fields."
>
  <div settingsActions class="contents">
    <app-add-button
      *hasAppPermission="Permission.AppCustomFieldsCreate"
      data-testid="custom-field-add"
      [buttonText]="'Add Custom Field' | t"
      (clicked)="openCustomFieldDialog()"
      [tooltip]="'Add Custom Field' | t"
    >
    </app-add-button>
  </div>
  <app-settings-entity-list>
    <app-table
      [columns]="columns"
      [dataSource]="dataSource()"
      [displayedColumns]="displayedColumns"
      [length]="totalCount()"
      [pageSize]="state()?.pageSize ?? 1"
      [page]="(state()?.page ?? 1) - 1"
      [pagination]="true"
      (pageChange)="updatePageData($event)"
      (sorted)="sorted({sortState : $event})"
    ></app-table>
  </app-settings-entity-list>
</app-settings-page>

<ng-template #nameCell let-element="element">
  <button type="button" class="cursor-pointer border-0 bg-transparent p-0 text-left text-primary hover:underline" (click)="openCustomFieldDialog(element)">{{ element.name }}</button>
</ng-template>

<ng-template #typeCell let-element="element">
  {{ element.type | customFieldType }}
</ng-template>

<ng-template #descriptionCell let-element="element">
  {{ element.description }}
</ng-template>

<ng-template #actionsCell let-element="element" let-index="index">
  <app-edit-button
    *hasAppPermission="Permission.AppCustomFieldsUpdate"
    data-testid="custom-field-edit"
    color="accent"
    [tooltip]="'Edit custom field' | t"
    (clicked)="openCustomFieldDialog(element, FormMode.edit)"
  >
  </app-edit-button>
  <app-delete-button
    *hasAppPermission="Permission.AppCustomFieldsDelete"
    data-testid="custom-field-delete"
    [tooltip]="'Delete custom field' | t"
    (clicked)="openDeleteConfirmationDialog(element)"
  >
  </app-delete-button>
</ng-template>
