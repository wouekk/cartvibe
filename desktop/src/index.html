<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CartVibe</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <!--
      The stored mode (light, dark or system), applied before the first paint so the page does not flash. The Theme
      tab in User Settings (ThemeService) writes the same key and keeps the class in step afterwards.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        var mode = "system";
        try {
          var storedMode = window.localStorage.getItem("rw_theme_mode");
          if (storedMode === "light" || storedMode === "dark") {
            mode = storedMode;
          }
        } catch (e) {}
        var dark =
          mode === "dark" ||
          (mode === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) {
          root.classList.add("dark");
        }
        root.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
  </head>
  <body class="mat-typography">
    <app-root></app-root>

    <!-- CSS cannot select by text, so a badge that says "0" gets a class (see the rule above). -->
    <script>
      (function () {
        function mark() {
          var badges = document.querySelectorAll(".mat-badge-content");
          for (var i = 0; i < badges.length; i++) {
            var text = (badges[i].textContent || "").trim();
            badges[i].classList.toggle("rw-badge-empty", text === "" || text === "0");
          }
        }
        new MutationObserver(mark).observe(document.body, { childList: true, subtree: true, characterData: true });
        mark();
      })();
    </script>
  </body>
</html>
