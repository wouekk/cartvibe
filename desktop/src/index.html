<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CartVibe</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <!--
      The stored look, applied before the first paint so neither the accent nor the dark mode flashes. The
      Theme tab in User Settings (ThemeService) writes the same two keys and keeps them in step afterwards.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        var accents = ["classic", "emerald", "violet", "brown", "graphite"];
        var legacy = { blue: "classic", green: "emerald", amber: "classic", indigo: "violet" };
        var accent = "classic";
        var mode = "system";
        try {
          var storedAccent = window.localStorage.getItem("rw_accent_theme");
          storedAccent = legacy[storedAccent] || storedAccent;
          if (accents.indexOf(storedAccent) > -1) {
            accent = storedAccent;
          }
          var storedMode = window.localStorage.getItem("rw_theme_mode");
          if (storedMode === "light" || storedMode === "dark") {
            mode = storedMode;
          }
        } catch (e) {}
        var dark =
          mode === "dark" ||
          (mode === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) {
          root.classList.add("dark");
        }
        root.setAttribute("data-theme", dark ? "dark" : "light");
        root.setAttribute("data-accent", accent);
      })();
    </script>

    <!-- Tailwind CSS is built with the app (src/tailwind.css, prefix "tw-", no Preflight); the shadcn/ui tokens are in src/skin.css. -->

    <style>
      /* ---------- Accent themes (the Theme tab in User Settings writes data-accent on <html>) ----------
         --accent-color / --accent-hover: buttons, active items, links. --accent-soft: tinted backgrounds.
         --chart-good: the "good" color of the bars, picked to contrast with the accent (bad is always red). */
      :root,
      :root[data-accent="classic"] {
        --accent-color: #0086d4;
        --accent-hover: #0072b4;
        --accent-light: #38bdf8;
        --accent-soft: rgba(0, 134, 212, 0.12);
        --chart-good: #10b981;
        --accent-button: #0077bd;
        --accent-button-hover: #00659f;
        --shell-bg: #eff6fb;
        --sidebar-bg: #0d2433;
        --sidebar-raised: #12303f;
        --sidebar-active: #1a3f52;
        --sidebar-border: #28566e;
      }
      :root[data-accent="emerald"] {
        --accent-color: #059669;
        --accent-hover: #047857;
        --accent-light: #34d399;
        --accent-soft: rgba(5, 150, 105, 0.12);
        --chart-good: #0ea5e9;
        --accent-button: #047857;
        --accent-button-hover: #065f46;
        --shell-bg: #eff7f3;
        --sidebar-bg: #0b2a22;
        --sidebar-raised: #10372c;
        --sidebar-active: #17463a;
        --sidebar-border: #245e4f;
      }
      :root[data-accent="violet"] {
        --accent-color: #6457d3;
        --accent-hover: #5347b8;
        --accent-light: #9a8cf5;
        --accent-soft: rgba(100, 87, 211, 0.16);
        --chart-good: #14b8a6;
        --accent-button: #6457d3;
        --accent-button-hover: #5347b8;
        --shell-bg: #f0eefc;
        --sidebar-bg: #1b1838;
        --sidebar-raised: #231f48;
        --sidebar-active: #342f75;
        --sidebar-border: #4b4695;
      }
      :root[data-accent="brown"] {
        --accent-color: #8b5e3c;
        --accent-hover: #734c2f;
        --accent-light: #c4956f;
        --accent-soft: rgba(139, 94, 60, 0.14);
        --chart-good: #14b8a6;
        --accent-button: #8b5e3c;
        --accent-button-hover: #734c2f;
        --shell-bg: #f7f3ee;
        --sidebar-bg: #2a1e16;
        --sidebar-raised: #35271d;
        --sidebar-active: #45342a;
        --sidebar-border: #5d4637;
      }
      :root[data-accent="graphite"] {
        --accent-color: #475569;
        --accent-hover: #334155;
        --accent-light: #94a3b8;
        --accent-soft: rgba(71, 85, 105, 0.14);
        --chart-good: #0ea5e9;
        --accent-button: #475569;
        --accent-button-hover: #334155;
        --shell-bg: #f1f4f8;
        --sidebar-bg: #1c2430;
        --sidebar-raised: #232d3b;
        --sidebar-active: #2b3647;
        --sidebar-border: #334155;
      }

      :root {
        --rw-font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --rw-ring: rgba(228, 228, 231, 0.8);
        --rw-card-bg: rgba(255, 255, 255, 0.82);
        --rw-card-shadow: 0 0 0 1px var(--rw-ring), 0 1px 2px rgba(24, 24, 27, 0.04), 0 4px 14px rgba(24, 24, 27, 0.05);
        --rw-text-strong: #0f172a;
        --rw-text: #334155;
        --rw-text-muted: #64748b;
      }

      /* ---------- Dark mode ----------
         The page is drawn light and the whole thing is inverted with the hue turned back, which darkens every
         surface (including the dozens a component paints white on its own) and keeps every hue: a red stays
         red, an accent stays its accent, only lighter or darker. What must keep its authored colors is
         inverted a second time: the sidebar, pictures, the QR code, the logo. */
      html.dark {
        color-scheme: light;
        filter: invert(1) hue-rotate(180deg) contrast(0.7);
        --rw-ring: rgba(190, 198, 212, 0.9);
        --rw-card-bg: rgba(232, 237, 244, 0.9);
        --rw-card-shadow: 0 0 0 1px var(--rw-ring), 0 1px 2px rgba(0, 0, 0, 0.12), 0 4px 14px rgba(0, 0, 0, 0.1);
      }
      html.dark img,
      html.dark picture,
      html.dark video,
      html.dark canvas,
      html.dark mat-drawer.app-sidebar,
      html.dark app-cartvibe-logo,
      html.dark app-cartvibe-icon,
      html.dark app-cartvibe-loader,
      html.dark app-image-canvas,
      html.dark .rw-keep-colors {
        filter: contrast(1.4286) hue-rotate(180deg) invert(1);
      }
      /* A backdrop blur inside an inverted page can paint outside the filter; the surfaces are opaque anyway. */
      html.dark * {
        -webkit-backdrop-filter: none !important;
        backdrop-filter: none !important;
      }
      /* The CartVibe logo, icon and loaders carry their own light and dark palettes (switched by the dark class),
         so they are drawn in their real colors and never inverted. */

      /*
        Visual skin only: colors, translucency, fonts, weights, tracking, border colors, radii, shadows and
        transitions. Nothing below sets a width, height, margin, padding, display, flex/grid or position on an
        app element. Card outlines are a 1px shadow ring rather than a border, because a border would add a
        pixel to the box and move things.
      */

      /* ---------- The shell follows the theme: tinted page, deep-shade sidebar (see --shell-bg, --sidebar-*) ----------
         White cards stay neutral on the tinted page, which is the contrast that makes them read as surfaces.
         The tint also covers the strip a hidden sidebar leaves behind, so nothing is left unstyled. */
      body,
      .mat-app-background,
      .mat-drawer-container,
      .mat-drawer-content,
      .mat-sidenav-container,
      .mat-sidenav-content {
        background-color: var(--shell-bg) !important;
      }
      .mat-drawer-container {
        color: var(--rw-text);
      }
      /* ---------- Typography (the system font) ---------- */
      body,
      .mat-typography,
      .mat-mdc-button,
      .mat-mdc-raised-button,
      .mat-mdc-unelevated-button,
      .mat-mdc-outlined-button,
      .mat-mdc-form-field,
      .mdc-text-field,
      .mat-mdc-table,
      .mat-mdc-menu-item,
      .mat-mdc-option,
      .mat-mdc-tab-link,
      .mat-mdc-dialog-container,
      input,
      textarea,
      select,
      button {
        font-family: var(--rw-font-sans) !important;
        -webkit-font-smoothing: antialiased;
      }
      body {
        color: var(--rw-text);
      }
      h1,
      h2,
      h3,
      h4,
      .mat-mdc-dialog-title {
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--rw-text-strong);
      }
      .tile__label,
      .muted,
      .text-muted,
      .mat-mdc-form-field-hint,
      .donut__caption,
      th.mat-mdc-header-cell {
        color: var(--rw-text-muted);
      }
      /* Numbers: tabular, and crisp. KPI figures, amounts, shares, dates, chart labels and table cells. */
      .tile__value,
      .tile__hint,
      .donut__total,
      .donut__legend,
      .donut__legend td,
      .bars__value,
      .bars__label,
      .receipts td,
      .numeric,
      .list-card__count,
      .mat-mdc-cell,
      .mat-mdc-header-cell,
      time {
        font-variant-numeric: tabular-nums;
      }
      .tile__value:not(.tile__value--warning):not(.tile__value--over),
      .donut__total,
      .donut__legend td,
      .bars__value,
      .bars__label,
      .receipts td,
      .mat-mdc-cell {
        color: var(--rw-text-strong);
      }
      .tile__value,
      .donut__total,
      .bars__value,
      .bars__label,
      .donut__legend td.strong {
        font-weight: 600;
      }
      /* Semantic metrics keep their meaning whatever the accent is. */
      .tile__value--warning,
      .tile__hint--up {
        color: #ea580c !important;
      }

      /* ---------- Cards, panels and tables ---------- */
      .card,
      .tile,
      .settings-card,
      .rw-card,
      .mat-mdc-card,
      .table-container {
        border-radius: 16px !important;
        box-shadow: var(--rw-card-shadow) !important;
        background-color: var(--rw-card-bg) !important;
        -webkit-backdrop-filter: saturate(160%) blur(12px);
        backdrop-filter: saturate(160%) blur(12px);
      }
      .tile--link:hover {
        box-shadow: 0 0 0 1px var(--rw-ring), 0 2px 4px rgba(24, 24, 27, 0.05), 0 10px 24px rgba(24, 24, 27, 0.08) !important;
      }
      .mat-mdc-dialog-surface {
        border-radius: 18px !important;
      }
      .filter-bar {
        border-radius: 10px;
      }
      .filter-tab {
        border-radius: 7px;
      }

      /* ---------- Buttons and inputs ---------- */
      .mat-mdc-raised-button,
      .mat-mdc-unelevated-button,
      .mat-mdc-outlined-button,
      .mat-mdc-button:not(.mat-mdc-icon-button) {
        border-radius: 10px !important;
      }
      .mat-mdc-button-base {
        transition: background-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease,
          transform 0.15s ease;
      }
      .mat-mdc-button-base:not(:disabled):not([disabled]):active {
        transform: scale(0.98);
      }
      .mat-mdc-outlined-button {
        border-color: #d4d4d8 !important;
      }
      .mat-mdc-form-field {
        --mdc-outlined-text-field-container-shape: 10px;
        --mdc-outlined-text-field-outline-color: #d4d4d8;
        --mdc-outlined-text-field-hover-outline-color: #a1a1aa;
        --mdc-outlined-text-field-focus-outline-color: var(--accent-color);
        --mdc-outlined-text-field-focus-label-text-color: var(--accent-color);
        --mdc-outlined-text-field-caret-color: var(--accent-color);
        --mdc-filled-text-field-focus-active-indicator-color: var(--accent-color);
        --mdc-filled-text-field-caret-color: var(--accent-color);
      }
      input,
      textarea,
      select {
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }
      :focus-visible {
        outline-color: var(--accent-color);
      }

      /* ---------- Accent: every primary control ---------- */
      .mat-mdc-raised-button.mat-primary:not([disabled]),
      .mat-mdc-unelevated-button.mat-primary:not([disabled]),
      .mat-mdc-fab.mat-primary:not([disabled]),
      .mat-mdc-mini-fab.mat-primary:not([disabled]) {
        --mdc-protected-button-container-color: var(--accent-button);
        --mdc-filled-button-container-color: var(--accent-button);
        --mdc-fab-container-color: var(--accent-button);
        --mdc-fab-small-container-color: var(--accent-button);
        background-color: var(--accent-button) !important;
        background-image: none !important;
        color: #fff;
      }
      .mat-mdc-raised-button.mat-primary:not([disabled]):hover,
      .mat-mdc-unelevated-button.mat-primary:not([disabled]):hover,
      .mat-mdc-fab.mat-primary:not([disabled]):hover,
      .mat-mdc-mini-fab.mat-primary:not([disabled]):hover {
        background-color: var(--accent-button-hover) !important;
      }
      .mat-mdc-raised-button.mat-primary .mdc-button__label,
      .mat-mdc-unelevated-button.mat-primary .mdc-button__label,
      .mat-mdc-raised-button.mat-primary .mat-icon,
      .mat-mdc-unelevated-button.mat-primary .mat-icon {
        color: #fff;
      }
      .mat-mdc-button.mat-primary,
      .mat-mdc-outlined-button.mat-primary,
      .mat-mdc-icon-button.mat-primary,
      .mat-icon.mat-primary {
        --mdc-text-button-label-text-color: var(--accent-color);
        --mdc-outlined-button-label-text-color: var(--accent-color);
        --mdc-icon-button-icon-color: var(--accent-color);
        color: var(--accent-color);
      }
      /* Buttons asking for the "accent" color follow the theme too, not only the primary ones. */
      .mat-mdc-raised-button.mat-accent:not([disabled]),
      .mat-mdc-unelevated-button.mat-accent:not([disabled]),
      .mat-mdc-fab.mat-accent:not([disabled]),
      .mat-mdc-mini-fab.mat-accent:not([disabled]) {
        --mdc-protected-button-container-color: var(--accent-button);
        --mdc-filled-button-container-color: var(--accent-button);
        --mdc-fab-container-color: var(--accent-button);
        --mdc-fab-small-container-color: var(--accent-button);
        background-color: var(--accent-button) !important;
        background-image: none !important;
        color: #fff;
      }
      .mat-mdc-raised-button.mat-accent:not([disabled]):hover,
      .mat-mdc-unelevated-button.mat-accent:not([disabled]):hover,
      .mat-mdc-fab.mat-accent:not([disabled]):hover,
      .mat-mdc-mini-fab.mat-accent:not([disabled]):hover {
        background-color: var(--accent-button-hover) !important;
      }
      .mat-mdc-raised-button.mat-accent .mdc-button__label,
      .mat-mdc-unelevated-button.mat-accent .mdc-button__label,
      .mat-mdc-raised-button.mat-accent .mat-icon,
      .mat-mdc-unelevated-button.mat-accent .mat-icon {
        color: #fff;
      }
      .mat-mdc-button.mat-accent,
      .mat-mdc-outlined-button.mat-accent,
      .mat-mdc-icon-button.mat-accent,
      .mat-icon.mat-accent {
        --mdc-text-button-label-text-color: var(--accent-color);
        --mdc-outlined-button-label-text-color: var(--accent-color);
        --mdc-icon-button-icon-color: var(--accent-color);
        color: var(--accent-color);
      }
      .mat-mdc-outlined-button.mat-primary,
      .mat-mdc-outlined-button.mat-accent {
        border-color: var(--accent-color) !important;
      }
      /* The theme choices in User Settings: a visible hover and a tinted selected row. */
      .mat-mdc-button:not(.mat-mdc-icon-button):hover,
      .mat-mdc-icon-button:hover {
        background-color: var(--accent-soft);
      }
      .mat-badge-content:not(.mat-badge-warn):not(.mat-badge-accent) {
        background-color: var(--accent-color);
      }

      /* ---------- Accent: navigation, tabs, links, toggles ---------- */
      .sidebar__link--active {
        box-shadow: inset 3px 0 0 var(--accent-color);
      }
      .sidebar__link--active mat-icon,
      .sidebar__link--active .mat-icon {
        color: var(--accent-light) !important;
      }
      .filter-tab.active {
        color: var(--accent-color) !important;
        box-shadow: 0 0 0 1px var(--accent-soft), 0 1px 2px rgba(24, 24, 27, 0.08);
      }
      .filter-tab.active .pill {
        background: var(--accent-soft) !important;
        color: var(--accent-color) !important;
      }
      nav.mat-mdc-tab-nav-bar .mat-mdc-tab-link.mdc-tab--active {
        box-shadow: 0 0 0 1px var(--accent-soft), 0 1px 2px rgba(24, 24, 27, 0.08);
      }
      nav.mat-mdc-tab-nav-bar .mat-mdc-tab-link.mdc-tab--active .mdc-tab__text-label {
        color: var(--accent-color) !important;
      }
      .card__header a,
      .settings-card a,
      .receipts a,
      .table-container a:not(.mat-mdc-button-base),
      .link-button {
        color: var(--accent-color);
        transition: color 0.2s ease;
      }
      .card__header a:hover,
      .settings-card a:hover,
      .receipts a:hover,
      .table-container a:not(.mat-mdc-button-base):hover,
      .link-button:hover {
        color: var(--accent-hover);
      }
      .list-card__icon {
        color: var(--accent-color) !important;
      }
      .mat-mdc-checkbox.mat-primary,
      .mat-mdc-radio-button.mat-primary,
      .mat-mdc-slide-toggle.mat-primary,
      .mat-mdc-progress-bar.mat-primary,
      .mat-mdc-progress-spinner.mat-primary {
        --mdc-checkbox-selected-icon-color: var(--accent-color);
        --mdc-checkbox-selected-focus-icon-color: var(--accent-color);
        --mdc-checkbox-selected-hover-icon-color: var(--accent-color);
        --mdc-checkbox-selected-pressed-icon-color: var(--accent-color);
        --mdc-radio-selected-icon-color: var(--accent-color);
        --mdc-radio-selected-focus-icon-color: var(--accent-color);
        --mdc-radio-selected-hover-icon-color: var(--accent-color);
        --mdc-switch-selected-handle-color: var(--accent-color);
        --mdc-switch-selected-track-color: var(--accent-soft);
        --mdc-linear-progress-active-indicator-color: var(--accent-color);
        --mdc-circular-progress-active-indicator-color: var(--accent-color);
      }

      /* ---------- Charts keep their own colors ----------
         The donut slices are fixed hues set in code and are never recolored here. The month bars use
         --chart-good (a color that contrasts with the accent) and the Spent card's bar the same; over the
         goal is always red. */

      /* ---------- A badge that counts nothing is not shown ---------- */
      .mat-badge-hidden .mat-badge-content,
      .mat-badge-content:empty,
      .mat-badge-content.rw-badge-empty {
        display: none !important;
      }

      /* ---------- Polish (colors, radii, shadows and transitions only; no spacing or layout) ---------- */
      ::selection {
        background: var(--accent-soft);
      }
      .mat-mdc-row,
      .mat-mdc-header-row {
        transition: background-color 0.15s ease;
      }
      .mat-mdc-row:hover {
        background-color: var(--accent-soft);
      }
      .mat-mdc-header-cell {
        letter-spacing: 0.04em;
        font-weight: 600;
      }
      .mat-mdc-menu-panel,
      .mat-mdc-autocomplete-panel,
      .mat-mdc-select-panel {
        border-radius: 14px !important;
        box-shadow: 0 0 0 1px var(--rw-ring), 0 10px 30px rgba(24, 24, 27, 0.12) !important;
      }
      .mat-mdc-form-field.mat-focused .mdc-notched-outline {
        filter: drop-shadow(0 0 3px var(--accent-soft));
      }
      .sidebar__link {
        border-radius: 10px;
        transition: background-color 0.15s ease, color 0.15s ease;
      }
      .mat-mdc-chip {
        transition: background-color 0.15s ease, box-shadow 0.15s ease;
      }
      * {
        scrollbar-width: thin;
        scrollbar-color: rgba(100, 116, 139, 0.45) transparent;
      }

      @media print {
        html.dark {
          filter: none;
        }
      }
    </style>
  </head>
  <body class="mat-typography">
    <app-root></app-root>

    <!-- CSS cannot select by text, so a badge that says "0" gets a class (see the rule above). -->
    <script>
      (function () {
        function mark() {
          var badges = document.querySelectorAll(".mat-badge-content");
          for (var i = 0; i < badges.length; i++) {
            var text = (badges[i].textContent || "").trim();
            badges[i].classList.toggle("rw-badge-empty", text === "" || text === "0");
          }
        }
        new MutationObserver(mark).observe(document.body, { childList: true, subtree: true, characterData: true });
        mark();
      })();
    </script>
  </body>
</html>
