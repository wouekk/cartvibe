<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CartVibe</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <!--
      The stored theme, applied before the first paint so the page does not flash. ThemeService (src/theme) writes the
      same keys and keeps them in step afterwards: rw_theme_mode is "system" or a theme key, rw_theme_scheme the
      stored theme's scheme ("light" or "dark"), so this needs no copy of the theme list.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        var key = "light";
        var dark = false;
        try {
          var mode = window.localStorage.getItem("rw_theme_mode");
          var systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (!mode || mode === "system") {
            dark = systemDark;
            key = dark ? "dark" : "light";
          } else {
            key = mode;
            dark = window.localStorage.getItem("rw_theme_scheme") === "dark";
          }
        } catch (e) {}
        if (dark) {
          root.classList.add("dark");
        }
        root.setAttribute("data-theme", key);
      })();
    </script>
  </head>
  <body class="mat-typography">
    <app-root></app-root>

    <!-- CSS cannot select by text, so a badge that says "0" gets a class (see the rule above). -->
    <script>
      (function () {
        function mark() {
          var badges = document.querySelectorAll(".mat-badge-content");
          for (var i = 0; i < badges.length; i++) {
            var text = (badges[i].textContent || "").trim();
            badges[i].classList.toggle("rw-badge-empty", text === "" || text === "0");
          }
        }
        new MutationObserver(mark).observe(document.body, { childList: true, subtree: true, characterData: true });
        mark();
      })();
    </script>
  </body>
</html>
