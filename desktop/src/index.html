<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CartVibe</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/brand/pwa/apple-touch-icon.png" />
    <meta name="theme-color" content="#151920" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CartVibe" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/svg+xml" href="assets/brand/icon-dark.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="assets/brand/icon-light.svg" media="(prefers-color-scheme: dark)" />

    <!--
      The stored theme, applied before the first paint so the page does not flash. ThemeService (src/theme) writes the
      same keys and keeps them in step afterwards: rw_theme_mode is "system" or a theme key, rw_theme_scheme the
      stored theme's scheme ("light" or "dark"), so this needs no copy of the theme list.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        var key = "light";
        var dark = false;
        try {
          var mode = window.localStorage.getItem("rw_theme_mode");
          var systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (!mode || mode === "system") {
            dark = systemDark;
            key = dark ? "dark" : "light";
          } else {
            key = mode;
            dark = window.localStorage.getItem("rw_theme_scheme") === "dark";
          }
        } catch (e) {}
        if (dark) {
          root.classList.add("dark");
        }
        root.setAttribute("data-theme", key);
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>

  </body>
</html>
