<div class="flex items-center gap-1">
  <label
    class="flex cursor-pointer items-center gap-2 text-sm leading-none"
    [class.pointer-events-none]="readonly"
    [class.opacity-60]="inputFormControl.disabled"
  >
    <hlm-checkbox [formControl]="inputFormControl" (keydown)="handleKeydown($event)" />
    <span>{{ label }}</span>
  </label>
  <app-help-icon [helpText]="helpText"></app-help-icon>
</div>
