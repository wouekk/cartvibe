<app-settings-page
  width="wide"
  title="Management"
  description="Households organize receipts and the people who share them."
>
  <app-management-tabs settingsTabs></app-management-tabs>
  <div settingsActions class="contents">
    <app-add-button
      *hasAppPermission="Permission.AppGroupsCreate"
      data-testid="group-create"
      [buttonText]="'Add Household' | t"
      [tooltip]="'Add Household' | t"
      [buttonRouterLink]="['create']"
    ></app-add-button>
  </div>
  <app-settings-entity-list>
    <app-table
      [dataSource]="dataSource()"
      [columns]="columns"
      [displayedColumns]="columns.length ? visibleColumns() : []"
      [pagination]="true"
      [length]="totalCount()"
      [page]="((baseTableService.page$ | async) || 1) - 1"
      [pageSize]="(baseTableService.pageSize$ | async) || 10"
      [emptyText]="loaded() ? emptyText : ''"
      (sorted)="sorted($event)"
      (pageChange)="pageChanged($event)"
    ></app-table>
  </app-settings-entity-list>
</app-settings-page>

<ng-template #nameCell let-element="element" let-index="index">
  <span class="flex min-w-0 items-center gap-2">
    <app-avatar class="shrink-0" size="sm" [group]="element"></app-avatar>
    <a class="truncate" [routerLink]="['/groups/' + element.id + '/details/view']">
      {{ element.name }}
    </a>
  </span>
</ng-template>

<ng-template #numberOfMembersCell let-element="element" let-index="index">
  {{ element.groupMembers.length }}
</ng-template>

<ng-template #createdAtCell let-element="element" let-index="index">
  {{ element.createdAt | appDate : "short" }}
</ng-template>

<ng-template #updatedAtCell let-element="element" let-index="index">
  {{ element.updatedAt | appDate : "short" }}
</ng-template>

<!--
  One trailing more_vert menu per row (DESIGN.md, Rows), so the actions stay in reach on a phone. Edit opens the
  household's page, where its name is changed; the synthetic "All" group is never listed here.
-->
<ng-template #actionsCell let-element="element" let-index="index">
  @if (canEdit(element) || canDelete(element)) {
    <button
      hlmBtn variant="ghost" size="icon"
      type="button"
      class="-my-1 size-8 shrink-0"
      data-testid="group-menu"
      [attr.aria-label]="'Household actions' | t"
      [hlmDropdownMenuTrigger]="groupMenu" align="end"
      [hlmDropdownMenuTriggerData]="{ group: element, index: index }"
    >
      <app-icon name="more_vert"></app-icon>
    </button>
  }
</ng-template>

<ng-template #groupMenu let-group="group" let-index="index">
  <div hlmDropdownMenu class="w-56">
    @if (canEdit(group)) {
      <button
        hlmDropdownMenuItem
        data-testid="group-edit"
        (click)="editGroup(group)"
      >
        <app-icon name="edit"></app-icon>
        <span>{{ 'Edit' | t }}</span>
      </button>
    }
    @if (canDelete(group)) {
      <button
        hlmDropdownMenuItem
        variant="destructive"
        data-testid="group-delete"
        [disabled]="deleteDisabled()"
        (click)="deleteGroup(index)"
      >
        <app-icon name="delete"></app-icon>
        <span>{{ 'Delete' | t }}</span>
      </button>
    }
  </div>
</ng-template>
