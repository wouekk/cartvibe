<ng-template #householdForm>
  <app-form
    [formConfig]="formConfig"
    [form]="form"
    [formTemplate]="formTemplate"
    [canEdit]="canEdit()"
    [settingsCard]="true"
    [settingsTitle]="formConfig.mode === 'add' ? 'Add Household' : 'Household'"
    [editButtonRouterLink]="[editLink]"
    [editButtonQueryParams]="{tab: 'details'}"
    (submitted)="submit()"
  ></app-form>
</ng-template>

@if (formConfig.mode === 'add') {
  <app-settings-page title="Add Household" description="Name it, then add the people who share its receipts.">
    <ng-container [ngTemplateOutlet]="householdForm"></ng-container>
  </app-settings-page>
} @else {
  <ng-container [ngTemplateOutlet]="householdForm"></ng-container>
}

<ng-template #formTemplate>
    <app-audit-detail-section
      [data]="originalGroup"
      [formMode]="formConfig.mode"
    ></app-audit-detail-section>
    <app-form-section [panel]="true" [headerText]="'Group Details' | t" [indent]="true">
      <app-input
        [label]="'Group Name' | t"
        [readonly]="formConfig.mode | inputReadonly"
        [inputFormControl]="form | formGet : 'name'"
      ></app-input>
      <app-select
        [label]="'Status' | t"
        optionValueKey="value"
        optionDisplayKey="displayValue"
        [inputFormControl]="form | formGet : 'status'"
        [options]="groupStatusOptions"
      ></app-select>
      <app-checkbox
        [label]="'Isolate members' | t"
        [helpText]="'When on, members of this group can\'t see each other. Members with a role that can see all members remain visible to everyone.' | t"
        [readonly]="formConfig.mode | inputReadonly"
        [inputFormControl]="form | formGet : 'isolateMembers'"
      ></app-checkbox>
    </app-form-section>
    <app-form-section
      [panel]="true"
      [headerText]="'Group Members' | t"
      [headerButtonsTemplate]="buttonTemplate"
      [indent]="true"
    >
      <app-table
        [columns]="columns"
        [dataSource]="dataSource()"
        [displayedColumns]="displayedColumns"
        (sorted)="sortName($event)"
      >
      </app-table>
    </app-form-section>
</ng-template>

<ng-template #buttonTemplate>
  <app-button
    *ngIf="!(formConfig.mode | inputReadonly) && canCreateGroupMembers()"
    data-testid="add-group-member"
    matButtonType="iconButton"
    icon="add"
    color="accent"
    [tooltip]="'Add User to Group' | t"
    (clicked)="addGroupMemberClicked()"
  ></app-button>
</ng-template>

<ng-template #nameCell let-element="element">
  {{ (element.userId | user)?.displayName }}
</ng-template>

<ng-template #roleCell let-element="element">
  {{ element.groupRoleId | roleName : roles() : PermissionScope.Group }}
</ng-template>

<ng-template #actionsCell let-index="index">
  <div class="flex">
    <app-edit-button
      *ngIf="canUpdateGroupMembers()"
      data-testid="group-member-edit"
      [tooltip]="'Edit group member' | t"
      color="accent"
      (clicked)="editGroupMemberClicked(index)"
    ></app-edit-button>
    <app-delete-button
      *ngIf="canDeleteGroupMembers()"
      [tooltip]="'Remove group member' | t"
      [disabled]="disableDeleteButton"
      (clicked)="removeGroupMember(index)"
    ></app-delete-button>
  </div>
</ng-template>
