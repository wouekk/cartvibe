<app-dialog [headerText]="headerText">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="flex">
      <app-user-autocomplete
        class="me-2"
        [label]="'User' | t"
        [inputFormControl]="form | formGet : 'userId'"
        [usersToOmit]="usersToOmit"
      ></app-user-autocomplete>
      <app-select
        class="me-1 grow"
        [label]="'Role' | t"
        optionValueKey="id"
        optionDisplayKey="name"
        [options]="groupRoleOptions()"
        [inputFormControl]="form | formGet : 'groupRoleId'"
      ></app-select>
      <button
        hlmBtn
        type="button"
        variant="ghost"
        size="icon"
        data-testid="role-preview"
        [disabled]="!selectedRole()"
        [hlmTooltip]="'Preview role' | t"
        (click)="previewRole()"
      >
        <app-icon name="visibility"></app-icon>
      </button>
    </div>

    <app-dialog-footer [editing]="!!groupMember" (cancelClicked)="closeModal()"></app-dialog-footer>
  </form>
</app-dialog>
