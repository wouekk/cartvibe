<div
  class="flex flex-col rounded-[10px] p-4"
  [ngClass]="{
  'warning-background': type() === 'warning',
  }"
>
  <ng-container [ngSwitch]="type()">
    <ng-container *ngSwitchCase="'warning'" [ngTemplateOutlet]="warningHeader"></ng-container>
  </ng-container>
  {{ message() }}
</div>

<ng-template
  #warningHeader
>
  <div class="flex items-center text-warning-text mb-1">
    <app-icon name="warning"></app-icon>
    <strong>{{ 'Warning' | t }}</strong>
  </div>
</ng-template>
