<!--
  Every app-button is a shadcn/ui button: the hlmBtn directive styles a plain <button>, so the look is Tailwind and the
  accent tokens. A "primary" or "accent" raised button is the filled one, "warn" the destructive one; text and icon
  buttons are ghost buttons in the accent (or red for "warn").
-->
@switch (matButtonType()) {
  @case ("basic") {
    <button
      hlmBtn
      [variant]="color() === 'warn' ? 'destructive' : 'ghost'"
      [class]="buttonClass()"
      [type]="type()"
      [disabled]="disabled()"
      [matTooltip]="tooltip()"
      [routerLink]="buttonRouterLink()"
      [queryParams]="buttonQueryParams()"
      [matBadgeColor]="matBadgeColor()"
      [matBadge]="matBadgeContent()"
      [matBadgeHidden]="matBadgeHidden()"
      (click)="emitClicked($event)"
    >
      @if (icon) {
        <app-icon [name]="icon"></app-icon>
      }
      <span class="font-medium">{{ buttonText() }}</span>
    </button>
  }

  @case ("matRaisedButton") {
    <button
      hlmBtn
      [variant]="color() === 'warn' ? 'destructive' : 'default'"
      [class]="buttonClass()"
      [type]="type()"
      [disabled]="disabled()"
      [matTooltip]="tooltip()"
      [matBadgeColor]="matBadgeColor()"
      [matBadge]="matBadgeContent()"
      [matBadgeHidden]="matBadgeHidden()"
      [routerLink]="buttonRouterLink()"
      [queryParams]="buttonQueryParams()"
      (click)="emitClicked($event)"
    >
      @if (icon) {
        <app-icon [name]="icon"></app-icon>
      }
      <span class="font-medium">{{ buttonText() }}</span>
    </button>
  }

  @case ("iconButton") {
    <button
      hlmBtn
      size="icon"
      [variant]="color() === 'warn' ? 'destructive' : 'ghost'"
      [class]="buttonClass()"
      [type]="type()"
      [disabled]="disabled()"
      [routerLink]="buttonRouterLink()"
      [queryParams]="buttonQueryParams()"
      [matTooltip]="tooltip()"
      [matBadgeColor]="matBadgeColor()"
      [matBadge]="matBadgeContent()"
      [matBadgeHidden]="matBadgeHidden()"
      (click)="emitClicked($event)"
    >
      @if (icon) {
        <app-icon [name]="icon"></app-icon>
      }
    </button>
  }
}
