<!--
  Every app-button is a shadcn/ui button: the hlmBtn directive styles a plain <button>, so the look is Tailwind and the
  accent tokens. A "primary" or "accent" raised button is the filled one, "warn" the destructive one; text and icon
  buttons are ghost buttons in the accent (or red for "warn").
-->
@switch (matButtonType()) {
  @case ("basic") {
    <button
      hlmBtn
      [variant]="color() === 'warn' ? 'destructive' : 'ghost'"
      class="relative" [class]="buttonClass()"
      [type]="type()"
      [disabled]="disabled()"
      [hlmTooltip]="tooltip() | t"
      [routerLink]="buttonRouterLink()"
      [queryParams]="buttonQueryParams()"
      (click)="emitClicked($event)"
    >
      @if (icon) {
        <app-icon [name]="icon"></app-icon>
      }
      <span class="font-medium">{{ buttonText() | t }}</span>
      @if (!matBadgeHidden()) {
        <span
          hlmBadge
          class="pointer-events-none absolute -right-1.5 -top-1.5 h-4 min-w-4 justify-center px-1 text-[10px] tabular-nums"
          data-testid="button-badge"
          >{{ matBadgeContent() }}</span
        >
      }
    </button>
  }

  @case ("matRaisedButton") {
    <button
      hlmBtn
      [variant]="color() === 'warn' ? 'destructive' : 'default'"
      class="relative" [class]="buttonClass()"
      [type]="type()"
      [disabled]="disabled()"
      [hlmTooltip]="tooltip() | t"
      [routerLink]="buttonRouterLink()"
      [queryParams]="buttonQueryParams()"
      (click)="emitClicked($event)"
    >
      @if (icon) {
        <app-icon [name]="icon"></app-icon>
      }
      <span class="font-medium">{{ buttonText() | t }}</span>
      @if (!matBadgeHidden()) {
        <span
          hlmBadge
          class="pointer-events-none absolute -right-1.5 -top-1.5 h-4 min-w-4 justify-center px-1 text-[10px] tabular-nums"
          data-testid="button-badge"
          >{{ matBadgeContent() }}</span
        >
      }
    </button>
  }

  @case ("iconButton") {
    <button
      hlmBtn
      size="icon"
      [variant]="color() === 'warn' ? 'destructive' : 'ghost'"
      class="relative" [class]="buttonClass()"
      [type]="type()"
      [disabled]="disabled()"
      [routerLink]="buttonRouterLink()"
      [queryParams]="buttonQueryParams()"
      [hlmTooltip]="tooltip() | t"
      (click)="emitClicked($event)"
    >
      @if (icon) {
        <app-icon [name]="icon"></app-icon>
      }
      @if (!matBadgeHidden()) {
        <span
          hlmBadge
          class="pointer-events-none absolute -right-1.5 -top-1.5 h-4 min-w-4 justify-center px-1 text-[10px] tabular-nums"
          data-testid="button-badge"
          >{{ matBadgeContent() }}</span
        >
      }
    </button>
  }
}
