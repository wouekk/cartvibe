@if (isLoading()) {
  <div class="loading-container" @fadeInOut>
    <app-cartvibe-splash text="Loading..."></app-cartvibe-splash>
  </div>
} @else {
  <div class="auth-container" @fadeIn>
    <div class="auth-card">
      <!-- Logo and Welcome -->
      <div class="logo-section">
        <app-cartvibe-logo class="logo" [height]="64"></app-cartvibe-logo>
        <h1 class="welcome-text">
          {{ (isSignUp | async) ? 'Create your account' : 'Welcome back' }}
        </h1>
        <p class="subtitle">
          {{ (isSignUp | async) ? 'Join your household on CartVibe' : 'Sign in to your household' }}
        </p>
      </div>

      <!-- Form -->
      <form [formGroup]="form" (ngSubmit)="submit()">
        <!-- Form Fields -->
        <div class="form-fields">
          <ng-container *ngIf="isSignUp | async">
            <app-input
              appearance="outline"
              [label]="'Display Name' | t"
              [inputFormControl]="form | formGet : 'displayname'"
            ></app-input>
          </ng-container>

          <app-input
            appearance="outline"
            [label]="'Username' | t"
            [inputFormControl]="form | formGet : 'username'"
          ></app-input>

          <app-input
            appearance="outline"
            [label]="'Password' | t"
            type="password"
            [showVisibilityEye]="true"
            [inputFormControl]="form | formGet : 'password'"
          ></app-input>
        </div>

        <!-- Form Actions -->
        <div class="form-actions">
          <div class="primary-action w-full">
            <app-button
              buttonClass="w-full"
              matButtonType="matRaisedButton"
              type="submit"
              [buttonText]="primaryButtonText"
            ></app-button>
          </div>

          <div class="secondary-action" *appFeature="'enableLocalSignUp'">
            <app-button
              buttonClass="w-full"
              matButtonType="matRaisedButton"
              type="button"
              [buttonText]="secondaryButtonText"
              [routerLink]="secondaryButtonRouterLink"
            ></app-button>
          </div>
        </div>
      </form>

    </div>
  </div>
}
