@if (isLoggedIn()) {
  <div
    id="header-container"
    class="sticky top-0 z-[1000] flex items-center gap-2 border-b border-border bg-background px-3 py-2.5 sm:px-6 sm:py-4"
  >
    <div class="flex min-w-0 items-center max-md:flex-none md:flex-1">
      <!-- A phone opens the sheet from the tab bar's More, so the corner names the household instead. -->
      @if (isHandset()) {
        @if (household(); as group) {
          <span class="flex min-w-0 items-center gap-2" data-testid="header-household">
            <app-avatar size="sm" [group]="group"></app-avatar>
            <span class="truncate text-sm font-semibold">{{ group.name }}</span>
          </span>
        }
      } @else {
        <button hlmSidebarTrigger class="mr-1" data-testid="sidebar-toggle"></button>
      }
    </div>
    <div class="flex min-w-0 flex-1 items-center justify-end gap-1 md:flex-none">
      <span
        *hasAppPermission="Permission.AppNotificationsRead"
        class="inline-flex shrink-0 sm:ms-3"
        cdkOverlayOrigin
        #notificationsOrigin="cdkOverlayOrigin"
      >
        <button
          hlmBtn
          type="button"
          variant="ghost"
          size="icon"
          class="relative"
          data-testid="header-notifications"
          [hlmTooltip]="'Notifications' | t"
          (click)="notificationsOpen.set(!notificationsOpen())"
        >
          <app-icon name="notifications"></app-icon>
          @if (notificationCount(); as count) {
            <span hlmBadge class="pointer-events-none absolute -right-1.5 -top-1.5 h-4 min-w-4 justify-center px-1 text-[0.625rem] tabular-nums" data-testid="button-badge">{{ count }}</span>
          }
        </button>
        <ng-template
          cdkConnectedOverlay
          [cdkConnectedOverlayOrigin]="notificationsOrigin"
          [cdkConnectedOverlayOpen]="notificationsOpen()"
          [cdkConnectedOverlayPositions]="notificationPositions"
          [cdkConnectedOverlayPush]="true"
          [cdkConnectedOverlayViewportMargin]="8"
          (overlayOutsideClick)="notificationsOpen.set(false)"
          (detach)="notificationsOpen.set(false)"
        >
          <div class="notifications-panel max-h-[70vh] w-96 max-w-[calc(100vw-1rem)] overflow-x-hidden overflow-y-auto rounded-xl border border-border bg-popover p-3 text-popover-foreground shadow-lg animate-in fade-in-0 zoom-in-95 motion-reduce:animate-none" data-testid="notifications-panel">
            <ng-container *ngTemplateOutlet="notifications"></ng-container>
          </div>
        </ng-template>
      </span>

      <app-cartvibe-logo class="mx-2 shrink-0 max-sm:hidden sm:mx-4" [scale]="logoScale()"></app-cartvibe-logo>
    </div>
  </div>
}
@if (showProgressBar()) {
  <div class="app-progress-indeterminate" role="progressbar" [attr.aria-label]="'Working' | t"></div>
}

<ng-template #notifications>
  <app-notifications-list (notificationCountChanged)="notificationCount.set($event)"></app-notifications-list>
</ng-template>
