@if (isLoggedIn()) {
  <div
    id="header-container"
    class="sticky top-0 z-[1000] flex items-center gap-2 border-b border-border bg-background px-3 py-2.5 sm:px-6 sm:py-4"
  >
    <div class="flex min-w-0 items-center max-md:flex-none md:flex-1">
      <button hlmSidebarTrigger class="mr-1" data-testid="sidebar-toggle"></button>
      @for (shortcut of userPreferences()?.userShortcuts ?? []; track shortcut["id"]) {
        <a class="max-md:hidden" [href]="shortcut.url">
          <button
            hlmBtn variant="ghost" size="icon-lg"
            color="accent"
            class="nav-button"
            routerLinkActive="active-link"
            [hlmTooltip]="shortcut.name"
          >
            <app-icon [name]="shortcut.icon"></app-icon>
          </button>
        </a>
      }
    </div>
    <div class="flex min-w-0 flex-1 items-center justify-end gap-1 md:flex-none">
      <span
        *hasAppPermission="Permission.AppNotificationsRead"
        class="inline-flex shrink-0 sm:ms-3"
        cdkOverlayOrigin
        #notificationsOrigin="cdkOverlayOrigin"
      >
        <app-button
          matButtonType="iconButton"
          icon="notifications"
          [tooltip]="'Notifications' | t"
          [matBadgeContent]="notificationCount()"
          (clicked)="notificationsOpen.set(!notificationsOpen())"
        ></app-button>
        <ng-template
          cdkConnectedOverlay
          [cdkConnectedOverlayOrigin]="notificationsOrigin"
          [cdkConnectedOverlayOpen]="notificationsOpen()"
          [cdkConnectedOverlayPositions]="notificationPositions"
          (overlayOutsideClick)="notificationsOpen.set(false)"
          (detach)="notificationsOpen.set(false)"
        >
          <div class="notifications-panel max-h-[70vh] w-96 max-w-[calc(100vw-1rem)] overflow-x-hidden overflow-y-auto rounded-xl border border-border bg-popover p-3 text-popover-foreground shadow-lg animate-in fade-in-0 zoom-in-95" data-testid="notifications-panel">
            <ng-container *ngTemplateOutlet="notifications"></ng-container>
          </div>
        </ng-template>
      </span>

      <button
        hlmBtn variant="ghost" size="icon"
        type="button"
        class="shrink-0"
        data-testid="theme-toggle"
        [attr.aria-label]="themeToggleLabel() | t"
        [hlmTooltip]="themeToggleLabel() | t"
        (click)="toggleTheme()"
      >
        <app-icon [name]="isDarkTheme() ? 'light_mode' : 'dark_mode'"></app-icon>
      </button>

      <app-cartvibe-logo class="mx-2 shrink-0 max-sm:hidden sm:mx-4" [scale]="logoScale()"></app-cartvibe-logo>
    </div>
  </div>
}
@if (showProgressBar()) {
  <div class="app-progress-indeterminate" role="progressbar" [attr.aria-label]="'Working' | t"></div>
}

<ng-template
  #navButton
  let-srcPath="srcPath"
  let-routerLink="routerLink"
  let-tooltip="tooltip"
>
  <button
    hlmBtn variant="ghost" size="icon"
    color="accent"
    class="nav-button"
    [routerLink]="routerLink"
    [hlmTooltip]="tooltip"
  >
    <img [src]="srcPath"/>
  </button>
</ng-template>

<ng-template #notifications>
  <app-notifications-list (notificationCountChanged)="notificationCount.set($event)"></app-notifications-list>
</ng-template>
