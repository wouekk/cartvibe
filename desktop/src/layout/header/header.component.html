@if (isLoggedIn()) {
  <div
    id="header-container"
    class="header-container flex justify-between items-center"
  >
    <div class="flex-1 min-w-0 flex items-center">
      <button
        mat-icon-button
        color="accent"
        class="nav-button"
        matTooltip="Toggle sidebar"
        (click)="toggleSidebar()"
      >
        <mat-icon>menu</mat-icon>
      </button>
      @for (shortcut of userPreferences()?.userShortcuts ?? []; track shortcut["id"]) {
        <a [href]="shortcut.url">
          <button
            mat-icon-button
            color="accent"
            class="nav-button"
            routerLinkActive="active-link"
            [matTooltip]="shortcut.name"
          >
            <mat-icon>{{ shortcut.icon }}</mat-icon>
          </button>
        </a>
      }
    </div>
    <div class="flex-none flex items-center justify-end">
      <app-searchbar
        *hasAppPermission="Permission.AppReceiptsSearch"
        class="receipt-searchbar w-full me-2"
      ></app-searchbar>
      <span
        *hasAppPermission="Permission.AppNotificationsRead"
        class="ms-6 inline-flex"
        cdkOverlayOrigin
        #notificationsOrigin="cdkOverlayOrigin"
      >
        <app-button
          matButtonType="iconButton"
          icon="notifications"
          tooltip="Notifications"
          [matBadgeContent]="notificationCount()"
          (clicked)="notificationsOpen.set(!notificationsOpen())"
        ></app-button>
        <ng-template
          cdkConnectedOverlay
          [cdkConnectedOverlayOrigin]="notificationsOrigin"
          [cdkConnectedOverlayOpen]="notificationsOpen()"
          [cdkConnectedOverlayPositions]="notificationPositions"
          (overlayOutsideClick)="notificationsOpen.set(false)"
          (detach)="notificationsOpen.set(false)"
        >
          <div class="notifications-panel" data-testid="notifications-panel">
            <ng-container *ngTemplateOutlet="notifications"></ng-container>
          </div>
        </ng-template>
      </span>

      <app-cartvibe-logo class="mx-6"></app-cartvibe-logo>
    </div>
  </div>
}
@if (showProgressBar()) {
  <mat-progress-bar mode="indeterminate"></mat-progress-bar>
}

<ng-template
  #navButton
  let-srcPath="srcPath"
  let-routerLink="routerLink"
  let-tooltip="tooltip"
>
  <button
    mat-icon-button
    color="accent"
    class="nav-button"
    [routerLink]="routerLink"
    [matTooltip]="tooltip"
  >
    <img [src]="srcPath"/>
  </button>
</ng-template>

<ng-template #notifications>
  <app-notifications-list (notificationCountChanged)="notificationCount.set($event)"></app-notifications-list>
</ng-template>
