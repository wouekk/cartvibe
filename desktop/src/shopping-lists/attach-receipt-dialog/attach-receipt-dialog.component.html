<app-dialog [headerText]="'Attach a Receipt' | t">
  <p class="mb-2 text-muted-foreground">{{ 'Pick the receipt from this shopping trip. Its products are compared with the list.' | t }}</p>

  @if (receipts(); as receipts) {
    <div class="flex max-h-[60vh] flex-col overflow-y-auto" data-testid="attach-receipt-choices">
      @for (receipt of receipts; track receipt.id) {
        <button
          type="button"
          class="flex min-h-13 flex-col items-start gap-0.5 border-b border-border p-2 text-left transition-colors hover:bg-muted focus-visible:bg-muted"
          data-testid="attach-receipt-choice"
          (click)="pick(receipt)"
        >
          <span class="font-semibold">{{ receipt.name }}</span>
          <span class="text-sm tabular-nums text-muted-foreground">
            {{ receipt.date | appDate : "MMM d" : "calendar" }} · {{ receipt.amount | customCurrency }}
          </span>
        </button>
      } @empty {
        <p class="mb-2 text-muted-foreground" data-testid="attach-receipt-none">{{ 'No receipts to attach. Add the receipt first.' | t }}</p>
      }
    </div>
  } @else {
    <p class="mb-2 text-muted-foreground">{{ 'Loading receipts…' | t }}</p>
  }

  <div class="mt-2 flex justify-end">
    <app-cancel-button (clicked)="close()"></app-cancel-button>
  </div>
</app-dialog>
