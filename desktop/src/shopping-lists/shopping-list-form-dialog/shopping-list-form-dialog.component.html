<app-dialog [headerText]="headerText">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <app-input
      label="Name"
      data-testid="shopping-list-name"
      [inputFormControl]="form | formGet : 'name'"
    ></app-input>

    <!-- The footer submit button is type="submit", so ngSubmit alone handles both the click and Enter. -->
    <app-dialog-footer
      (cancelClicked)="closeDialog()"
    ></app-dialog-footer>
  </form>
</app-dialog>
