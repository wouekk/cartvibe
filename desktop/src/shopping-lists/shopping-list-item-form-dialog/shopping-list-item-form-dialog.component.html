<app-dialog headerText="Edit Item">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="d-flex flex-column">
      <app-input
        label="Name"
        data-testid="shopping-list-item-edit-name"
        [inputFormControl]="form | formGet : 'name'"
      ></app-input>
      <app-shopping-list-amount-fields [form]="form"></app-shopping-list-amount-fields>
      @if (item.quantity && !(form | formGet : 'amount').value) {
        <p class="small text-muted mt-0" data-testid="shopping-list-item-legacy-quantity">
          Currently "{{ item.quantity }}". Entering an amount replaces it.
        </p>
      }
      <app-input
        label="Note"
        data-testid="shopping-list-item-edit-note"
        [inputFormControl]="form | formGet : 'note'"
      ></app-input>
    </div>

    <!-- The footer submit button is type="submit", so ngSubmit alone handles both the click and Enter. -->
    <app-dialog-footer
      (cancelClicked)="closeDialog()"
    ></app-dialog-footer>
  </form>
</app-dialog>
