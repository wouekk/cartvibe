<div class="shopping-list-item" [class.checked]="item().isChecked">
  <button
    type="button"
    class="toggle"
    data-testid="shopping-list-item-toggle"
    role="checkbox"
    [attr.aria-checked]="item().isChecked"
    [disabled]="!canUpdate()"
    (click)="toggled.emit(item())"
  >
    <app-icon class="check-icon" [name]="item().isChecked ? 'check_circle' : 'radio_button_unchecked'"></app-icon>
    <span class="text">
      <span class="name" data-testid="shopping-list-item-name">{{ item().name }}</span>
      <app-food-tags class="tags" [values]="item()"></app-food-tags>
      @if (item().note) {
        <span class="note">{{ item().note }}</span>
      }
    </span>
    @if (amount()) {
      <span class="quantity" data-testid="shopping-list-item-amount">{{ amount() }}</span>
    }
  </button>

  @if (canUpdate()) {
    <button
      mat-icon-button
      type="button"
      class="menu-button"
      data-testid="shopping-list-item-menu"
      aria-label="Item actions"
      [hlmDropdownMenuTrigger]="itemMenu" align="end"
    >
      <app-icon name="more_vert"></app-icon>
    </button>
    <ng-template #itemMenu>
<div hlmDropdownMenu class="w-56">
      <button hlmDropdownMenuItem data-testid="shopping-list-item-edit" (click)="editClicked.emit(item())">
        <app-icon name="edit"></app-icon>
        <span>Edit</span>
      </button>
      <button hlmDropdownMenuItem data-testid="shopping-list-item-tags" [hlmDropdownMenuSubTrigger]="tagsMenu">
        <app-icon name="sell"></app-icon>
        <span>Correct tags</span>
      </button>
      <button hlmDropdownMenuItem data-testid="shopping-list-item-delete" (click)="deleteClicked.emit(item())">
        <app-icon name="delete"></app-icon>
        <span>Delete</span>
      </button>
    </div>
</ng-template>
    <ng-template #tagsMenu>
<div hlmDropdownMenuSub class="w-48">
      @for (choice of healthChoices; track choice.value) {
        <button
          hlmDropdownMenuItem
          [attr.data-testid]="'shopping-list-item-health-' + choice.value"
          (click)="classificationSelected.emit({ item: item(), health: choice.value })"
        >
          <app-icon [name]="item().health === choice.value ? 'check' : ''"></app-icon>
          <span>{{ choice.label }}</span>
        </button>
      }
      @if (canCorrectSeasonality()) {
        @for (choice of seasonalityChoices; track choice.value) {
          <button
            hlmDropdownMenuItem
            [attr.data-testid]="'shopping-list-item-season-' + choice.value"
            (click)="classificationSelected.emit({ item: item(), health: item().health, seasonality: choice.value })"
          >
            <app-icon [name]="item().seasonality === choice.value ? 'check' : ''"></app-icon>
            <span>{{ choice.label }}</span>
          </button>
        }
      }
    </div>
</ng-template>
  }
</div>
