<div class="flex min-h-14 items-center border-b border-border last:border-b-0" [class.checked]="item().isChecked">
  <button
    type="button"
    class="flex min-h-14 min-w-0 flex-1 items-center gap-3 px-2 py-2 text-left outline-none focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-ring disabled:cursor-default"
    data-testid="shopping-list-item-toggle"
    role="checkbox"
    [attr.aria-checked]="item().isChecked"
    [disabled]="!canUpdate()"
    (click)="toggled.emit(item())"
  >
    <app-icon class="shrink-0 text-xl" [class.text-muted-foreground]="item().isChecked" [name]="item().isChecked ? 'check_circle' : 'radio_button_unchecked'"></app-icon>
    <span class="flex min-w-0 flex-wrap items-baseline gap-x-2">
      <span class="break-words text-base" [class.line-through]="item().isChecked" [class.text-muted-foreground]="item().isChecked" data-testid="shopping-list-item-name">{{ item().name }}</span>
      <app-food-tags class="self-center" [values]="item()"></app-food-tags>
      @if (item().note) {
        <span class="basis-full break-words text-sm text-muted-foreground">{{ item().note }}</span>
      }
    </span>
    @if (amount()) {
      <span class="ml-auto shrink-0 whitespace-nowrap rounded-md bg-muted px-2.5 py-1 text-sm font-bold tabular-nums" data-testid="shopping-list-item-amount">{{ amount() }}</span>
    }
  </button>

  @if (canUpdate()) {
    <button
      hlmBtn variant="ghost" size="icon"
      type="button"
      class="shrink-0"
      data-testid="shopping-list-item-menu"
      aria-label="Item actions"
      [hlmDropdownMenuTrigger]="itemMenu" align="end"
    >
      <app-icon name="more_vert"></app-icon>
    </button>
    <ng-template #itemMenu>
<div hlmDropdownMenu class="w-56">
      <button hlmDropdownMenuItem data-testid="shopping-list-item-edit" (click)="editClicked.emit(item())">
        <app-icon name="edit"></app-icon>
        <span>Edit</span>
      </button>
      <button hlmDropdownMenuItem data-testid="shopping-list-item-tags" [hlmDropdownMenuSubTrigger]="tagsMenu">
        <app-icon name="sell"></app-icon>
        <span>Correct tags</span>
      </button>
      <button hlmDropdownMenuItem data-testid="shopping-list-item-delete" (click)="deleteClicked.emit(item())">
        <app-icon name="delete"></app-icon>
        <span>Delete</span>
      </button>
    </div>
</ng-template>
    <ng-template #tagsMenu>
<div hlmDropdownMenuSub class="w-48">
      @for (choice of healthChoices; track choice.value) {
        <button
          hlmDropdownMenuItem
          [attr.data-testid]="'shopping-list-item-health-' + choice.value"
          (click)="classificationSelected.emit({ item: item(), health: choice.value })"
        >
          <app-icon [name]="item().health === choice.value ? 'check' : ''"></app-icon>
          <span>{{ choice.label }}</span>
        </button>
      }
      @if (canCorrectSeasonality()) {
        @for (choice of seasonalityChoices; track choice.value) {
          <button
            hlmDropdownMenuItem
            [attr.data-testid]="'shopping-list-item-season-' + choice.value"
            (click)="classificationSelected.emit({ item: item(), health: item().health, seasonality: choice.value })"
          >
            <app-icon [name]="item().seasonality === choice.value ? 'check' : ''"></app-icon>
            <span>{{ choice.label }}</span>
          </button>
        }
      }
    </div>
</ng-template>
  }
</div>
