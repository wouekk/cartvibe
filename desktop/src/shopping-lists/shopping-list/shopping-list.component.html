@if (canUpdate()) {
  <form class="add-bar" [formGroup]="addForm" (ngSubmit)="addItem()">
    <div class="add-row">
      <app-input
        class="add-name"
        label="Add an item"
        data-testid="shopping-list-add-name"
        [inputFormControl]="addForm | formGet : 'name'"
      ></app-input>
      <app-shopping-list-amount-fields class="add-amount" [form]="addForm"></app-shopping-list-amount-fields>
      <button
        hlmBtn
        color="primary"
        type="submit"
        class="add-submit"
        aria-label="Add item"
        data-testid="shopping-list-add-submit"
        [disabled]="adding()"
      >
        <app-icon name="add"></app-icon>
      </button>
    </div>
  </form>
}

<div class="items" data-testid="shopping-list-active-items">
  @for (item of activeItems(); track item.id) {
    <app-shopping-list-item
      [item]="item"
      [canUpdate]="canUpdate()"
      (toggled)="toggleItem($event)"
      (editClicked)="editItem($event)"
      (deleteClicked)="deleteItem($event)"
      (classificationSelected)="correctTags($event)"
    ></app-shopping-list-item>
  } @empty {
    <p class="empty" data-testid="shopping-list-empty">Nothing left to buy on this list.</p>
  }
</div>

@if (checkedItems().length > 0) {
  <div class="crossed-off">
    <div class="crossed-off-header">
      <button
        type="button"
        class="crossed-off-toggle"
        data-testid="shopping-list-crossed-off-toggle"
        [attr.aria-expanded]="showCrossedOff()"
        (click)="showCrossedOff.set(!showCrossedOff())"
      >
        <app-icon [name]="showCrossedOff() ? 'expand_less' : 'expand_more'"></app-icon>
        Crossed off ({{ checkedItems().length }})
      </button>
      @if (canUpdate() && showCrossedOff()) {
        <button
          mat-button
          type="button"
          data-testid="shopping-list-clear-crossed-off"
          (click)="clearCrossedOff()"
        >
          Clear all
        </button>
      }
    </div>
    @if (showCrossedOff()) {
      <div class="items" data-testid="shopping-list-checked-items">
        @for (item of checkedItems(); track item.id) {
          <app-shopping-list-item
            [item]="item"
            [canUpdate]="canUpdate()"
            (toggled)="toggleItem($event)"
            (editClicked)="editItem($event)"
            (deleteClicked)="deleteItem($event)"
            (classificationSelected)="correctTags($event)"
          ></app-shopping-list-item>
        }
      </div>
    }
  </div>
}
