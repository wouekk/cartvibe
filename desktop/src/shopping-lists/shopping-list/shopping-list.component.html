@if (canUpdate()) {
  <form class="add-bar sticky top-0 z-10 bg-background pt-2" [formGroup]="addForm" (ngSubmit)="addItem()">
    <div class="flex items-start gap-1">
      <app-input
        class="add-name min-w-0 flex-1"
        [label]="'Add an item' | t"
        data-testid="shopping-list-add-name"
        [inputFormControl]="addForm | formGet : 'name'"
      ></app-input>
      <app-shopping-list-amount-fields class="add-amount w-44 flex-none max-[400px]:w-38" [form]="addForm"></app-shopping-list-amount-fields>
      <button
        hlmBtn
        color="primary"
        type="submit"
        size="icon-lg"
        class="mt-1 flex-none"
        [attr.aria-label]="'Add item' | t"
        data-testid="shopping-list-add-submit"
        [disabled]="adding()"
      >
        <app-icon name="add"></app-icon>
      </button>
    </div>
  </form>
}

<div class="overflow-hidden rounded-xl bg-card shadow-xs ring-1 ring-foreground/10" data-testid="shopping-list-active-items">
  @for (item of activeItems(); track item.id) {
    <app-shopping-list-item
      [item]="item"
      [canUpdate]="canUpdate()"
      (toggled)="toggleItem($event)"
      (editClicked)="editItem($event)"
      (deleteClicked)="deleteItem($event)"
      (classificationSelected)="correctTags($event)"
    ></app-shopping-list-item>
  } @empty {
    <p class="m-0 px-4 py-6 text-center text-muted-foreground" data-testid="shopping-list-empty">{{ 'Nothing left to buy on this list.' | t }}</p>
  }
</div>

@if (checkedItems().length > 0) {
  <div class="mt-6">
    <div class="mb-2 flex items-center justify-between">
      <button
        type="button"
        class="inline-flex min-h-11 items-center gap-1 px-2 font-semibold"
        data-testid="shopping-list-crossed-off-toggle"
        [attr.aria-expanded]="showCrossedOff()"
        (click)="showCrossedOff.set(!showCrossedOff())"
      >
        <app-icon [name]="showCrossedOff() ? 'expand_less' : 'expand_more'"></app-icon>
        {{ 'Crossed off ({count})' | t: { count: checkedItems().length } }}
      </button>
      @if (canUpdate() && showCrossedOff()) {
        <button
          hlmBtn variant="ghost"
          type="button"
          data-testid="shopping-list-clear-crossed-off"
          (click)="clearCrossedOff()"
        >
          {{ 'Clear all' | t }}
        </button>
      }
    </div>
    @if (showCrossedOff()) {
      <div class="overflow-hidden rounded-xl bg-card shadow-xs ring-1 ring-foreground/10" data-testid="shopping-list-checked-items">
        @for (item of checkedItems(); track item.id) {
          <app-shopping-list-item
            [item]="item"
            [canUpdate]="canUpdate()"
            (toggled)="toggleItem($event)"
            (editClicked)="editItem($event)"
            (deleteClicked)="deleteItem($event)"
            (classificationSelected)="correctTags($event)"
          ></app-shopping-list-item>
        }
      </div>
    }
  </div>
}
