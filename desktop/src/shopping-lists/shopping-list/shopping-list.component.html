@if (canUpdate()) {
  <form class="add-bar sticky top-0 z-10 bg-background pb-3 pt-1" [formGroup]="addForm" (ngSubmit)="addItem()">
    <div class="flex items-start gap-2">
      <app-shopping-item-name-field
        class="add-name min-w-0 flex-1"
        [label]="'Add an item' | t"
        testId="shopping-list-add-name"
        [control]="nameControl"
        [suggestions]="suggestions()"
        (picked)="suggestionPicked($event)"
      ></app-shopping-item-name-field>
      <app-shopping-list-amount-fields class="add-amount w-44 flex-none max-[400px]:w-38" [form]="addForm"></app-shopping-list-amount-fields>
      <button
        hlmBtn
        color="primary"
        type="submit"
        size="icon"
        class="mt-[1.625rem] size-9 flex-none"
        [attr.aria-label]="'Add item' | t"
        data-testid="shopping-list-add-submit"
        [disabled]="adding()"
      >
        <app-icon name="add"></app-icon>
      </button>
    </div>
  </form>
}

<div class="overflow-hidden rounded-xl border border-border bg-card" data-testid="shopping-list-active-items">
  @for (item of activeItems(); track item.id) {
    <app-shopping-list-item
      [item]="item"
      [canUpdate]="canUpdate()"
      (toggled)="toggleItem($event)"
      (editClicked)="editItem($event)"
      (deleteClicked)="deleteItem($event)"
      (classificationSelected)="correctTags($event)"
    ></app-shopping-list-item>
  } @empty {
    <p class="m-0 px-4 py-10 text-center text-sm text-muted-foreground" data-testid="shopping-list-empty">{{ 'Nothing left to buy on this list.' | t }}</p>
  }
</div>

@if (checkedItems().length > 0) {
  <div class="mt-8">
    <div class="mb-3 flex items-center justify-between">
      <button
        type="button"
        class="inline-flex h-9 items-center gap-1 rounded-md px-2 text-sm font-semibold hover:bg-accent"
        data-testid="shopping-list-crossed-off-toggle"
        [attr.aria-expanded]="showCrossedOff()"
        (click)="showCrossedOff.set(!showCrossedOff())"
      >
        <app-icon [name]="showCrossedOff() ? 'expand_less' : 'expand_more'"></app-icon>
        {{ 'Crossed off ({count})' | t: { count: checkedItems().length } }}
      </button>
      @if (canUpdate() && showCrossedOff()) {
        <button
          hlmBtn variant="ghost"
          type="button"
          data-testid="shopping-list-clear-crossed-off"
          (click)="clearCrossedOff()"
        >
          {{ 'Clear all' | t }}
        </button>
      }
    </div>
    @if (showCrossedOff()) {
      <div class="overflow-hidden rounded-xl border border-border bg-card" data-testid="shopping-list-checked-items">
        @for (item of checkedItems(); track item.id) {
          <app-shopping-list-item
            [item]="item"
            [canUpdate]="canUpdate()"
            (toggled)="toggleItem($event)"
            (editClicked)="editItem($event)"
            (deleteClicked)="deleteItem($event)"
            (classificationSelected)="correctTags($event)"
          ></app-shopping-list-item>
        }
      </div>
    }
  </div>
}
