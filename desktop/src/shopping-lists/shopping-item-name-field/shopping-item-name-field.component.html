<div class="flex w-full flex-col gap-1.5">
  @if (label()) {
    <label class="text-sm font-medium leading-none text-foreground" [attr.for]="testId() + '-input'">{{ label() | t }}</label>
  }
  <hlm-autocomplete
    [search]="typed()"
    [value]="null"
    [itemToString]="itemToString"
    (searchChange)="onSearch($event)"
    (valueChange)="onPick($event)"
  >
    <hlm-autocomplete-input class="w-full" [inputId]="testId() + '-input'" [showSearch]="false" [attr.data-testid]="testId()" autocomplete="off" />
    @if (options().length > 0) {
      <hlm-autocomplete-content *hlmAutocompletePortal>
        <div hlmAutocompleteList class="max-h-60 overflow-y-auto p-1">
          @for (option of options(); track option.name) {
            <hlm-autocomplete-item [value]="option" data-testid="shopping-list-suggestion">
              <span class="min-w-0 flex-1 truncate">{{ option.name }}</span>
              @if (option.amount) {
                <span class="ml-2 text-xs text-muted-foreground tabular-nums">{{ option.amount }} {{ option.unit }}</span>
              }
            </hlm-autocomplete-item>
          }
        </div>
      </hlm-autocomplete-content>
    }
  </hlm-autocomplete>
</div>
