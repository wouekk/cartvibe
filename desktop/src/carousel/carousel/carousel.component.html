<div class="rw-carousel" data-testid="carousel">
  @for (preview of imagePreviews(); track $index; let i = $index) {
    <div class="rw-carousel__slide" [class.rw-carousel__slide--hidden]="i !== currentlyShownImageIndex">
      <ng-template
        [ngTemplateOutlet]="buttonControls"
        [ngTemplateOutletContext]="{
          i: i,
        }"
      ></ng-template>

      <!--
        Deliberately unconditional: the header zoom buttons index a viewChildren
        query by SLIDE index, so gating the viewer here would compact that query
        and point them at the wrong slide. The viewer renders nothing without a
        source anyway.
      -->
      <app-image-viewer
        [imageBase64]="preview?.encodedImage"
        [imageFile]="$any(preview.file)"
        [stageHeight]="stageHeight()"
      ></app-image-viewer>
    </div>
  }

  @for (image of images(); track $index; let i = $index) {
    <div class="rw-carousel__slide" [class.rw-carousel__slide--hidden]="imagePreviews().length + i !== currentlyShownImageIndex">
      <ng-template
        [ngTemplateOutlet]="buttonControls"
        [ngTemplateOutletContext]="{
          i: i,
        }"
      ></ng-template>

      <!-- Unconditional for the same reason as the loop above. -->
      <app-image-viewer
        [imageBase64]="image.encodedImage"
        [stageHeight]="stageHeight()"
      ></app-image-viewer>
    </div>
  }

  @if (slideCount() > 1) {
    <button
      type="button"
      class="rw-carousel__arrow rw-carousel__arrow--prev"
      aria-label="Previous image"
      data-testid="carousel-prev"
      (click)="previous()"
    >
      <app-icon name="chevron_left"></app-icon>
    </button>
    <button
      type="button"
      class="rw-carousel__arrow rw-carousel__arrow--next"
      aria-label="Next image"
      data-testid="carousel-next"
      (click)="next()"
    >
      <app-icon name="chevron_right"></app-icon>
    </button>
  }
</div>

<ng-template #buttonControls let-i="i">
  @if (!hideButtonControls()) {
    <div class="flex flex-wrap justify-center">
      <app-button
        class="flex-none"
        matButtonType="iconButton"
        icon="zoom_in"
        tooltip="Zoom In"
        [disabled]="disabled()"
        (clicked)="zoomIn()"
      ></app-button>
      <app-button
        class="flex-none"
        matButtonType="iconButton"
        icon="zoom_out"
        tooltip="Zoom Out"
        [disabled]="disabled()"
        (clicked)="zoomOut()"
      ></app-button>
      @if (!(mode() | inputReadonly)) {
        <app-button
          class="flex-none"
          matButtonType="iconButton"
          icon="delete"
          tooltip="Remove Image"
          color="warn"
          [disabled]="disabled()"
          (clicked)="emitRemoveButtonClicked(i)"
        ></app-button>
      }
    </div>
  }
</ng-template>
