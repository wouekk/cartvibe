<div class="cv-carousel" data-testid="carousel">
  @for (preview of imagePreviews(); track $index; let i = $index) {
    <div class="cv-carousel__slide" [class.cv-carousel__slide--hidden]="i !== currentlyShownImageIndex">
      <ng-template
        [ngTemplateOutlet]="buttonControls"
        [ngTemplateOutletContext]="{
          i: i,
        }"
      ></ng-template>

      <!--
        Deliberately unconditional: the header zoom buttons index a viewChildren
        query by SLIDE index, so gating the viewer here would compact that query
        and point them at the wrong slide. The viewer renders nothing without a
        source anyway.
      -->
      <app-image-viewer
        [imageBase64]="$safeNavigationMigration(preview?.encodedImage)"
        [imageFile]="$any(preview.file)"
        [stageHeight]="stageHeight()"
      ></app-image-viewer>
    </div>
  }

  @for (image of images(); track $index; let i = $index) {
    <div class="cv-carousel__slide" [class.cv-carousel__slide--hidden]="imagePreviews().length + i !== currentlyShownImageIndex">
      <ng-template
        [ngTemplateOutlet]="buttonControls"
        [ngTemplateOutletContext]="{
          i: i,
        }"
      ></ng-template>

      <!-- Unconditional for the same reason as the loop above. -->
      <app-image-viewer
        [imageBase64]="image.encodedImage"
        [stageHeight]="stageHeight()"
      ></app-image-viewer>
    </div>
  }

  @if (slideCount() > 1) {
    <button
      type="button"
      class="cv-carousel__arrow cv-carousel__arrow--prev"
      [attr.aria-label]="'Previous image' | t"
      data-testid="carousel-prev"
      (click)="previous()"
    >
      <app-icon name="chevron_left"></app-icon>
    </button>
    <button
      type="button"
      class="cv-carousel__arrow cv-carousel__arrow--next"
      [attr.aria-label]="'Next image' | t"
      data-testid="carousel-next"
      (click)="next()"
    >
      <app-icon name="chevron_right"></app-icon>
    </button>
  }
</div>

<ng-template #buttonControls let-i="i">
  @if (!hideButtonControls()) {
    <div class="flex flex-wrap justify-center">
      <button
        hlmBtn
        type="button"
        variant="ghost"
        size="icon"
        class="flex-none"
        data-testid="carousel-zoom-in"
        [disabled]="disabled()"
        [hlmTooltip]="'Zoom In' | t"
        (click)="zoomIn()"
      >
        <app-icon name="zoom_in"></app-icon>
      </button>
      <button
        hlmBtn
        type="button"
        variant="ghost"
        size="icon"
        class="flex-none"
        data-testid="carousel-zoom-out"
        [disabled]="disabled()"
        [hlmTooltip]="'Zoom Out' | t"
        (click)="zoomOut()"
      >
        <app-icon name="zoom_out"></app-icon>
      </button>
      @if (!(mode() | inputReadonly)) {
        <button
          hlmBtn
          type="button"
          variant="destructive"
          size="icon"
          class="flex-none"
          data-testid="carousel-image-remove"
          [disabled]="disabled()"
          [hlmTooltip]="'Remove Image' | t"
          (click)="emitRemoveButtonClicked(i)"
        >
          <app-icon name="delete"></app-icon>
        </button>
      }
    </div>
  }
</ng-template>
