<app-settings-page
  width="wide"
  [title]="headerText"
  description="Tag receipts to group and filter them however you like."
>
  <div settingsActions class="contents">
    <app-add-button
      *hasAppPermission="Permission.AppTagsCreate"
      data-testid="tag-add"
      [buttonText]="'Add Tag' | t"
      [tooltip]="'Add Tag' | t"
      (clicked)="openAddDialog()"
    >
    </app-add-button>
  </div>
  <app-settings-entity-list>
    <app-table
      [columns]="columns"
      [displayedColumns]="displayedColumns"
      [dataSource]="dataSource()"
      [pagination]="true"
      [page]="(tagTableState()?.page ?? 1) - 1"
      [pageSize]="tagTableState()?.pageSize ?? 1"
      [length]="totalCount()"
      (sorted)="sorted($event)"
      (pageChange)="updatePageData($event)"
      emptyIcon="sell"
      [emptyText]="loaded() ? 'No tags yet. Add one, then tag products on your receipts.' : ''"
    >
      <app-add-button
        tableEmptyAction
        *hasAppPermission="Permission.AppTagsCreate"
        data-testid="tag-add-empty"
        [buttonText]="'Add Tag' | t"
        [tooltip]="'Add Tag' | t"
        (clicked)="openAddDialog()"
      ></app-add-button>
    </app-table>
  </app-settings-entity-list>
</app-settings-page>

<ng-template #nameCell let-element="element">{{ element.name }}</ng-template>

<ng-template #descriptionCell let-element="element"
>{{ element.description }}
</ng-template>

<ng-template #numberOfReceiptsCell let-element="element"
>{{ element.numberOfReceipts }}
</ng-template>

<ng-template #actionsCell let-element="element" let-index="index">
  <app-edit-button
    *hasAppPermission="Permission.AppTagsUpdate"
    data-testid="tag-edit"
    color="accent"
    (clicked)="openEditDialog(element)"
  ></app-edit-button>
  <app-delete-button
    *hasAppPermission="Permission.AppTagsDelete"
    data-testid="tag-delete"
    (clicked)="openDeleteConfirmationDialog(element)"
  ></app-delete-button>
</ng-template>
