<app-table-header
  headerText="System Tasks"
  subtitle="Review the background tasks the system has run and their results."
>
  <div class="flex items-center">
    <app-button
      data-testid="system-tasks-filter"
      icon="filter_alt"
      matButtonType="iconButton"
      tooltip="Filter System Tasks"
      color="accent"
      matBadgeColor="accent"
      [matBadgeContent]="numFiltersApplied()"
      (clicked)="filterButtonClicked()"
    ></app-button>
    <app-button
      *ngIf="(numFiltersApplied() ?? 0) > 0"
      data-testid="system-tasks-filter-reset"
      icon="restart_alt"
      matButtonType="iconButton"
      tooltip="Reset filter"
      color="accent"
      (clicked)="resetFilterButtonClicked()"
    ></app-button>
    <app-button
      matButtonType="iconButton"
      icon="refresh"
      color="accent"
      tooltip="Refresh System Tasks"
      (clicked)="refresh()"
    ></app-button>
  </div>
</app-table-header>

@if (filterChips().length > 0) {
  <div class="system-task-filter-chips flex flex-wrap gap-2" role="list" aria-label="Applied filters">
    @for (chip of filterChips(); track chip.key) {
      <span
        hlmBadge
        variant="secondary"
        role="listitem"
        class="h-7 gap-1.5 py-0 pl-3 pr-1.5 text-sm"
        [attr.data-testid]="'system-task-filter-chip-' + chip.key"
      >
        {{ chip.label }}
        <button
          type="button"
          class="rounded-full p-0.5 text-muted-foreground transition-colors hover:bg-foreground/10 hover:text-foreground"
          [attr.data-testid]="'system-task-filter-chip-clear-' + chip.key"
          [attr.aria-label]="'Remove ' + chip.label + ' filter'"
          (click)="filterChipCleared(chip.key)"
        >
          <app-icon name="cancel"></app-icon>
        </button>
      </span>
    }
  </div>
}

<app-task-table
  [filterProvider]="filterProvider"
  [expandedRowTemplate]="expandedRowTemplate"
  [showSourceFileActions]="true"
></app-task-table>

<ng-template
  #expandedRowTemplate
  let-element="element"
>
  <ng-container *ngIf="element.associatedEntityType === AssociatedEntityType.ReceiptProcessingSettings">
    <app-receipt-processing-settings-child-system-task-accordion
      [childTasks]="element.childSystemTasks ?? []"
    ></app-receipt-processing-settings-child-system-task-accordion>
  </ng-container>
</ng-template>
