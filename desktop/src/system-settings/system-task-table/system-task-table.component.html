<app-settings-section
  title="System Tasks"
  description="Review the background tasks the system has run and their results."
>
  <div sectionActions class="flex items-center">
    <button
      hlmBtn
      type="button"
      variant="ghost"
      size="icon"
      class="relative"
      data-testid="system-tasks-filter"
      [hlmTooltip]="'Filter System Tasks' | t"
      (click)="filterButtonClicked()"
    >
      <app-icon name="filter_alt"></app-icon>
      @if (numFiltersApplied(); as count) {
        <span hlmBadge class="pointer-events-none absolute -right-1.5 -top-1.5 h-4 min-w-4 justify-center px-1 text-[0.625rem] tabular-nums" data-testid="button-badge">{{ count }}</span>
      }
    </button>
    <button
      *ngIf="(numFiltersApplied() ?? 0) > 0"
      hlmBtn
      type="button"
      variant="ghost"
      size="icon"
      data-testid="system-tasks-filter-reset"
      [hlmTooltip]="'Reset filter' | t"
      (click)="resetFilterButtonClicked()"
    >
      <app-icon name="restart_alt"></app-icon>
    </button>
    <button
      hlmBtn
      type="button"
      variant="ghost"
      size="icon"
      [hlmTooltip]="'Refresh System Tasks' | t"
      (click)="refresh()"
    >
      <app-icon name="refresh"></app-icon>
    </button>
  </div>

@if (filterChips().length > 0) {
  <div class="flex flex-wrap gap-2 px-6 py-3" role="list" [attr.aria-label]="'Applied filters' | t">
    @for (chip of filterChips(); track chip.key) {
      <span
        hlmBadge
        variant="secondary"
        role="listitem"
        class="h-auto min-h-7 max-w-full gap-1.5 whitespace-normal py-1 pl-3 pr-1.5 text-left text-sm"
        [attr.data-testid]="'system-task-filter-chip-' + chip.key"
      >
        {{ chip.label }}
        <button
          type="button"
          class="rounded-full p-0.5 text-muted-foreground transition-colors hover:bg-foreground/10 hover:text-foreground"
          [attr.data-testid]="'system-task-filter-chip-clear-' + chip.key"
          [attr.aria-label]="'Remove filter: {name}' | t: { name: chip.label }"
          (click)="filterChipCleared(chip.key)"
        >
          <app-icon name="cancel"></app-icon>
        </button>
      </span>
    }
  </div>
}

<app-task-table
  [filterProvider]="filterProvider"
  [expandedRowTemplate]="expandedRowTemplate"
  [showSourceFileActions]="true"
></app-task-table>
</app-settings-section>

<ng-template
  #expandedRowTemplate
  let-element="element"
>
  <ng-container *ngIf="element.associatedEntityType === AssociatedEntityType.ReceiptProcessingSettings">
    <app-receipt-processing-settings-child-system-task-accordion
      [childTasks]="element.childSystemTasks ?? []"
    ></app-receipt-processing-settings-child-system-task-accordion>
  </ng-container>
</ng-template>
