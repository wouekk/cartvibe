<app-settings-section
  title="Logs"
  description="The newest lines of the app log, server-wide. The first place to look when someone reports an error."
>
  <div sectionActions class="flex flex-wrap items-center gap-2">
    <app-filter-bar
      data-testid="log-levels"
      [tabs]="levelTabs"
      [value]="level() || 'all'"
      (valueChange)="selectLevel($event === 'all' ? '' : $event)"
    ></app-filter-bar>
    <button hlmBtn variant="outline" type="button" data-testid="log-refresh" (click)="load()">
      <app-icon name="refresh"></app-icon>
      {{ 'Refresh' | t }}
    </button>
  </div>

  @if (loading()) {
    <p class="m-0 px-6 py-5 text-muted-foreground">{{ 'Loading…' | t }}</p>
  } @else if (entries().length === 0) {
    <p class="m-0 px-6 py-5 text-muted-foreground" data-testid="log-empty">{{ 'Nothing in the log.' | t }}</p>
  } @else {
    <ul class="m-0 list-none px-6 py-2 font-mono text-[13px]">
      @for (entry of entries(); track $index) {
        <li class="entry grid grid-cols-1 gap-0.5 border-b border-border py-1.5 last:border-b-0 sm:grid-cols-[150px_56px_1fr] sm:gap-2 [&.error_.level]:font-semibold [&.error_.level]:text-destructive" [class.error]="entry.level === 'ERROR' || entry.level === 'FATAL'">
          <span class="time">{{ entry.timestamp }}</span>
          <span class="level">{{ entry.level }}</span>
          <span class="message whitespace-pre-wrap [overflow-wrap:anywhere]">{{ entry.message }}</span>
        </li>
      }
    </ul>
  }
</app-settings-section>
