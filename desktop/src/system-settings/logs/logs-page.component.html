<div class="logs">
  <div class="toolbar">
    <div class="levels" role="group" aria-label="Level">
      @for (option of levels; track option.value) {
        <button
          hlmBtn variant="outline"
          type="button"
          [attr.data-testid]="'log-level-' + (option.value || 'all')"
          [class.active]="level() === option.value"
          (click)="selectLevel(option.value)"
        >
          {{ option.label }}
        </button>
      }
    </div>
    <button hlmBtn variant="outline" type="button" data-testid="log-refresh" (click)="load()">
      <app-icon name="refresh"></app-icon>
      Refresh
    </button>
  </div>

  @if (loading()) {
    <p class="muted">Loading…</p>
  } @else if (entries().length === 0) {
    <p class="muted" data-testid="log-empty">Nothing in the log.</p>
  } @else {
    <ul class="entries">
      @for (entry of entries(); track $index) {
        <li class="entry" [class.error]="entry.level === 'ERROR' || entry.level === 'FATAL'">
          <span class="time">{{ entry.timestamp }}</span>
          <span class="level">{{ entry.level }}</span>
          <span class="message">{{ entry.message }}</span>
        </li>
      }
    </ul>
  }
</div>
