<app-dialog [headerText]="headerText">
  <app-filter-field
    [label]="'Type' | t"
    fieldName="type"
    type="list"
    optionFilterKey="displayValue"
    optionDisplayKey="displayValue"
    optionValueKey="value"
    [parentForm]="parentForm"
    [options]="systemTaskTypeOptions"
    [multiple]="true"
  ></app-filter-field>

  <app-filter-field
    [label]="'Ran By' | t"
    fieldName="ranBy"
    type="list"
    optionFilterKey="displayName"
    optionDisplayKey="displayName"
    optionValueKey="id"
    [parentForm]="parentForm"
    [options]="ranByOptions()"
    [multiple]="true"
  ></app-filter-field>

  <app-filter-field
    [label]="'Started At' | t"
    fieldName="startedAt"
    type="date"
    [parentForm]="parentForm"
  ></app-filter-field>

  <app-filter-field
    [label]="'Ended At' | t"
    fieldName="endedAt"
    type="date"
    [parentForm]="parentForm"
  ></app-filter-field>

  <app-dialog-footer
    submitButtonTooltip="Apply filter"
    [additionalButtonsTemplate]="resetButton"
    (submitClicked)="submitButtonClicked()"
    (cancelClicked)="cancelButtonClicked()"
  ></app-dialog-footer>
</app-dialog>

<ng-template #resetButton>
  <button
    hlmBtn
    type="button"
    variant="ghost"
    size="icon"
    data-testid="system-tasks-filter-dialog-reset"
    [hlmTooltip]="'Reset filter' | t"
    (click)="resetFilter()"
  >
    <app-icon name="restart_alt"></app-icon>
  </button>
</ng-template>
