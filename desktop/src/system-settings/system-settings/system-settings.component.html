<div class="settings-shell">
  <div class="settings-heading">
    <h1>{{ 'System Settings' | t }}</h1>
    <p class="intro">{{ 'Settings for the whole household install. Changes apply to everyone.' | t }}</p>
  </div>
  <app-filter-bar
    class="settings-tabs"
    data-testid="system-settings-tabs"
    [tabs]="filterTabs"
    [value]="activeTab()"
    (valueChange)="select($event)"
  ></app-filter-bar>
  <div class="settings-content">
    <router-outlet></router-outlet>
  </div>
</div>
