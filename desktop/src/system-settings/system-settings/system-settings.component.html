<app-settings-page
  title="System Settings"
  description="Settings for the whole household install. Changes apply to everyone."
>
  <app-filter-bar
    settingsTabs
    data-testid="system-settings-tabs"
    [tabs]="filterTabs"
    [value]="activeTab()"
    (valueChange)="select($event)"
  ></app-filter-bar>
  <router-outlet></router-outlet>
</app-settings-page>
