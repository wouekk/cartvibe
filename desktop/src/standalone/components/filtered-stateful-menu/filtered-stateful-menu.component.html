<app-button
  [buttonClass]="buttonClass()"
  [color]="color()"
  [buttonText]="buttonText()"
  [type]="type()"
  [matButtonType]="matButtonType()"
  [icon]="icon"
  [customIcon]="customIcon"
  [tooltip]="tooltip()"
  [matBadgeContent]="matBadgeContent()"
  [matBadgeColor]="matBadgeColor()"
  [cdkMenuTriggerFor]="menu"
  (cdkMenuOpened)="resetFilter()"
>
</app-button>

<ng-template #menu>
  <div class="mat-mdc-menu-panel" cdkMenu>
    @if (headerText) {
      <h5 class="justify-center m-4">
        {{ headerText }}
      </h5>
    }
    <app-input
      [label]="filterLabel()"
      [inputFormControl]="filterFormControl"
      (click)="$event.stopImmediatePropagation(); $event.stopPropagation();"
    ></app-input>
    <div class="flex flex-col">
      @if (filteredItems.length === 0) {
        <div
          mat-menu-item
          class="pointer-events-none"
        >
          No items found
        </div>
      }
      @for (item of filteredItems(); track item.value) {
        <button
          mat-menu-item
          class="w-full p-2"
          [disabled]="readonly()"
          (click)="onItemSelected(item, $event)"
        >
          <div class="flex items-center">
            <mat-checkbox
              class="checkbox"
              [checked]="item.selected"
              [disabled]="readonly()"
            ></mat-checkbox>
            <div class="flex flex-col">
              <strong>
                {{ item.displayValue }}
              </strong>
              @if (item.subtitle) {
                <small> {{ item.subtitle }}</small>
              }
            </div>
          </div>
        </button>
      }
    </div>
  </div>
</ng-template>
