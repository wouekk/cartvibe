<app-button
  [buttonClass]="buttonClass()"
  [color]="color()"
  [buttonText]="buttonText()"
  [type]="type()"
  [matButtonType]="matButtonType()"
  [icon]="icon"
  [customIcon]="customIcon"
  [tooltip]="tooltip()"
  [matBadgeContent]="matBadgeContent()"
  [matBadgeColor]="matBadgeColor()"
  [cdkMenuTriggerFor]="menu"
  (cdkMenuOpened)="resetFilter()"
>
</app-button>

<ng-template #menu>
  <div class="z-50 max-h-96 min-w-56 overflow-y-auto rounded-md border border-border bg-popover p-1 text-popover-foreground shadow-md animate-in fade-in-0 zoom-in-95" cdkMenu>
    @if (headerText) {
      <h5 class="justify-center m-4">
        {{ headerText | t }}
      </h5>
    }
    <app-input
      [label]="filterLabel()"
      [inputFormControl]="filterFormControl"
      (click)="$event.stopImmediatePropagation(); $event.stopPropagation();"
    ></app-input>
    <div class="flex flex-col">
      @if (filteredItems.length === 0) {
        <div class="pointer-events-none px-2 py-1.5 text-sm text-muted-foreground">
          {{ 'No items found' | t }}
        </div>
      }
      @for (item of filteredItems(); track item.value) {
        <button
          hlmDropdownMenuItem
          class="w-full p-2"
          [disabled]="readonly()"
          (click)="onItemSelected(item, $event)"
        >
          <div class="flex items-center">
            <hlm-checkbox
              class="mr-2"
              [checked]="item.selected"
              [disabled]="readonly()"
            />
            <div class="flex flex-col">
              <strong>
                {{ item.displayValue }}
              </strong>
              @if (item.subtitle) {
                <small> {{ item.subtitle }}</small>
              }
            </div>
          </div>
        </button>
      }
    </div>
  </div>
</ng-template>
