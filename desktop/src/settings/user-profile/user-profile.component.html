<app-form
  [form]="form"
  [formConfig]="formConfig"
  [formTemplate]="formTemplate"
  [canEdit]="canEdit()"
  [editButtonRouterLink]="['/settings/user-profile/edit']"
  [editButtonQueryParams]="{tab: 'user-profile'}"
  [settingsCard]="true"
  settingsTitle="User Profile"
  [submitButtonDisabled]="form.pristine"
  (submitted)="submit()"
></app-form>

<ng-template #formTemplate>
  <app-form-section [panel]="true" [headerText]="'User Details' | t">
    <app-input
      [label]="'Username' | t"
      [inputFormControl]="form | formGet : 'username'"
      [readonly]="true"
      [hlmTooltip]="formConfig.mode === formMode.edit ? (usernameTooltip | t) : ''"
    ></app-input>
    <app-input
      [label]="'Name' | t"
      hint="Shown as who added a receipt"
      [inputFormControl]="form | formGet : 'displayName'"
      [readonly]="formConfig.mode | inputReadonly"
    ></app-input>
    <app-color-picker
      [label]="'Default avatar color' | t"
      [inputFormControl]="form | formGet : 'defaultAvatarColor'"
      [readonly]="formConfig.mode | inputReadonly"
    ></app-color-picker>
  </app-form-section>
</ng-template>


<div class="mt-4" data-testid="danger-zone" *hasAppPermission="Permission.AppAccountDelete">
  <app-settings-section
    tone="destructive"
    title="Danger Zone"
    description="Account deletion is irreversible. This will permanently remove all associated data including receipts, group memberships, and preferences."
  >
    <div sectionFooter class="rw-card__footer">
      <button
        type="button"
        class="inline-flex h-9 items-center justify-center rounded-lg bg-destructive px-4 text-sm font-medium text-white transition-colors hover:bg-destructive/90"
        (click)="deleteAccount()"
      >
        {{ 'Delete Account' | t }}
      </button>
    </div>
  </app-settings-section>
</div>
