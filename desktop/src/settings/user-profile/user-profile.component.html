<app-form
  [form]="form"
  [formConfig]="formConfig"
  [formTemplate]="formTemplate"
  [canEdit]="canEdit()"
  [editButtonRouterLink]="['/settings/user-profile/edit']"
  [editButtonQueryParams]="{tab: 'user-profile'}"
  (submitted)="submit()"
></app-form>

<ng-template #formTemplate>
  <app-form-section [headerText]="'User Details' | t">
    <app-input
      [label]="'Username' | t"
      [inputFormControl]="form | formGet : 'username'"
      [readonly]="true"
      [hlmTooltip]="formConfig.mode === formMode.edit ? usernameTooltip : ''"
    ></app-input>
    <app-input
      [label]="'Name' | t"
      hint="Shown as who added a receipt"
      [inputFormControl]="form | formGet : 'displayName'"
      [readonly]="formConfig.mode | inputReadonly"
    ></app-input>
    <app-color-picker
      [label]="'Default avatar color' | t"
      [inputFormControl]="form | formGet : 'defaultAvatarColor'"
      [readonly]="formConfig.mode | inputReadonly"
    ></app-color-picker>
  </app-form-section>
</ng-template>


<div data-testid="danger-zone" class="mt-6 rounded-md border border-destructive bg-destructive/5 p-4 [&_p]:mb-4 [&_p]:mt-2 [&_strong]:text-destructive" *hasAppPermission="Permission.AppAccountDelete">
  <strong>{{ 'Danger Zone' | t }}</strong>
  <p>{{ 'Account deletion is irreversible. This will permanently remove all associated data including receipts, group memberships, and preferences.' | t }}</p>
  <button
    type="button"
    class="inline-flex h-10 items-center justify-center rounded-lg bg-destructive px-4 text-sm font-medium text-white transition-colors hover:bg-destructive/90"
    (click)="deleteAccount()"
  >
    {{ 'Delete Account' | t }}
  </button>
</div>
