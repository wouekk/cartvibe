<app-avatar-photo class="mb-4"></app-avatar-photo>

<app-form
  [form]="form"
  [formConfig]="formConfig"
  [formTemplate]="formTemplate"
  [canEdit]="canEdit()"
  [editButtonRouterLink]="['/settings/user-profile/edit']"
  [editButtonQueryParams]="{tab: 'user-profile'}"
  [settingsCard]="true"
  settingsTitle="User Profile"
  [submitButtonDisabled]="form.pristine"
  (submitted)="submit()"
></app-form>

<ng-template #formTemplate>
  <app-form-section [panel]="true" [headerText]="'User Details' | t">
    <app-input
      [label]="'Username' | t"
      [inputFormControl]="form | formGet : 'username'"
      [readonly]="true"
      [hlmTooltip]="formConfig.mode === formMode.edit ? (usernameTooltip | t) : ''"
    ></app-input>
    <app-input
      [label]="'Name' | t"
      hint="Shown as who added a receipt"
      [inputFormControl]="form | formGet : 'displayName'"
      [readonly]="formConfig.mode | inputReadonly"
    ></app-input>
    <div class="flex flex-col gap-1.5">
      <span class="text-sm font-medium leading-none text-foreground" id="avatar-color-label">{{ 'Default avatar color' | t }}</span>
      <app-color-swatches
        labelledBy="avatar-color-label"
        testId="avatar-color-picker"
        buttonTestId="avatar-color"
        [swatches]="avatarSwatches()"
        [value]="avatarColor()"
        [readonly]="formConfig.mode | inputReadonly"
        (picked)="pickAvatarColor($event)"
      ></app-color-swatches>
    </div>
  </app-form-section>
</ng-template>


<div class="mt-4" data-testid="danger-zone" *hasAppPermission="Permission.AppAccountDelete">
  <app-settings-section
    tone="destructive"
    title="Danger Zone"
    description="Account deletion is irreversible. This will permanently remove all associated data including receipts, group memberships, and preferences."
  >
    <div sectionFooter class="cv-card__footer">
      <button
        type="button"
        hlmBtn
        variant="destructive"
        data-testid="account-delete"
        (click)="deleteAccount()"
      >
        {{ 'Delete Account' | t }}
      </button>
    </div>
  </app-settings-section>
</div>
