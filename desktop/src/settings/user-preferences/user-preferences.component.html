<app-form
  [form]="form"
  [formConfig]="formConfig"
  [formTemplate]="formTemplate"
  [canEdit]="canEdit()"
  [editButtonRouterLink]="['/settings/user-preferences/edit']"
  [editButtonQueryParams]="{tab: 'user-preferences'}"
  [settingsCard]="true"
  settingsTitle="User Preferences"
  [submitButtonDisabled]="form.pristine || (userShortcutComponent()?.editableListComponent()?.getCurrentRowOpen() ?? -1) >= 0"
  (submitted)="submit()"
></app-form>

<ng-template #formTemplate>
    <!-- Hidden (Phase 3 feedback): a household has no per-user default group, payer or status to choose.
         The section stays so the form still saves what it always did. -->
    <app-form-section
      *appFeature="'aiPoweredReceipts'"
      class="hidden"
      [headerText]="'Quick scan defaults' | t"
    >
      <app-group-autocomplete
        label="Default Group"
        [inputFormControl]="form | formGet : 'quickScanDefaultGroupId'"
        [readonly]="formConfig.mode | inputReadonly"
      >
      </app-group-autocomplete>
      <app-user-autocomplete
        [label]="'Default Paid By' | t"
        [inputFormControl]="form | formGet : 'quickScanDefaultPaidById'"
        [groupId]="$safeNavigationMigration(form.get('quickScanDefaultGroupId')?.value)"
        [selectGroupMembersOnly]="true"
        [readonly]="formConfig.mode | inputReadonly"
      ></app-user-autocomplete>
      <app-status-select
        [attr.aria-label]="'Default Status' | t"
        [inputFormControl]="form | formGet : 'quickScanDefaultStatus'"
        [readonly]="formConfig.mode | inputReadonly"
        [addBlankOption]="true"
      ></app-status-select>
    </app-form-section>
    <app-form-section [panel]="true" [headerText]="'Budget' | t">
      <app-input
       
        data-testid="monthly-spending-goal"
        type="text"
        [label]="goalLabel()"
        hint="Leave empty for no goal. The Dashboard compares each month with it."
        [inputFormControl]="form | formGet : 'monthlySpendingGoal'"
        [readonly]="formConfig.mode | inputReadonly"
      ></app-input>
    </app-form-section>
    <app-form-section [panel]="true" [headerText]="'Dashboard currency' | t">
      <app-input
       
        data-testid="display-currency"
        type="text"
        [label]="'Show the Dashboard in (currency code)' | t"
        hint="Three letters, like PLN or USD. Leave empty to see the household currency. Only the Dashboard converts; receipts stay as entered."
        [inputFormControl]="form | formGet : 'displayCurrency'"
        [readonly]="formConfig.mode | inputReadonly"
      ></app-input>
      <app-input
       
        data-testid="display-currency-rate"
        type="text"
        [label]="rateLabel()"
        hint="Your own rate: 4,25 means 1 household unit is 4,25 of your currency."
        [inputFormControl]="form | formGet : 'displayCurrencyRate'"
        [readonly]="formConfig.mode | inputReadonly"
      ></app-input>
    </app-form-section>
    <app-form-section [panel]="true" [headerText]="'Selection preferences' | t">
      <app-checkbox
       
        [label]="'Close the option list after each selection?' | t"
        [helpText]="'Applies to every multi-select field that shows its choices as chips - categories, tags, users, groups and so on. Leave it off to keep the list open so you can pick several in a row.' | t"
        [inputFormControl]="form | formGet : 'closeChipSelectOnSelect'"
        [readonly]="formConfig.mode | inputReadonly"
      ></app-checkbox>
    </app-form-section>
    <app-form-section
      [panel]="true"
      [headerText]="'Shortcuts' | t"
      [headerButtonsTemplate]="shortcutHeaderButtons"
    >
      <app-user-shortcut
        [parentForm]="form"
        [formConfig]="formConfig"
        [originalUserShortcuts]="originalUserShortcuts()"
        (shortcutDoneClicked)="shortcutDoneClicked()"
        (shortcutCancelClicked)="shortcutCancelClicked()"
        (formCommand)="handleFormCommand($event)"
      ></app-user-shortcut>
    </app-form-section>
</ng-template>

<ng-template #shortcutHeaderButtons>
  @if (formConfig.mode === FormMode.edit) {
    <app-add-button
      [tooltip]="'Add shortcut' | t"
      [disabled]="(userShortcutComponent()?.editableListComponent()?.getCurrentRowOpen() ?? -1) >= 0"
      (clicked)="addNewShortcut()"
    ></app-add-button>
  }
</ng-template>
