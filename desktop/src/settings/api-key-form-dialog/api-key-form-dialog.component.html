<app-dialog [headerText]="headerText">
  <div *ngIf="!apiKeyResult">
    <form [formGroup]="form">
      <div class="mb-2">
        <app-input
          [label]="'Name' | t"
          [placeholder]="'Enter API key name' | t"
          [inputFormControl]="form | formGet : 'name'"
        ></app-input>
      </div>

      <div class="mb-2">
        <app-input
          [label]="'Description' | t"
          [placeholder]="'Enter API key description (optional)' | t"
          [inputFormControl]="form | formGet : 'description'"
        ></app-input>
      </div>

      <div *ngIf="false" class="mb-2">
        <app-select
          [label]="'Scope' | t"
          optionValueKey="value"
          optionDisplayKey="label"
          [inputFormControl]="form | formGet : 'scope'"
          [options]="apiKeyScopes"
        ></app-select>
      </div>
    </form>

    <app-dialog-footer [editing]="!!apiKey"
      [submitButtonTooltip]="apiKey ? 'Update API Key' : 'Create API Key'"
      (submitClicked)="submitButtonClicked()"
      (cancelClicked)="cancelButtonClicked()"
    ></app-dialog-footer>
  </div>

  <div *ngIf="apiKeyResult" class="text-center">
    <div class="mb-6 rounded-lg border border-amber-300 bg-amber-50 px-4 py-3 text-sm text-amber-900">
      <app-icon class="me-2" name="warning"></app-icon>
      <strong>{{ 'Important:' | t }}</strong> {{ 'This API key will only be shown once. Make sure to copy it now!' | t }}
    </div>

    <div class="mb-6">
      <h4>{{ 'Your new API key:' | t }}</h4>
      <div class="flex items-center justify-center gap-2 mt-4">
        <code class="grow break-all rounded border bg-muted p-2 font-mono text-[0.9rem]">{{ apiKeyResult.key }}</code>
        <app-button
          matButtonType="iconButton"
          icon="content_copy"
          color="primary"
          [tooltip]="'Copy to clipboard' | t"
          (clicked)="copyToClipboard()"
        ></app-button>
      </div>
    </div>

    <div class="flex justify-center">
      <app-button
        [buttonText]="'Close' | t"
        color="primary"
        (clicked)="closeDialog()"
      ></app-button>
    </div>
  </div>
</app-dialog>
