<div class="flex w-full flex-col gap-1.5">
  @if (label) {
    <label class="text-sm font-medium leading-none text-foreground" [attr.for]="fieldId()">{{ label }}</label>
  }
  <input
    hlmInput
    appDateInput
    type="date"
    class="dark:[color-scheme:dark]"
    [id]="fieldId()"
    [readonly]="readonly"
    [formControl]="inputFormControl"
  />
  @if (inputFormControl.invalid && (inputFormControl.touched || inputFormControl.dirty)) {
    @for (err of formControlErrors | async; track err.error) {
      <p class="text-xs text-destructive" role="alert">{{ err.message }}</p>
    }
  }
</div>
