<div class="flex">
  @if ((parentForm() | formGet : basePath() + fieldName() + '.operation').value === FilterOperation.Between) {
    <!-- A range: beside its Operation on a wide screen; on a phone the two fields take the row and Operation goes under. -->
    <div class="flex w-full max-md:flex-col max-md:gap-2">
      <div class="flex w-1/2 items-center gap-2 max-md:w-full">
        <div class="w-1/2 min-w-0">
          <app-input
            *ngIf="type() === 'text' || type() === 'number'"
            [label]="'Start {label}' | t: { label: (label() | t) }"
            [isCurrency]="isCurrency()"
            [inputFormControl]="parentForm() | formGet : basePath() + fieldName() + '.value.0'"
            [additionalErrorMessages]="{
            'invalidValue': '{label} is invalid.'
            }"
          ></app-input>
          <app-datepicker
            *ngIf="type() === 'date'"
            [label]="'Start {label}' | t: { label: (label() | t) }"
            [inputFormControl]="parentForm() | formGet : basePath() + fieldName() + '.value.0'"
            [additionalErrorMessages]="{
            'invalidValue': '{label} is invalid.'
            }"
          >
          </app-datepicker>
        </div>
        <span class="between-separator">
          {{ 'and' | t }}
        </span>
        <div class="w-1/2 min-w-0">
          <app-input
            *ngIf="type() === 'text' || type() === 'number'"
            [label]="'End {label}' | t: { label: (label() | t) }"
            [isCurrency]="isCurrency()"
            [inputFormControl]="parentForm() | formGet : basePath() + fieldName() + '.value.1'"
          ></app-input>
          <app-datepicker
            *ngIf="type() === 'date'"
            [label]="'End {label}' | t: { label: (label() | t) }"
            [inputFormControl]="parentForm() | formGet : basePath() + fieldName() + '.value.1'"
          >
          </app-datepicker>
        </div>
      </div>

      <div class="ms-2 w-1/2 max-md:ms-0 max-md:w-full">
        <app-select
          [label]="'Operation' | t"
          [inputFormControl]="parentForm() | formGet : basePath() + fieldName() + '.operation'"
          [options]="type() | operations: false"
          [optionsDisplayArray]="type() | operations: true"
          [addEmptyOption]="true"
        ></app-select>
      </div>
    </div>
  } @else if ((parentForm() | formGet : basePath() + fieldName() + '.operation').value === FilterOperation.WithinCurrentMonth) {
    <!-- A range: beside its Operation on a wide screen; on a phone the two fields take the row and Operation goes under. -->
    <div class="flex w-full max-md:flex-col max-md:gap-2">
      <div class="flex w-1/2 items-center gap-2 max-md:w-full">
        <div class="w-1/2 min-w-0">
          <app-datepicker
            *ngIf="type() === 'date'"
            [label]="'Start {label}' | t: { label: (label() | t) }"
            [inputFormControl]="startOfMonthFormControl"
          >
          </app-datepicker>
        </div>
        <span class="between-separator">
          {{ 'and' | t }}
        </span>
        <div class="w-1/2 min-w-0">
          <app-datepicker
            *ngIf="type() === 'date'"
            [label]="'End {label}' | t: { label: (label() | t) }"
            [inputFormControl]="endOfTodayFormControl"
          >
          </app-datepicker>
        </div>
      </div>

      <div class="ms-2 w-1/2 max-md:ms-0 max-md:w-full">
        <app-select
          [label]="'Operation' | t"
          [inputFormControl]="parentForm() | formGet : basePath() + fieldName() + '.operation'"
          [options]="type() | operations: false"
          [optionsDisplayArray]="type() | operations: true"
          [addEmptyOption]="true"
        ></app-select>
      </div>
    </div>
  } @else {
    <app-input
      *ngIf="type() === 'text' || type() === 'number'"
      class="w-1/2"
      [label]="label()"
      [isCurrency]="isCurrency()"
      [inputFormControl]="parentForm() | formGet : basePath() + fieldName() + '.value'"
    ></app-input>
    <app-user-autocomplete
      *ngIf="type() === 'users'"
      class="w-1/2"
      optionValueKey="id"
      [label]="label()"
      [multiple]="true"
      [inputFormControl]="parentForm() | formGet : basePath() + fieldName() + '.value'"
    ></app-user-autocomplete>
    <app-datepicker
      *ngIf="type() === 'date'"
      class="w-1/2"
      [label]="label()"
      [inputFormControl]="parentForm() | formGet : basePath() + fieldName() + '.value'"
    >
    </app-datepicker>
    <app-autocomplete
      *ngIf="type() === 'list'"
      class="w-1/2"
      [multiple]="multiple()"
      [label]="label()"
      [inputFormControl]="parentForm() | formGet : basePath() + fieldName() + '.value'"
      [options]="options()"
      [optionValueKey]="optionValueKey()"
      [optionFilterKey]="optionFilterKey()"
      [optionDisplayKey]="optionDisplayKey()"
    >
    </app-autocomplete>
    <app-select
      class="ms-2 w-1/2"
      [label]="'Operation' | t"
      [inputFormControl]="parentForm() | formGet : basePath() + fieldName() + '.operation'"
      [options]="type() | operations: false"
      [optionsDisplayArray]="type() | operations: true"
      [addEmptyOption]="true"
    ></app-select>
  }
</div>
