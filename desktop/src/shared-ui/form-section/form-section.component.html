<div class="form-section-header" [ngClass]="{ 'mx-4': indent() && !panel(), 'mb-4': !panel(), 'cv-section__head': panel() }">
  <div class="flex items-center">
    @if (collapsed()) {
      <button
        type="button"
        class="me-2 cursor-pointer border-0 bg-transparent p-0 text-primary no-underline"
        (click)="toggleCollapsed()"
      >
        <app-icon [name]="isCollapsed ? 'expand_more' : 'expand_less'"></app-icon>
      </button>
    }
    <div class="flex flex-col">
      <strong [class]="panel() ? 'cv-section__title' : ''"> {{ headerText() | t }}</strong>
      @if (subtitle) {
        <small [class]="panel() ? 'cv-section__desc' : ''">{{ subtitle | t }}</small>
      }
    </div>

    <div class="ms-1">
      <ng-container
        *ngIf="headerButtonsTemplate"
        [ngTemplateOutlet]="headerButtonsTemplate"
      >
      </ng-container>
    </div>
  </div>
</div>
@if (!isCollapsed) {
  <div [ngClass]="{ 'mx-4': indent() && !panel(), 'flex flex-col gap-3': panel() }">
    <ng-content></ng-content>
  </div>
}
