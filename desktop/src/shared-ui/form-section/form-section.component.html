<div class="mb-4 form-section-header" [ngClass]="{ 'mx-4': indent() }">
  <div class="flex items-center">
    @if (collapsed()) {
      <button
        type="button"
        class="me-2 cursor-pointer border-0 bg-transparent p-0 text-primary no-underline"
        (click)="toggleCollapsed()"
      >
        <app-icon [name]="isCollapsed ? 'expand_more' : 'expand_less'"></app-icon>
      </button>
    }
    <div class="flex flex-col">
      <strong> {{ headerText() }}</strong>
      @if (subtitle) {
        <small>{{ subtitle }}</small>
      }
    </div>

    <div class="ms-1">
      <ng-container
        *ngIf="headerButtonsTemplate"
        [ngTemplateOutlet]="headerButtonsTemplate"
      >
      </ng-container>
    </div>
  </div>
</div>
@if (!isCollapsed) {
  <div [ngClass]="{ 'mx-4': indent() }">
    <ng-content></ng-content>
  </div>
}
