<app-dialog [headerText]="headerText">
  <!-- Focus starts on the question, not on Cancel: a focused button pops its tooltip open the moment the dialog does. -->
  <span cdkFocusInitial tabindex="-1" class="outline-none" data-testid="confirmation-dialog-content">
    {{ dialogContent | t }}
  </span>
  <app-dialog-footer
    [submitButtonTooltip]="confirmText"
    [submitDestructive]="destructive()"
    (submitClicked)="submitButtonClicked()"
    (cancelClicked)="cancelButtonClicked()"
  ></app-dialog-footer>
</app-dialog>
