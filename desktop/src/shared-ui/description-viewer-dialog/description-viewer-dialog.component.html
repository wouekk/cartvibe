<app-dialog [headerText]="data.headerText || 'Description'">
  <div class="flex justify-end">
    <app-copy-button
      [text]="data.description"
      [tooltip]="'Copy description' | t"
    ></app-copy-button>
  </div>
  <div class="max-h-[70vh] overflow-auto whitespace-pre-wrap break-words">
    <app-pretty-json
      [json]="data.description"
      [verticalJson]="true"
    ></app-pretty-json>
  </div>
  <div class="flex justify-end mt-4">
    <app-button
      [buttonText]="'Close' | t"
      matButtonType="basic"
      (clicked)="close()"
    ></app-button>
  </div>
</app-dialog>
