<div
  class="flex flex-col mb-4"
  [ngClass]="{
    'mb-4': bottomSpacing()
  }"
>
  @if (displayBackButton()) {
    <div class="flex items-center">
      <app-back-button
        color="accent"
        [tooltip]="'Back' | t"
        (clicked)="navigateBack()"
      ></app-back-button>
    </div>
  }
  <div class="flex items-center">
    <h2>{{ headerText() }}</h2>
    <ng-container
      *ngIf="headerButtonsTemplate"
      [ngTemplateOutlet]="headerButtonsTemplate"
    ></ng-container>
  </div>
</div>
