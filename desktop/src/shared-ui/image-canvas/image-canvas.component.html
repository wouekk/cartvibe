@if (src()) {
  <img
    #image
    class="cv-image-canvas__image"
    draggable="false"
    [src]="src()"
    [alt]="alt()"
    (load)="onImageLoad()"
  />
  <div #frame class="cv-image-canvas__frame">
    @for (corner of corners; track corner) {
      <span
        class="cv-image-canvas__handle"
        [attr.data-corner]="corner"
        (pointerdown)="onResizeStart($event, corner)"
        (dblclick)="$event.stopPropagation()"
      ></span>
    }
  </div>
}
