<div
  *ngIf="mode() && (mode() === formMode.edit || mode() == formMode.add)"
  class="mt-6 border-t border-border pt-4"
  data-testid="form-button-bar"
>
  <div
    class="flex flex-wrap items-center gap-2 [&>*]:my-0"
    [ngClass]="{
      'justify-end': justifyContentEnd(),
      'justify-between': !justifyContentEnd()
    }"
  >
    <ng-content></ng-content>
  </div>
</div>
