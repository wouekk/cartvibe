<div class="inline-flex items-center [&_[data-testid=receipts-month-label]_button]:min-w-42">
  <app-button
    data-testid="receipts-month-prev"
    matButtonType="iconButton"
    icon="chevron_left"
    color="accent"
    [tooltip]="'Previous month' | t"
    (clicked)="step(-1)"
  ></app-button>
  <app-button
    cdkOverlayOrigin
    #trigger="cdkOverlayOrigin"
    data-testid="receipts-month-label"
    matButtonType="basic"
    icon="calendar_month"
    color="accent"
    [tooltip]="'Filter by month' | t"
    aria-haspopup="dialog"
    [attr.aria-expanded]="panelOpen()"
    [buttonText]="label()"
    (clicked)="togglePanel()"
  ></app-button>
  <app-button
    data-testid="receipts-month-next"
    matButtonType="iconButton"
    icon="chevron_right"
    color="accent"
    [tooltip]="'Next month' | t"
    (clicked)="step(1)"
  ></app-button>
</div>

<!--
  A dialog, not a menu: the panel holds a pager, a grid and shortcuts rather
  than menu items, so it owns its own focus trap and Escape handling. The trap's
  autoCapture also restores focus to the trigger when the overlay is destroyed.
-->
<ng-template
  cdkConnectedOverlay
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  [cdkConnectedOverlayOrigin]="trigger"
  [cdkConnectedOverlayOpen]="panelOpen()"
  [cdkConnectedOverlayPositions]="panelPositions"
  [cdkConnectedOverlayHasBackdrop]="true"
  (backdropClick)="closePanel()"
  (detach)="closePanel()"
>
  <div
    class="rounded-lg border border-border bg-popover py-2 text-popover-foreground shadow-lg"
    role="dialog"
    [attr.aria-label]="'Filter by month' | t"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true"
    (keydown.escape)="closePanel()"
  >
    <div class="flex items-center justify-between px-2 pb-1">
      <app-button
        data-testid="month-stepper-year-prev"
        matButtonType="iconButton"
        icon="chevron_left"
        color="accent"
        [tooltip]="'Previous year' | t"
        [disabled]="!canPageBack()"
        (clicked)="pageYear(-1)"
      ></app-button>
      <span class="font-semibold" data-testid="month-stepper-year">{{ pagedYear() }}</span>
      <app-button
        data-testid="month-stepper-year-next"
        matButtonType="iconButton"
        icon="chevron_right"
        color="accent"
        [tooltip]="'Next year' | t"
        [disabled]="!canPageForward()"
        (clicked)="pageYear(1)"
      ></app-button>
    </div>

    <div class="grid grid-cols-[repeat(3,4.75rem)] gap-1 px-2">
      @for (short of shortMonthLabels; track $index) {
        <button
          type="button"
          class="h-9 cursor-pointer rounded-md border text-[0.8125rem] font-medium transition-colors [font:inherit]"
          [ngClass]="isSelected($index) ? 'border-transparent bg-primary font-semibold text-primary-foreground' : 'border-border bg-transparent text-foreground hover:bg-accent'"
          [attr.data-testid]="'month-stepper-month-' + $index"
          [attr.aria-label]="monthLabel($index) + ' ' + pagedYear()"
          [attr.aria-pressed]="isSelected($index)"
          (click)="pickMonth($index)"
        >
          {{ short }}
        </button>
      }
    </div>

    <div class="mt-2 flex items-center gap-1 border-t border-border px-2 pt-2 [&>button]:cursor-pointer [&>button]:rounded-sm [&>button]:px-2 [&>button]:py-1 [&>button]:text-xs [&>button]:font-medium [&>button]:hover:bg-accent">
      <button type="button" data-testid="month-stepper-this-month" (click)="pickRelativeMonth(0)">
        {{ 'This month' | t }}
      </button>
      <button type="button" data-testid="month-stepper-last-month" (click)="pickRelativeMonth(-1)">
        {{ 'Last month' | t }}
      </button>
      @if (showAllTime()) {
        <button
          type="button"
          class="ml-auto !text-muted-foreground hover:!bg-muted"
          data-testid="month-stepper-all-time"
          (click)="pickAllTime()"
        >
          {{ 'All time' | t }}
        </button>
      }
    </div>
  </div>
</ng-template>
