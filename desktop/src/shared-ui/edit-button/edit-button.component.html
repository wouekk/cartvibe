<button
  hlmBtn
  type="button"
  size="icon"
  [variant]="color === 'warn' ? 'destructive' : 'ghost'"
  [disabled]="disabled()"
  [hlmTooltip]="(tooltip ? tooltip : 'Edit') | t"
  [routerLink]="buttonRouterLink()"
  [queryParams]="buttonQueryParams()"
  (click)="clicked.emit()"
>
  <app-icon name="edit"></app-icon>
</button>
