<nav [class]="listClass" role="tablist">
  @for (tab of tabs(); track tab.name) {
    <a
      role="tab"
      [class]="triggerClass(tab.name === activeName())"
      [attr.aria-selected]="tab.name === activeName()"
      [routerLink]="[tab.routerLink]"
      [queryParams]="{ tab: tab.name }"
    >
      {{ tab.label }}
    </a>
  }
</nav>
<div class="mt-4">
  <router-outlet></router-outlet>
</div>
