<hlm-tabs [tab]="activeName()" (tabActivated)="activate($event)">
  <hlm-tabs-list class="max-w-full overflow-x-auto" [attr.aria-label]="'Sections' | t">
    @for (tab of tabs(); track tab.name) {
      <button [hlmTabsTrigger]="tab.name">{{ tab.label }}</button>
    }
  </hlm-tabs-list>
</hlm-tabs>
<div class="mt-4">
  <router-outlet></router-outlet>
</div>
