<app-button
  [matButtonType]="matButtonType()"
  [hlmDropdownMenuTrigger]="menu"
  [buttonText]="buttonText()"
  [color]="color()"
  [icon]="buttonIcon()"
  tooltip="Start queue"
></app-button>
<ng-template #menu>
<div hlmDropdownMenu class="w-56">
  <button hlmDropdownMenuItem (click)="initQueue(QueueMode.VIEW)">View Mode</button>

  @if (canEdit) {
    <button hlmDropdownMenuItem (click)="initQueue(QueueMode.EDIT)">Edit Mode</button>
  }
</div>
</ng-template>
