<app-dialog *ngIf="inDialog()" [headerText]="headerText">
  <ng-template [ngTemplateOutlet]="formTemplate"></ng-template>
</app-dialog>
<ng-container *ngIf="!inDialog()">
  <div [ngTemplateOutlet]="formTemplate"></div>
</ng-container>

<ng-template #formTemplate>
  <ng-container *ngIf="isOpen(); else preview">
    <app-filter-field
      [label]="'Receipt Date' | t"
      fieldName="date"
      type="date"
      [parentForm]="parentForm"
      [basePath]="basePath"
    ></app-filter-field>

    <app-filter-field
      [label]="'Name' | t"
      fieldName="name"
      type="text"
      [parentForm]="parentForm"
      [basePath]="basePath"
    ></app-filter-field>

    <!-- No "Paid by" filter (Phase 3 C4). One saved before still shows as a chip to clear. -->

    @if (showGroupFilter) {
      <app-filter-field
        [label]="'Household' | t"
        fieldName="group"
        type="list"
        optionFilterKey="name"
        optionDisplayKey="name"
        optionValueKey="id"
        [parentForm]="parentForm"
        [basePath]="basePath"
        [options]="groups() ?? []"
        [multiple]="true"
      ></app-filter-field>
    }

    <app-filter-field
      [label]="'Amount' | t"
      fieldName="amount"
      type="number"
      [parentForm]="parentForm"
      [basePath]="basePath"
      [isCurrency]="true"
    ></app-filter-field>

    <app-filter-field
      [label]="'Categories' | t"
      fieldName="categories"
      type="list"
      optionFilterKey="name"
      optionDisplayKey="name"
      optionValueKey="id"
      [parentForm]="parentForm"
      [basePath]="basePath"
      [options]="categories"
      [multiple]="true"
    ></app-filter-field>

    <app-filter-field
      [label]="'Tags' | t"
      fieldName="tags"
      type="list"
      optionFilterKey="name"
      optionDisplayKey="name"
      optionValueKey="id"
      [parentForm]="parentForm"
      [basePath]="basePath"
      [options]="tags"
      [multiple]="true"
    ></app-filter-field>

    <app-filter-field
      [label]="'Status' | t"
      fieldName="status"
      type="list"
      optionFilterKey="value"
      optionDisplayKey="displayValue"
      optionValueKey="value"
      [parentForm]="parentForm"
      [basePath]="basePath"
      [options]="receiptStatusOptions"
      [multiple]="true"
    ></app-filter-field>

    <app-filter-field
      [label]="'Done on' | t"
      fieldName="resolvedDate"
      type="date"
      [parentForm]="parentForm"
      [basePath]="basePath"
    ></app-filter-field>

    <app-filter-field
      [label]="'Added At' | t"
      fieldName="createdAt"
      type="date"
      [parentForm]="parentForm"
      [basePath]="basePath"
    ></app-filter-field>

    <ng-template
      [ngTemplateOutlet]="footerTemplate() ?? defaultFooter"
    ></ng-template>
  </ng-container>
</ng-template>

<ng-template #preview>
  <ng-template
    *ngIf="previewTemplate"
    [ngTemplateOutlet]="previewTemplate"
    [ngTemplateOutletContext]="previewTemplateContext()"
  ></ng-template>
</ng-template>

<ng-template #defaultFooter>
  <app-dialog-footer
    submitButtonTooltip="Apply filter"
    [additionalButtonsTemplate]="resetButton"
    (submitClicked)="submitButtonClicked()"
    (cancelClicked)="cancelButtonClicked()"
  ></app-dialog-footer>
</ng-template>

<ng-template #resetButton>
  <app-button
    matButtonType="iconButton"
    icon="restart_alt"
    color="accent"
    [tooltip]="'Reset filter' | t"
    (clicked)="resetFilter()"
  ></app-button>
</ng-template>
