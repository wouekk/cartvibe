<nav class="breadcrumb" [attr.aria-label]="'Breadcrumb' | t">
  @for (item of items(); track $index; let last = $last) {
    @if (item.routerLink && !last) {
      <a class="crumb" [routerLink]="item.routerLink">
        @if (item.icon) {
          <app-icon class="crumb-icon" [name]="item.icon"></app-icon>
        }
        {{ item.label | t }}
      </a>
    } @else {
      <span
        class="crumb"
        [class.current]="last"
        [attr.aria-current]="last ? 'page' : null"
      >
        @if (item.icon) {
          <app-icon class="crumb-icon" [name]="item.icon"></app-icon>
        }
        {{ item.label | t }}
      </span>
    }
    @if (!last) {
      <app-icon class="separator" name="chevron_right"></app-icon>
    }
  }
</nav>
