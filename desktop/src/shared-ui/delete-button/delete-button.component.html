<!-- Red unless a caller asks for another colour. -->
<button
  hlmBtn
  type="button"
  size="icon"
  [variant]="(color || 'warn') === 'warn' ? 'destructive' : 'ghost'"
  [disabled]="disabled()"
  [hlmTooltip]="(tooltip ?? 'Delete') | t"
  (click)="clicked.emit()"
>
  <app-icon name="delete"></app-icon>
</button>
