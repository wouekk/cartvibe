<app-card
  cardStyle="dashboard-card"
>
  <ng-container header>
    <h3>{{ headerText() }}</h3>
  </ng-container>
  <ng-container content>
    <ng-template
      [ngTemplateOutlet]="owedTemplate"
      [ngTemplateOutletContext]="{
        map: usersOweMap(),
        headerText: 'Users Owe Me',
        emptyText: 'Nobody owes me!'
      }"
    ></ng-template>
    <ng-template
      [ngTemplateOutlet]="owedTemplate"
      [ngTemplateOutletContext]="{
        map: userOwesMap(),
        headerText: 'I Owe',
        emptyText: 'Phew, I don\'t owe anything!'
      }"
    ></ng-template>
  </ng-container>
</app-card>

<ng-template
  let-map="map"
  let-headerText="headerText"
  let-emptyText="emptyText"
  #owedTemplate
>
  <div role="list" class="flex flex-col gap-1">
    <strong>{{ headerText }}</strong>
    <div *ngIf="map.size === 0" role="listitem" class="text-sm text-muted-foreground">{{ emptyText }}</div>
    <div *ngFor="let e of map | keyvalue" role="listitem" class="text-sm tabular-nums">
      {{ ($any(e.key) | user)?.displayName }} - {{ $any(e.value) | customCurrency }}
    </div>
  </div>
</ng-template>
