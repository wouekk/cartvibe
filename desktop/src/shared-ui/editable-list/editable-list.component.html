<div role="list" class="flex flex-col">
  @for (row of listData(); let i = $index; track row?.[trackByKey()]) {
    @if (rowOpen() === i && editTemplate) {
      <ng-template
        [ngTemplateOutlet]="editTemplate"
        [ngTemplateOutletContext]="{ i: i }"
      ></ng-template>
    } @else {
      <div role="listitem" class="flex items-center gap-3 border-b border-border py-2 last:border-b-0">
        <div class="min-w-0 flex-1">
          <div class="text-sm font-medium">
            <ng-container
              [ngTemplateOutlet]="itemTitleTemplate()"
              [ngTemplateOutletContext]="{ row: row }"
            ></ng-container>
          </div>
          <div class="text-sm text-muted-foreground">
            <ng-container
              [ngTemplateOutlet]="itemSubtitleTemplate()"
              [ngTemplateOutletContext]="{ row: row }"
            >
            </ng-container>
          </div>
        </div>
        @if (!readonly()) {
          <div class="flex items-center">
            <app-edit-button
              color="accent"
              [disabled]="rowOpen() !== undefined"
              (clicked)="handleEditButtonClicked(i)"
            ></app-edit-button>
            <app-delete-button
              [disabled]="rowOpen() !== undefined"
              (clicked)="handleDeleteButtonClicked(i)"
            >
            </app-delete-button>
          </div>
        }
      </div>
    }
  }
</div>
