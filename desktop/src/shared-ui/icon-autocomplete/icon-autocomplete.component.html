<app-autocomlete
  optionFilterKey="displayValue"
  optionDisplayKey="displayValue"
  optionValueKey="value"
  [label]="label()"
  [inputFormControl]="inputFormControl()"
  [options]="icons() ?? []"
  [optionTemplate]="optionTemplate"
  [displayWith]="displayWith.bind(this)"
></app-autocomlete>

<ng-template
  #optionTemplate
  let-option="option"
>
  <div class="flex items-center">
    <app-icon
      class="me-2"
     [name]="option.value"></app-icon>
    {{ option.displayValue }}

  </div>
</ng-template>
