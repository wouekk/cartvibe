<app-dialog [headerText]="data.name || ('Source File' | t)">
  <app-image-viewer [imageBase64]="data.encodedImage"></app-image-viewer>
  <div class="flex justify-end mt-4">
    <button
      hlmBtn
      type="button"
      variant="ghost"
      (click)="close()"
    >
      <span class="font-medium">{{ 'Close' | t }}</span>
    </button>
  </div>
</app-dialog>
