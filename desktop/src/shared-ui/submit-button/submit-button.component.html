<button
  *ngIf="onlyIcon()"
  hlmBtn
  [type]="type() || 'submit'"
  variant="ghost"
  size="icon"
  [class]="unsaved() ? 'cv-unsaved' : ''"
  [disabled]="effectiveDisabled()"
  [hlmTooltip]="(tooltip ?? 'Save') | t"
  (click)="clicked.emit()"
>
  <app-icon name="done"></app-icon>
</button>

<button
  *ngIf="!onlyIcon()"
  hlmBtn
  [type]="type() || 'submit'"
  [variant]="destructive() ? 'destructive' : 'default'"
  [class]="unsaved() ? 'cv-unsaved' : ''"
  [disabled]="effectiveDisabled()"
  [hlmTooltip]="(tooltip ?? '') | t"
  (click)="clicked.emit()"
>
  <span class="font-medium">{{ (buttonText() ?? 'Save') | t }}</span>
</button>
