<app-button
  *ngIf="onlyIcon()"
  icon="done"
  matButtonType="iconButton"
  [buttonText]="buttonText() ?? 'Save'"
  [type]="type() || 'submit'"
  [tooltip]="tooltip ?? 'Save'"
  (clicked)="clicked.emit()"
  [disabled]="effectiveDisabled()"
></app-button>

<app-button
  *ngIf="!onlyIcon()"
  matButtonType="matRaisedButton"
  [color]="destructive() ? 'warn' : 'primary'"
  [buttonText]="buttonText() ?? 'Save'"
  [type]="type() || 'submit'"
  [tooltip]="tooltip ?? ''"
  (clicked)="clicked.emit()"
  [disabled]="effectiveDisabled()"
></app-button>
