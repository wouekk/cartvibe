<div [class]="listClass" role="tablist">
  @for (tab of tabs(); track tab.value) {
    <button
      type="button"
      role="tab"
      class="filter-tab"
      [class]="triggerClass(value() === tab.value)"
      [class.active]="value() === tab.value"
      [attr.aria-selected]="value() === tab.value"
      (click)="select(tab.value)"
    >
      @if (tab.icon) {
        <mat-icon class="size-[17px] text-[17px]">{{ tab.icon }}</mat-icon>
      }
      {{ tab.label }}
      @if (tab.count !== undefined) {
        <span class="pill rounded-full bg-secondary px-2 py-px text-[11px] font-semibold text-secondary-foreground">{{ tab.count }}</span>
      }
    </button>
  }
</div>
