<hlm-tabs [tab]="value()" (tabActivated)="select($event)">
  <hlm-tabs-list class="max-w-full overflow-x-auto" aria-label="Filter">
    @for (tab of tabs(); track tab.value) {
      <button class="filter-tab" [hlmTabsTrigger]="tab.value" [class.active]="value() === tab.value">
        @if (tab.icon) {
          <mat-icon class="size-[17px] text-[17px]">{{ tab.icon }}</mat-icon>
        }
        {{ tab.label }}
        @if (tab.count !== undefined) {
          <span class="pill rounded-full bg-secondary px-2 py-px text-[11px] font-semibold text-secondary-foreground">{{ tab.count }}</span>
        }
      </button>
    }
  </hlm-tabs-list>
</hlm-tabs>
