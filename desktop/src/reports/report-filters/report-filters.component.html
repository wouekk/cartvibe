@for (def of activeFields(); track def.field) {
  <div class="mb-1 flex items-start gap-2">
    @if (operationValueOf(def.field) === FilterOperation.Between) {
      <div class="flex min-w-0 flex-1 items-center gap-1.5">
        <app-input *ngIf="def.type === 'text' || def.type === 'number'" class="min-w-0 flex-1"
          [isCurrency]="!!def.isCurrency" [label]="'Start {label}' | t: { label: (def.label | t) }"
          [inputFormControl]="filterGroup | formGet: def.field + '.value.0'"></app-input>
        <app-datepicker *ngIf="def.type === 'date'" class="min-w-0 flex-1"
          [label]="'Start {label}' | t: { label: (def.label | t) }"
          [inputFormControl]="filterGroup | formGet: def.field + '.value.0'"></app-datepicker>
        <span class="flex-none text-xs text-muted-foreground">{{ 'and' | t }}</span>
        <app-input *ngIf="def.type === 'text' || def.type === 'number'" class="min-w-0 flex-1"
          [isCurrency]="!!def.isCurrency" [label]="'End {label}' | t: { label: (def.label | t) }"
          [inputFormControl]="filterGroup | formGet: def.field + '.value.1'"></app-input>
        <app-datepicker *ngIf="def.type === 'date'" class="min-w-0 flex-1"
          [label]="'End {label}' | t: { label: (def.label | t) }"
          [inputFormControl]="filterGroup | formGet: def.field + '.value.1'"></app-datepicker>
      </div>
    } @else {
      <app-input *ngIf="def.type === 'text' || def.type === 'number'" class="min-w-0 flex-1"
        [isCurrency]="!!def.isCurrency" [label]="def.label"
        [inputFormControl]="filterGroup | formGet: def.field + '.value'"></app-input>
      <app-datepicker *ngIf="def.type === 'date'" class="min-w-0 flex-1"
        [label]="def.label"
        [inputFormControl]="filterGroup | formGet: def.field + '.value'"></app-datepicker>
      <app-autocomlete *ngIf="def.type === 'users'" class="min-w-0 flex-1"
        [label]="def.label" [multiple]="true"
        [options]="paidByOptions()"
        optionValueKey="id" optionFilterKey="displayName" optionDisplayKey="displayName"
        [inputFormControl]="filterGroup | formGet: def.field + '.value'"></app-autocomlete>
      <app-autocomlete *ngIf="def.type === 'list'" class="min-w-0 flex-1"
        [label]="def.label" [multiple]="true"
        [options]="optionsFor(def)"
        [optionValueKey]="def.optionValueKey ?? ''"
        [optionFilterKey]="def.optionFilterKey ?? ''"
        [optionDisplayKey]="def.optionDisplayKey ?? ''"
        [inputFormControl]="filterGroup | formGet: def.field + '.value'"></app-autocomlete>
    }

    <app-select class="w-37.5 flex-none" [label]="'Operation' | t" [addEmptyOption]="true"
      [options]="operationOptions(def.type)" [optionsDisplayArray]="operationDisplay(def.type)"
      [inputFormControl]="filterGroup | formGet: def.field + '.operation'"></app-select>

    <app-button matButtonType="iconButton" icon="close" color="warn" [tooltip]="'Remove filter' | t"
      (clicked)="removeFilter(def.field)" data-testid="report-filter-remove"></app-button>
  </div>
}

@if (addableFields().length > 0) {
  <app-select class="mt-1 block" [label]="'Add filter…' | t" [addEmptyOption]="true"
    optionValueKey="field" optionDisplayKey="label"
    [options]="addableFields()" [inputFormControl]="addFilterControl"
    data-testid="report-add-filter"></app-select>
}
