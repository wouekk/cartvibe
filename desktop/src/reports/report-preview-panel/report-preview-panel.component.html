<div class="p-4 sm:p-6">
  <div class="mb-4 flex flex-wrap items-center gap-x-3 gap-y-2">
    <span class="inline-flex items-center gap-2 text-[11px] font-semibold uppercase tracking-wide text-muted-foreground">
      <span class="size-1.5 rounded-full bg-success-text" aria-hidden="true"></span>
      {{ 'LIVE PREVIEW' | t }}
    </span>
    <span class="text-xs text-muted-foreground">{{ 'Rendered from your data' | t }}</span>
    <span class="flex-1"></span>
    @if (ready() && !error()) {
      <button
        hlmBtn
        variant="outline"
        size="sm"
        type="button"
        class="tabular-nums [&_app-icon]:size-4"
        data-testid="report-receipt-count"
        (click)="openReceipts()"
      >
        <app-icon name="receipt_long"></app-icon>{{ receiptCount() }} {{ receiptCount() | plural: 'receipt' : 'receipts' }}
        <app-icon name="chevron_right"></app-icon>
      </button>
    }
  </div>

  <div class="relative mx-auto max-w-190">
    @if (!ready()) {
      <div class="flex flex-col items-center gap-3 rounded-xl border border-dashed border-border bg-card px-6 py-16 text-center">
        <span class="inline-flex size-10 items-center justify-center rounded-full bg-muted text-muted-foreground [&_app-icon]:size-5" aria-hidden="true">
          <app-icon name="summarize"></app-icon>
        </span>
        <p class="m-0 max-w-xs text-sm text-muted-foreground">{{ 'Add a group and at least one column to see a preview.' | t }}</p>
      </div>
    } @else if (error()) {
      <div class="flex flex-col items-center gap-3 rounded-xl border border-dashed border-destructive/40 bg-card px-6 py-16 text-center" role="alert">
        <span class="inline-flex size-10 items-center justify-center rounded-full bg-destructive/10 text-destructive [&_app-icon]:size-5" aria-hidden="true">
          <app-icon name="error_outline"></app-icon>
        </span>
        <p class="m-0 max-w-xs text-sm text-destructive">{{ 'Couldn\'t render the preview.' | t }}</p>
      </div>
    } @else {
      <!-- The engine's own document, as it will print: a white page in both themes. -->
      <div class="relative overflow-hidden rounded-xl border border-border bg-card">
        <iframe
          #frame
          class="block min-h-80 w-full border-0"
          [title]="'Report preview' | t"
          sandbox="allow-same-origin"
          [style.height.px]="frameHeight()"
          [srcdoc]="safeHtml()"
          (load)="onFrameLoad(frame)"
        ></iframe>
        @if (loading()) {
          <div class="absolute right-3 top-3 text-muted-foreground [&_app-icon]:size-4 [&_app-icon]:animate-spin">
            <app-icon name="autorenew"></app-icon>
          </div>
        }
      </div>
    }
  </div>
</div>
