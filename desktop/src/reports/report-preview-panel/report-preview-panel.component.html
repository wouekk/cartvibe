<div class="preview">
  <div class="preview__header">
    <span class="preview__dot"></span>
    <span class="preview__title">LIVE PREVIEW</span>
    <span class="preview__subtitle">Rendered from your data</span>
    <span class="preview__spacer"></span>
    @if (ready() && !error()) {
      <span class="preview__count" (click)="openReceipts()" data-testid="report-receipt-count">
        <app-icon name="receipt_long"></app-icon>{{ receiptCount() }} receipts
        <app-icon name="chevron_right"></app-icon>
      </span>
    }
  </div>

  <div class="preview__stage">
    @if (!ready()) {
      <div class="preview__placeholder">
        <app-icon name="summarize"></app-icon>
        Add a group and at least one column to see a preview.
      </div>
    } @else if (error()) {
      <div class="preview__placeholder preview__placeholder--error">
        <app-icon name="error_outline"></app-icon>
        Couldn't render the preview.
      </div>
    } @else {
      <div class="preview__paper">
        <iframe
          #frame
          class="preview__frame"
          title="Report preview"
          sandbox="allow-same-origin"
          [style.height.px]="frameHeight()"
          [srcdoc]="safeHtml()"
          (load)="onFrameLoad(frame)"
        ></iframe>
        @if (loading()) {
          <div class="preview__loading">
            <app-icon name="autorenew"></app-icon>
          </div>
        }
      </div>
    }
  </div>
</div>
