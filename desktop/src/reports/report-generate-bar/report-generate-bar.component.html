<div class="flex flex-wrap items-center gap-x-4 gap-y-3 border-t border-border bg-card px-4 py-3 sm:px-6">
  <div class="flex flex-wrap items-center gap-x-3 gap-y-2">
    <span class="text-[0.6875rem] font-semibold uppercase tracking-wide text-muted-foreground">{{ 'FORMAT' | t }}</span>
    <!-- Formats are toggles (several may be picked), drawn as one segmented control. -->
    <div class="inline-flex h-control items-stretch rounded-lg border border-border bg-muted/40 p-0.5" role="group" [attr.aria-label]="'Format' | t">
      @for (format of formats; track format.key) {
        <button
          type="button"
          class="inline-flex items-center gap-1.5 rounded-md px-3 text-sm font-medium transition-colors duration-150 motion-reduce:transition-none focus-visible:outline-none focus-visible:ring-3 focus-visible:ring-ring/50 [&_app-icon]:size-4"
          [ngClass]="isSelected(format.key) ? 'bg-card text-foreground shadow-xs' : 'text-muted-foreground hover:text-foreground'"
          [attr.aria-pressed]="isSelected(format.key)"
          [attr.data-testid]="'report-format-' + format.key"
          (click)="toggle(format.key)"
        >
          <app-icon [name]="isSelected(format.key) ? 'check_circle' : format.icon"></app-icon>
          {{ format.label }}
        </button>
      }
    </div>
    <span data-testid="report-format-summary" class="text-xs text-muted-foreground max-sm:hidden">{{ formatSummary() | t }}</span>
  </div>

  <span class="hidden flex-1 sm:block"></span>

  <div class="flex flex-wrap items-center gap-2">
    @if (generating()) {
      <app-icon class="size-4 animate-spin text-muted-foreground" name="autorenew"></app-icon>
    }
    @if (saveTemplateAllowed()) {
      <button
        hlmBtn
        type="button"
        data-testid="report-save-template"
        [disabled]="!canSaveTemplate() || saving()"
        (click)="onSaveTemplate()"
      >
        <app-icon name="bookmark_add"></app-icon>
        <span class="font-medium">{{ (saveTemplateText()) | t }}</span>
      </button>
    }
    @if (generateAllowed()) {
      <button
        hlmBtn
        type="button"
        data-testid="report-generate"
        [disabled]="!canGenerate() || generating()"
        (click)="onGenerate()"
      >
        @if (generating() ? '' : 'play_arrow'; as icon) {
          <app-icon [name]="icon"></app-icon>
        }
        <span class="font-medium">{{ (generating() ? 'Generating…' : 'Generate Report') | t }}</span>
      </button>
    }
  </div>
</div>
