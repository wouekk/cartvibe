<div class="flex h-full min-h-0 flex-col bg-background">
  <header class="flex flex-none flex-wrap items-center gap-x-3 gap-y-2 border-b border-border px-4 py-3 sm:px-6">
    <app-button
      matButtonType="iconButton"
      icon="arrow_back"
      [tooltip]="'Back to Reports' | t"
      data-testid="report-builder-back"
      [buttonRouterLink]="['/reports']"
    ></app-button>
    <div class="min-w-0 flex-1">
      <nav class="flex min-w-0 items-center gap-1 text-[11px] font-semibold uppercase tracking-wide text-muted-foreground [&_app-icon]:size-3 [&_app-icon]:flex-none" [attr.aria-label]="'Breadcrumb' | t">
        <a class="text-inherit no-underline transition-colors duration-150 hover:text-foreground" [routerLink]="['/reports']">{{ 'Reports' | t }}</a>
        <app-icon name="chevron_right"></app-icon>
        <span class="truncate">{{ loadedTemplateName() ?? ('New report' | t) }}</span>
      </nav>
      <h1 class="m-0 truncate text-2xl font-semibold leading-tight text-foreground">{{ 'Report Builder' | t }}</h1>
    </div>
    <span class="inline-flex items-center gap-1.5 text-xs text-muted-foreground max-sm:w-full max-sm:pl-12 [&_app-icon]:size-3.5">
      <app-icon name="lock"></app-icon>
      {{ 'Runs under your group permissions' | t }}
    </span>
  </header>

  <!-- Two panes scrolling on their own; stacked below 900px, where the page scrolls as one. -->
  <div class="flex min-h-0 flex-1 max-[900px]:flex-col max-[900px]:overflow-y-auto">
    <div class="w-[30rem] flex-none overflow-y-auto border-r border-border p-4 max-[900px]:w-full max-[900px]:flex-none max-[900px]:overflow-visible max-[900px]:border-b max-[900px]:border-r-0">
      <app-report-config-panel [form]="form"></app-report-config-panel>
    </div>
    <div class="min-w-0 flex-1 overflow-y-auto bg-muted/40 max-[900px]:flex-none max-[900px]:overflow-visible">
      <app-report-preview-panel
        [form]="form"
        [html]="previewHtml()"
        [receiptCount]="receiptCount()"
        [loading]="previewLoading()"
        [error]="previewError()"
        [ready]="canPreview()"
      ></app-report-preview-panel>
    </div>
  </div>

  <app-report-generate-bar
    [form]="form"
    [generating]="generating()"
    [canGenerate]="canGenerate()"
    [canSaveTemplate]="canSaveTemplate()"
    [saving]="saving()"
    [isEditMode]="isEditMode"
    [saveTemplateAllowed]="saveTemplateAllowed()"
    [generateAllowed]="generateAllowed()"
    (generate)="generate()"
    (saveTemplate)="saveTemplate()"
  ></app-report-generate-bar>
</div>
