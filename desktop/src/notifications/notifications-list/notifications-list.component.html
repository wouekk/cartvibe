<div class="flex justify-items-end items-center">
  <strong class="me-4">{{ 'Notifications' | t }}</strong>
  <app-button
    matButtonType="basic"
    [buttonText]="'Mark all as read' | t"
    (clicked)="deleteAllNotifications()"
    [disabled]="notifications().length === 0"
  ></app-button>
</div>
<hr />
<div class="flex flex-col items-center">
  <div class="w-full" *ngFor="let notification of notifications()">
    <app-notification
      class="w-full"
      [notification]="notification"
      (notificationDeleted)="notificationDeleted($event)"
    ></app-notification>
    <hr />
  </div>
  <div *ngIf="notifications().length === 0">{{ 'All caught up!' | t }}</div>
</div>
