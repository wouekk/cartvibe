<div class="flex min-w-0 flex-wrap items-center justify-between gap-x-4 gap-y-1 px-3 pb-3" data-testid="notifications-header">
  <strong class="min-w-0 shrink-0 text-sm font-semibold">{{ 'Notifications' | t }}</strong>
  <app-button
    matButtonType="basic"
    [buttonText]="'Mark all as read' | t"
    (clicked)="deleteAllNotifications()"
    [disabled]="notifications().length === 0"
  ></app-button>
</div>
<div class="flex flex-col divide-y divide-border border-t border-border">
  <div class="w-full py-1" *ngFor="let notification of notifications()">
    <app-notification
      class="block w-full"
      [notification]="notification"
      (notificationDeleted)="notificationDeleted($event)"
    ></app-notification>
  </div>
  <div class="px-3 py-4 text-sm text-muted-foreground" *ngIf="notifications().length === 0">{{ 'All caught up!' | t }}</div>
</div>
