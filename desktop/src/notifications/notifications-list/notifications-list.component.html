<div class="flex min-w-0 flex-wrap items-center justify-between gap-x-4 gap-y-1 pb-2" data-testid="notifications-header">
  <strong class="min-w-0 shrink-0">{{ 'Notifications' | t }}</strong>
  <app-button
    matButtonType="basic"
    [buttonText]="'Mark all as read' | t"
    (clicked)="deleteAllNotifications()"
    [disabled]="notifications().length === 0"
  ></app-button>
</div>
<hr />
<div class="flex flex-col items-center">
  <div class="w-full" *ngFor="let notification of notifications()">
    <app-notification
      class="w-full"
      [notification]="notification"
      (notificationDeleted)="notificationDeleted($event)"
    ></app-notification>
    <hr />
  </div>
  <div class="py-3 text-sm text-muted-foreground" *ngIf="notifications().length === 0">{{ 'All caught up!' | t }}</div>
</div>
