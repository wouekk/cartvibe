<div class="flex items-start gap-1">
  <a
    class="notification flex min-w-0 flex-1 flex-col gap-1 rounded-md px-3 py-3 no-underline transition-colors hover:bg-muted focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
    [routerLink]="[link]"
  >
    <strong class="text-sm font-semibold leading-snug text-foreground">{{ notification().title | t }}</strong>
    <span class="text-sm leading-snug text-muted-foreground">{{ parsedBody | t }}</span>
    <small class="text-[11px] font-medium uppercase tracking-wide text-muted-foreground/80 tabular-nums">{{
      notification().createdAt | appDate
    }}</small>
  </a>
  <app-cancel-button
    *hasAppPermission="Permission.AppNotificationsDelete"
    (clicked)="deleteNotification()"
  ></app-cancel-button>
</div>
