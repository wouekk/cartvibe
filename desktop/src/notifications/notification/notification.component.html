<div class="flex items-center">
  <a class="notification" [routerLink]="[link]">
    <div class="w-full">
      <div class="w-full flex flex-col">
        <strong>{{ notification().title | t }}</strong>
        <div>{{ parsedBody | t }}</div>
        <small>{{ notification().createdAt | appDate }}</small>
      </div>
    </div>
  </a>
  <app-cancel-button
    *hasAppPermission="Permission.AppNotificationsDelete"
    (clicked)="deleteNotification()"
  ></app-cancel-button>
</div>
