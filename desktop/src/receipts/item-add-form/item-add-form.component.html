<div class="mb-4 animate-in fade-in slide-in-from-top-2 duration-200" #addForm>
  <app-card cardStyle="w-100 mb-2 add-form-card">
    <div content>
      <div class="mb-4 flex flex-wrap">
        <app-input
          #nameInput
          [label]="'Name' | t"
          class="flex-1 min-w-0"
          [inputFormControl]="newItemFormGroup | formGet : 'name'"
          (keydown.enter)="onNameEnter($event)"
          (keydown.escape)="onCancel()"
        >
        </app-input>
        <app-input
          #amountInput
          [label]="'Amount' | t"
          class="flex-1 min-w-0"
          type="text"
          [isCurrency]="true"
          [inputFormControl]="newItemFormGroup | formGet : 'amount'"
          [readonly]="mode() | inputReadonly"
          (keydown.enter)="onAmountEnter($event)"
          (keydown.escape)="onCancel()"
        >
        </app-input>

        @if (!selectedGroup()?.groupReceiptSettings?.hideItemCategories) {
          <app-category-autocomplete
            #categoryInput
            [categories]="categories()"
            [inputFormControl]="newItemFormGroup | formGet : 'categories'"
            [readonly]="mode() | inputReadonly"
            (keydown.enter)="onCategoryEnter($event)"
            (keydown.escape)="onCancel()"
          ></app-category-autocomplete>
        }

        @if (!selectedGroup()?.groupReceiptSettings?.hideItemTags) {
          <app-tag-autocomplete
            #tagInput
            [tags]="tags()"
            [inputFormControl]="newItemFormGroup | formGet : 'tags'"
            [readonly]="mode() | inputReadonly"
            (keydown.enter)="onTagEnter($event)"
            (keydown.escape)="onCancel()"
          ></app-tag-autocomplete>
        }
      </div>
      <div class="flex flex-wrap justify-end gap-2 max-md:justify-center">
        <app-button
          matButtonType="basic"
          [buttonText]="'Add Item'"
          color="primary"
          (clicked)="onSubmitAndContinue()"
          [disabled]="!newItemFormGroup.valid"
        ></app-button>
        <app-button
          matButtonType="basic"
          [buttonText]="'Add & Done'"
          color="accent"
          (clicked)="onSubmitAndFinish()"
          [disabled]="!newItemFormGroup.valid"
        ></app-button>
        <app-button
          matButtonType="basic"
          [buttonText]="'Cancel'"
          (clicked)="onCancel()"
        ></app-button>
      </div>

      <!-- Keyboard Shortcuts Legend -->
      <div class="mt-3 rounded-lg border border-border bg-muted px-4 py-3 shadow-xs">
        <div class="mb-2.5 flex items-center justify-center gap-1.5 text-sm font-semibold text-muted-foreground">
          <span class="text-base">⌨️</span>
          <span>{{ 'Keyboard Shortcuts' | t }}</span>
        </div>
        <div class="flex flex-wrap justify-center gap-5 max-md:gap-3">
          @for (shortcut of displayShortcuts; track shortcut.keys) {
            <div class="flex items-center gap-2 max-md:text-xs">
              <kbd class="rounded-md border border-border bg-card px-2.5 py-1 text-xs font-semibold text-primary shadow-sm transition-all duration-200 hover:-translate-y-px hover:shadow-md max-md:px-2 max-md:py-0.5 max-md:text-[0.7rem]">{{ shortcut.keys }}</kbd>
              <span class="whitespace-nowrap text-sm font-medium text-muted-foreground" [title]="shortcut.description">{{ shortcut.action }}</span>
            </div>
          }
        </div>
      </div>
    </div>
  </app-card>
</div>
