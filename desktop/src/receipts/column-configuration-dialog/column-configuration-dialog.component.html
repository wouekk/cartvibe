<app-dialog [headerText]="'Configure Table Columns' | t">
  <div class="column-config-content">
    <p class="description">
      {{ 'Select which columns to display and drag to reorder them. At least one column must remain visible.' | t }}
    </p>

    <div class="column-list" cdkDropList (cdkDropListDropped)="drop($event)">
      <div
        class="column-item"
        *ngFor="let column of columns"
        cdkDrag
        [class.disabled]="!column.visible"
      >
        <div class="drag-handle" cdkDragHandle>
          <app-icon name="drag_handle"></app-icon>
        </div>

        <label class="column-checkbox flex flex-1 cursor-pointer items-center gap-2 text-sm">
          <hlm-checkbox
            [checked]="column.visible"
            [disabled]="!canToggleOff(column)"
            (checkedChange)="toggleColumnVisibility(column)"
          />
          <span>{{ column.displayName }}</span>
        </label>

        <!--
          Outside the checkbox label on purpose: inside it, the badge would join
          the checkbox's accessible name ("Tip Custom") and every locator that
          picks a column by its field name would stop resolving.
        -->
        @if (column.isCustom) {
          <app-badge [text]="customFieldBadge" data-testid="column-config-custom"></app-badge>
        }
      </div>
    </div>
  </div>

  <app-dialog-footer
    submitButtonTooltip="Save column configuration"
    [additionalButtonsTemplate]="resetButton"
    (submitClicked)="saveConfiguration()"
    (cancelClicked)="cancel()"
  ></app-dialog-footer>
</app-dialog>

<ng-template #resetButton>
  <app-button
    data-testid="reset-columns"
    matButtonType="iconButton"
    icon="restart_alt"
    color="accent"
    [tooltip]="'Reset column configuration' | t"
    (clicked)="resetToDefaults()"
  ></app-button>
</ng-template>
