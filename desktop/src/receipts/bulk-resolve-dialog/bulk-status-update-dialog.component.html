<app-dialog [headerText]="'Bulk Status Update' | t">
  <form [formGroup]="form">
    <app-select
      [label]="'Status' | t"
      [inputFormControl]="form | formGet : 'status'"
      [options]="receiptStatusOptions"
      optionValueKey="value"
      optionDisplayKey="displayValue"
    ></app-select>
    <app-textarea
      [label]="'Comment' | t"
      [placeholder]="'e.g. Paid by card…' | t"
      [inputFormControl]="form | formGet : 'comment'"
    ></app-textarea>
    <app-dialog-footer
      (submitClicked)="submitButtonClicked()"
      (cancelClicked)="cancelButtonClicked()"
    ></app-dialog-footer>
  </form>
</app-dialog>
