<app-dialog headerText="Quick Scan" [actionsTemplate]="actionsTemplate">
  <form [formGroup]="form">
    <app-upload-image
      [multiple]="true"
      (fileLoaded)="fileLoaded($event)"
    ></app-upload-image>
    <div class="quick-scan-upload" [class.quick-scan-upload--empty]="images.length === 0" data-testid="quick-scan-upload-area">
      @if (images.length === 0) {
        <app-icon class="quick-scan-upload__icon" name="receipt_long"></app-icon>
        <strong>Add photos of your receipts</strong>
        <span class="quick-scan-upload__hint">The AI reads them for you.</span>
      }
      <app-button
        icon="upload"
        matButtonType="matRaisedButton"
        data-testid="quick-scan-upload"
        [buttonText]="images.length === 0 ? 'Upload photos' : 'Add more photos'"
        (clicked)="openImageUploadComponent()"
      ></app-button>
    </div>
    <div class="quick-scan-slides">
      <div *ngFor="let preview of images; let i = index" [class.hidden]="i !== currentlySelectedIndex">
        <div class="flex flex-col justify-center">
          <img
            class="mb-2"
            alt="quick scan image"
            [src]="preview.encodedImage || preview.url ?? ''"
          >
          @if (soleGroupId() === undefined) {
            <app-group-autocomplete
              [inputFormControl]="form | formGet : 'groupIds.' + i"
            ></app-group-autocomplete>
          }
          @if (showPaidBy(i)) {
            <app-user-autocomplete
              class="w-full"
              label="Paid By"
              [inputFormControl]="form | formGet : 'paidByUserIds.' + i"
              [groupId]="form.get('groupIds.' + i)?.value"
              [selectGroupMembersOnly]="true"
            ></app-user-autocomplete>
          }
          @if (showStatus(i)) {
            <app-status-select
              label="Status"
              [inputFormControl]="form | formGet : 'statuses.' + i"
            ></app-status-select>
          }
          @if (showCategories(i)) {
            <app-category-autocomplete
              [inputFormControl]="form | formGet : 'categories.' + i"
              [categories]="categoriesForIndex(i)"
              [creatable]="false"
            ></app-category-autocomplete>
          }
          @if (showTags(i)) {
            <app-tag-autocomplete
              [inputFormControl]="form | formGet : 'tags.' + i"
              [tags]="tagsForIndex(i)"
              [creatable]="false"
            ></app-tag-autocomplete>
          }
          @if (showComment(i)) {
            <app-textarea
              label="Comment"
              data-testid="quick-scan-comment"
              [inputFormControl]="form | formGet : 'comments.' + i"
              [additionalErrorMessages]="commentErrorMessages"
            ></app-textarea>
          }
        </div>
      </div>
    </div>

  </form>
  <app-dialog-footer
    submitButtonTooltip="Submit Scans"
    [disableWhenProgressBarIsShown]="true"
    (submitClicked)="submitButtonClicked()"
    (cancelClicked)="cancelButtonClicked()"
  ></app-dialog-footer>
</app-dialog>

<ng-template #actionsTemplate>
  <div class="flex items-center">
    <app-button
      *ngIf="images.length > 1"
      data-testid="quick-scan-nav-left"
      matButtonType="iconButton"
      icon="arrow_back"
      tooltip="Navigate left"
      color="accent"
      (clicked)="navigateImages(-1)"
    >
    </app-button>
    <app-button
      *ngIf="images.length > 1"
      data-testid="quick-scan-nav-right"
      matButtonType="iconButton"
      icon="arrow_forward"
      tooltip="Navigate right"
      color="accent"
      (clicked)="navigateImages(1)"
    >
    </app-button>
    <app-delete-button
      *ngIf="images.length > 0"
      tooltip="Remove Current Image"
      (clicked)="removeImage(currentlySelectedIndex)"
    >
    </app-delete-button>
  </div>
</ng-template>
