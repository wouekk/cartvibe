<app-dialog
  headerText="About"
>
  <div class="mb-4">
    <app-form-section
      headerText="Project"
    >
      <div class="flex flex-col m-2">
        @for (link of links; track link["url"]) {
          <span>
          {{ link.label }}: <a [href]="link.url" target="_blank">{{ link.url }}</a>
        </span>
        }
      </div>
    </app-form-section>
  </div>
  <div class="mb-4">
    <app-form-section
      headerText="Build"
    >
      <div class="flex flex-col m-2">
        <span>Version: {{ about()?.version || 'unknown' }}</span>
        @if (about()?.buildDate !== "unknown") {
          <span>Build Date: {{ (about()?.buildDate | appDate) || 'unknown' }}</span>
        } @else {
          <span>Build Date: unknown</span>
        }
      </div>
    </app-form-section>
  </div>
</app-dialog>
