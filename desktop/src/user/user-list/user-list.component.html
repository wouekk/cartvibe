<app-settings-page
  width="wide"
  title="Management"
  description="Manage user accounts and the roles assigned to them."
>
  <app-management-tabs settingsTabs></app-management-tabs>
  <div settingsActions class="contents">
    <ng-container *hasAppPermission="Permission.AppUsersDelete">
      <app-button
        *ngIf="hasSelectedUsers"
        [buttonText]="'Delete Selected' | t"
        color="warn"
        icon="delete"
        (clicked)="bulkDeleteUsers()"
      ></app-button>
    </ng-container>
    <app-add-button
      *hasAppPermission="Permission.AppUsersCreate"
      data-testid="user-add"
      [buttonText]="'Add User' | t"
      [tooltip]="'Add User' | t"
      (clicked)="openUserFormDialog()"
    ></app-add-button>
  </div>
  <app-settings-entity-list>
    <app-table
      [dataSource]="dataSource()"
      [columns]="columns"
      [displayedColumns]="displayedColumns"
      [selectionCheckboxes]="true"
      [pagination]="true"
      [length]="totalCount()"
      [page]="(page() || 1) - 1"
      [pageSize]="pageSize() || 50"
      (sorted)="sorted($event)"
      (pageChange)="pageChanged($event)"
    ></app-table>
  </app-settings-entity-list>
</app-settings-page>

<ng-template #usernameCell let-element="element">
  {{ element.username }}
</ng-template>

<ng-template #displayNameCell let-element="element">
  {{ element.displayName }}
</ng-template>

<ng-template #appRoleCell let-element="element">
  {{ element.appRoleId | roleName : roles() : PermissionScope.App }}
</ng-template>

<ng-template #createdAtCell let-element="element">
  {{ element.createdAt | appDate : "short" }}
</ng-template>

<ng-template #updatedAtCell let-element="element">
  {{ element.updatedAt | appDate : "short" }}
</ng-template>

<ng-template #actionsCell let-element="element" let-index="index">
  <div class="flex items-center">
    <app-button
      *hasAppPermission="Permission.AppUsersUpdate"
      data-testid="user-edit"
      matButtonType="iconButton"
      icon="edit"
      [tooltip]="'Edit User' | t"
      color="accent"
      (clicked)="openUserFormDialog(element)"
    ></app-button>
    <app-button
      *hasAppPermission="Permission.AppUsersUpdate"
      data-testid="user-set-password"
      matButtonType="iconButton"
      icon="password"
      [tooltip]="'Set password' | t"
      color="accent"
      (clicked)="openResetPasswordDialog(element)"
    ></app-button>
    <ng-container *hasAppPermission="Permission.AppUsersUpdate">
      <app-button
        *ngIf="element.isDummyUser"
        matButtonType="iconButton"
        icon="person"
        color="accent"
        [tooltip]="'Convert to normal user' | t"
        (clicked)="openDummyUserConversionDialog(element)"
      >
      </app-button>
    </ng-container>
    <ng-container *hasAppPermission="Permission.AppUsersDelete">
      <app-delete-button
        *ngIf="userId() !== element.id.toString()"
        data-testid="user-delete"
        (clicked)="deleteUser(index)"
      ></app-delete-button>
    </ng-container>
  </div>
</ng-template>
