<app-settings-page
  width="wide"
  title="Management"
  description="Manage user accounts and the roles assigned to them."
>
  <app-management-tabs settingsTabs></app-management-tabs>
  <div settingsActions class="contents">
    <ng-container *hasAppPermission="Permission.AppUsersDelete">
      <button
        *ngIf="hasSelectedUsers"
        hlmBtn
        type="button"
        variant="destructive"
        (click)="bulkDeleteUsers()"
      >
        <app-icon name="delete"></app-icon>
        <span class="font-medium">{{ 'Delete Selected' | t }}</span>
      </button>
    </ng-container>
    <app-add-button
      *hasAppPermission="Permission.AppUsersCreate"
      data-testid="user-add"
      [buttonText]="'Add User' | t"
      [tooltip]="'Add User' | t"
      (clicked)="openUserFormDialog()"
    ></app-add-button>
  </div>
  <app-settings-entity-list>
    <app-table
      [dataSource]="dataSource()"
      [columns]="columns"
      [displayedColumns]="displayedColumns"
      [selectionCheckboxes]="true"
      [pagination]="true"
      [length]="totalCount()"
      [page]="(page() || 1) - 1"
      [pageSize]="pageSize() || 50"
      [emptyText]="loaded() ? emptyText : ''"
      (sorted)="sorted($event)"
      (pageChange)="pageChanged($event)"
    ></app-table>
  </app-settings-entity-list>
</app-settings-page>

<ng-template #usernameCell let-element="element">
  {{ element.username }}
</ng-template>

<ng-template #displayNameCell let-element="element">
  {{ element.displayName }}
</ng-template>

<ng-template #appRoleCell let-element="element">
  {{ element.appRoleId | roleName : roles() : PermissionScope.App }}
</ng-template>

<ng-template #createdAtCell let-element="element">
  {{ element.createdAt | appDate : "short" }}
</ng-template>

<ng-template #updatedAtCell let-element="element">
  {{ element.updatedAt | appDate : "short" }}
</ng-template>

<ng-template #actionsCell let-element="element" let-index="index">
  <app-row-actions
    menuTestId="user-menu"
    [menuLabel]="'User actions' | t"
    [actions]="rowActions"
    [row]="element"
    (run)="rowAction($event, element, index)"
  ></app-row-actions>
</ng-template>
