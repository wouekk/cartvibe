<app-dialog [headerText]="'Convert {name} to a normal user' | t: { name: user.displayName }">
  <form (ngSubmit)="submitButtonClicked()">
    <app-input
      [label]="'Password' | t"
      type="password"
      [inputFormControl]="form | formGet : 'password'"
      [showGeneratePassword]="true"
      [showVisibilityEye]="true"
    ></app-input>
  </form>
  <app-dialog-footer
    (submitClicked)="submitButtonClicked()"
    (cancelClicked)="cancelButtonClicked()"
  ></app-dialog-footer>
</app-dialog>
