<div class="p-6">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <h2 class="mt-0">{{ 'Set Password for {name}' | t: { name: user.displayName } }}</h2>
    <app-input
      [label]="'Password' | t"
      type="password"
      [inputFormControl]="form | formGet : 'password'"
      [showGeneratePassword]="true"
      [showVisibilityEye]="true"
    ></app-input>
    <div class="flex items-center justify-end gap-2">
      <app-cancel-button (clicked)="closeModal()"></app-cancel-button>
      <app-submit-button></app-submit-button>
    </div>
  </form>
</div>
