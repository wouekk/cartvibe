<div class="p-6">
  <h2 class="mt-0">
    {{ user ? "Edit " + user.displayName : "Create User" }}
  </h2>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <app-form-section [headerText]="'User Details' | t">
      <app-input
        [label]="'Username' | t"
        [inputFormControl]="form | formGet : 'username'"
      ></app-input>
      <app-input
        [label]="'Display Name' | t"
        [inputFormControl]="form | formGet : 'displayName'"
      ></app-input>
      <app-input
        *ngIf="!user"
        [label]="'Password' | t"
        type="password"
        [inputFormControl]="form | formGet : 'password'"
        [showGeneratePassword]="true"
        [showVisibilityEye]="true"
      ></app-input>
      <div class="flex items-center">
        <app-select
          class="grow"
          [label]="'Role' | t"
          optionValueKey="id"
          optionDisplayKey="name"
          [inputFormControl]="form | formGet : 'appRoleId'"
          [options]="appRoleOptions()"
        ></app-select>
        <button
          hlmBtn
          type="button"
          variant="ghost"
          size="icon"
          class="ms-1"
          data-testid="role-preview"
          [disabled]="!selectedRole()"
          [hlmTooltip]="'Preview role' | t"
          (click)="previewRole()"
        >
          <app-icon name="visibility"></app-icon>
        </button>
      </div>
      <app-checkbox
        [label]="'Is Dummy User?' | t"
        [helpText]="isDummerUserHelpText"
        [inputFormControl]="form | formGet : 'isDummyUser'"
      ></app-checkbox>
    </app-form-section>

    <div class="flex items-center justify-end gap-2">
      <app-cancel-button (clicked)="closeModal()"></app-cancel-button>
      <app-submit-button [mode]="submitMode"></app-submit-button>
    </div>
  </form>
</div>
