<app-select
  [label]="'Provider' | t"
  optionValueKey="value"
  optionDisplayKey="displayValue"
  [attr.data-testid]="testId('provider')"
  [options]="providers()"
  [inputFormControl]="controls().aiType"
></app-select>

@if (isOllama()) {
  <app-input
    [label]="'Server URL' | t"
    [attr.data-testid]="testId('url')"
    placeholder="http://192.168.1.20:11434"
    hint="Ollama's address as the NAS reaches it. The server alone is enough."
    [inputFormControl]="controls().url"
  ></app-input>
} @else if (isLocal()) {
  <app-input
    [label]="'Server URL' | t"
    [attr.data-testid]="testId('url')"
    placeholder="http://192.168.1.20:1234/v1"
    hint="LM Studio's address as the NAS reaches it, ending in /v1"
    [inputFormControl]="controls().url"
  ></app-input>
}

<app-input
  type="password"
  [attr.data-testid]="testId('key')"
  [label]="isCloud() ? 'API key' : 'API key (optional)'"
  [placeholder]="keyPlaceholder()"
  [showVisibilityEye]="true"
  [inputFormControl]="controls().key"
></app-input>

@if (isCloud()) {
  <app-ai-model-field
    [testId]="testId('model')"
    [aiType]="currentAiType()"
    [modelControl]="controls().model"
    [keyControl]="controls().key"
    [settingsId]="modelSettingsId()"
  ></app-ai-model-field>
} @else {
  <app-input
    [label]="'Model' | t"
    [attr.data-testid]="testId('model')"
    [hint]="isOllama() ? 'The model name as Ollama lists it' : 'The model name as LM Studio lists it'"
    [inputFormControl]="controls().model"
  ></app-input>
}

@if (isOllama()) {
  <app-input
    type="number"
    [label]="'Context size (optional)' | t"
    [attr.data-testid]="testId('context-size')"
    placeholder="8192"
    hint="How many tokens of a receipt the model keeps. Left empty, Ollama keeps a few thousand and reads a long receipt only in part; 8192 fits most receipts."
    [inputFormControl]="controls().contextSize"
  ></app-input>
}

@if (isLocal()) {
  <app-checkbox
    [label]="'The model reads images (a vision model)' | t"
    [attr.data-testid]="testId('vision')"
    [inputFormControl]="controls().isVisionModel"
  ></app-checkbox>
}
