<app-settings-page title="AI" description="The AI reads receipts and their products, and tags food as healthy or not. Without it everything still works; receipts just wait until it is back.">
  @if (loading()) {
    <p class="text-muted-foreground">{{ 'Loading…' | t }}</p>
  } @else {
    <form class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="save()">
     <app-settings-section testId="ai-card-main" title="Main AI">
      <div class="cv-section" data-testid="ai-section-main">
        <div class="cv-section__head">
          <h3 class="cv-section__title">{{ 'Provider' | t }}</h3>
          <p class="cv-section__desc">{{ 'Where receipts are read. Claude, Gemini and ChatGPT run in the cloud; a local LM runs on a computer at home.' | t }}</p>
        </div>
      <app-ai-provider-fields testIdPrefix="ai" [controls]="form.controls" [saved]="saved()"></app-ai-provider-fields>
      </div>

      @if (connectionResult(); as result) {
        <p
          class="mx-6 mb-4 flex items-start gap-1 break-words rounded-lg px-4 py-2"
          role="status"
          data-testid="ai-test-result"
          [class]="result.ok ? 'bg-success-text/15 text-success-text' : 'bg-destructive/15 text-destructive'"
        >
          <app-icon [name]="result.ok ? 'check_circle' : 'error'"></app-icon>
          {{ result.message | t: result.params }}
        </p>
      }
      <div sectionFooter class="cv-card__footer">
        <button
          hlmBtn
          type="button"
          data-testid="ai-test"
          [disabled]="!canTest() || testing()"
          (click)="testConnection()"
        >
          <app-icon name="wifi_tethering"></app-icon>
          {{ (testing() ? 'Testing…' : 'Test connection') | t }}
        </button>
        <button hlmBtn color="primary" type="submit" data-testid="ai-save" [disabled]="saving()">
          {{ 'Save changes' | t }}
        </button>
      </div>
     </app-settings-section>
    </form>

    <app-ai-fallback-card [primaryId]="saved()?.id"></app-ai-fallback-card>
  }
</app-settings-page>
