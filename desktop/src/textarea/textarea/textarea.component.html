<div class="flex w-full flex-col gap-1.5">
  @if (label) {
    <label class="text-sm font-medium leading-none text-foreground" for="textarea">{{ label | t }}</label>
  }
  <textarea
    #nativeTextarea
    hlmTextarea
    cdkTextareaAutosize
    id="textarea"
    [placeholder]="(placeholder ?? '') | t"
    [readonly]="readonly"
    [formControl]="inputFormControl"
  ></textarea>
  @if (hint) {
    <p class="text-xs text-muted-foreground">{{ hint | t }}</p>
  }
  @if (inputFormControl.invalid && (inputFormControl.touched || inputFormControl.dirty)) {
    @for (err of formControlErrors | async; track err.error) {
      <p class="text-xs text-destructive" role="alert">{{ errorText(err) }}</p>
    }
  }
</div>
