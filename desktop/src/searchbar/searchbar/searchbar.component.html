<hlm-autocomplete
  class="w-full"
  [search]="searchFormControl.value ?? ''"
  [itemToString]="displayWith"
  (searchChange)="searchFormControl.setValue($event)"
  (valueChange)="$event && navigateToResult($event)"
>
  <hlm-autocomplete-input class="w-full" placeholder="Search receipts" />
  <hlm-autocomplete-content *hlmAutocompletePortal>
    <hlm-autocomplete-empty>No receipts found.</hlm-autocomplete-empty>
    <div hlmAutocompleteList>
      @for (result of results(); track result.id) {
        <hlm-autocomplete-item [value]="result">{{ result | searchResult }}</hlm-autocomplete-item>
      }
    </div>
  </hlm-autocomplete-content>
</hlm-autocomplete>
