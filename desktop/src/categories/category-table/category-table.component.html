<app-table-header
  [headerText]="headerText"
  subtitle="The categories the AI sorts receipt products into. New ones appear here by themselves; rename one to change what the AI uses, or switch one off."
>
  <app-add-button
    *hasAppPermission="Permission.AppCategoriesCreate"
    data-testid="category-add"
    [buttonText]="'Add Category' | t"
    [tooltip]="'Add Category' | t"
    (clicked)="openAddDialog()"
  >
  </app-add-button>
</app-table-header>
<div class="table-container">
  <app-table
    [columns]="columns"
    [displayedColumns]="displayedColumns"
    [dataSource]="dataSource()"
    [pagination]="true"
    [length]="totalCount()"
    [pageSize]="state()?.pageSize ?? 1"
    [page]="(state()?.page ?? 1) - 1"
    (sorted)="sorted($event)"
    (pageChange)="updatePageData($event)"
  ></app-table>
</div>

<ng-template #nameCell let-element="element">
  {{ element.name }}
  @if (element.skipped) {
    <span class="ms-2 inline-flex items-center rounded-md bg-secondary px-2 py-0.5 text-xs font-medium text-secondary-foreground" data-testid="category-skipped-badge">{{ 'AI skips' | t }}</span>
  }
  @if (element.aliases) {
<span class="text-muted-foreground text-sm block" style="white-space: pre-line">{{ 'Formerly:' | t }} {{ element.aliases }}</span>
  }
</ng-template>

<ng-template #descriptionCell let-element="element"
>{{ element.description }}
</ng-template>

<ng-template #numberOfReceiptsCell let-element="element"
>{{ element.numberOfProducts }}
</ng-template>

<ng-template #actionsCell let-element="element" let-index="index">
  <app-edit-button
    *hasAppPermission="Permission.AppCategoriesUpdate"
    data-testid="category-edit"
    color="accent"
    (clicked)="openEditDialog(element)"
  ></app-edit-button>
  <app-delete-button
    *hasAppPermission="Permission.AppCategoriesDelete"
    data-testid="category-delete"
    (clicked)="openDeleteConfirmationDialog(element)"
  ></app-delete-button>
</ng-template>
