          description: Default avatar color
          default: ""
        username:
          type: string
          description: User's username used to login
          default: ""
        iss:
          type: string
          description: Issuer
          default: ""
        sub:
          type: string
          description: Subject
          default: ""
        aud:
          type: array
          items:
            type: string
          description: Audience
          default: [ ]
        exp:
          type: integer
          description: Expiration time
          default: 0
        nbf:
          type: integer
          description: Not before
          default: 0
        iat:
          type: integer
          description: Issued at
          default: 0
        jti:
          type: string
          description: JWT ID
          default: ""
    LogoutCommand:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: Refresh token

    UpsertReceiptCommand:
      type: object
      required:
        - name
