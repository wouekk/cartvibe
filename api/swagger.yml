  /oidc/{name}/login:
    get:
      tags:
        - Oidc
      summary: Start an OIDC login
      description:
        Redirects the user agent to the configured identity provider. The API acts as
        the relying party, so the whole exchange (PKCE, state, nonce, code exchange,
        ID token verification) happens server-side and no client ever handles an
        identity provider token. Navigate to this URL; do not fetch it.
      operationId: oidcLogin
      parameters:
        - name: name
          in: path
          description: The provider's slug
          required: true
          schema:
            type: string
      responses:
        302:
          description: Redirect to the identity provider, or back to the client on error
      security: []
  /oidc/{name}/callback:
    get:
      tags:
        - Oidc
      summary: OIDC redirect URI
      description:
        Where the identity provider returns the user. This is the exact URL that must
        be registered with the provider. Not called by clients directly.
      operationId: oidcCallback
      parameters:
        - name: name
          in: path
          description: The provider's slug
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
      responses:
        302:
          description: Redirect back to the client, signed in or carrying an error code
      security: []
  /oidc/link/{name}:
    get:
      tags:
        - Oidc
      summary: Connect a provider to the signed-in account
      description:
        Starts the same flow as a login, but the session proves who the caller is, so
        the callback links the identity directly instead of matching or provisioning.
        Requires app.account.update, the same permission as disconnecting one.


        A browser navigates to this URL and is redirected (302) to the identity
        provider; a failure redirects back to the profile page with ?oidcError={code}.
      operationId: oidcLinkStart
      parameters:
        - name: name
          in: path
          description: The provider's slug
          required: true
          schema:
            type: string
      responses:
        302:
          description: Redirect to the identity provider, for a browser
      security:
        - bearerAuth: [ ]
  /oidc/connections:
    get:
      tags:
        - Oidc
      summary: List the caller's connected accounts
      operationId: getOidcConnections
      responses:
        200:
          description: The caller's linked identity providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OidcConnectionView"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /oidc/connections/{name}:
    delete:
      tags:
        - Oidc
      summary: Disconnect a provider from the caller's account
      description:
        Refused when it is the caller's last connection and the account was created by
        that provider, because such an account has no password to fall back on.
      operationId: deleteOidcConnection
      parameters:
        - name: name
          in: path
          description: The provider's slug
          required: true
          schema:
            type: string
      responses:
        200:
          $ref: "#/components/responses/Ok"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /oidc/connections/{name}/delete-confirmation:
    get:
      tags:
        - Oidc
      summary: Confirm deleting the signed-in account by signing in at a linked provider
      description:
        For an account with no password of its own - one created by signing in with an
        identity provider. Such an account cannot confirm a self-delete with a password,
        so it signs in at one of its linked providers again instead, and the callback
        hands back a single-use confirmationCode for POST /user/deleteAccount.
        Requires app.account.delete. An
        account with a password of its own is refused; it confirms with that password.


        The provider is asked for a fresh sign-in with max_age=0. When it returns
        auth_time, a sign-in older than this flow is refused (stale_login). Signing in
        as any identity other than the account's own at this provider is refused
        (identity_mismatch).


        A browser navigates here and is redirected (302) to the identity provider; the
        callback returns to the profile page with ?deleteConfirmation={code} or
        ?deleteError={code}.
      operationId: oidcDeleteConfirmationStart
      parameters:
        - name: name
          in: path
          description: The slug of a provider linked to the account
          required: true
          schema:
            type: string
      responses:
        302:
          description: Redirect to the identity provider, for a browser
      security:
        - bearerAuth: [ ]
  /oidcProvider/:
