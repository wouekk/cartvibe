        - groupId
        - paidByUserId
        - status
      properties:
        name:
          type: string
          description: Receipt name
        shopName:
          type: string
          description: >-
            The shop printed on the receipt (Auchan, Edeka, Rewe), read by the AI or typed by a person.
            Empty when unknown.
        amount:
          type: string
          description: Receipt total amount
        date:
          type: string
          description: Receipt date
        groupId:
          type: integer
          description: Group foreign key
        paidByUserId:
          type: integer
          description: User paid foreign key
        status:
          $ref: "#/components/schemas/ReceiptStatus"
        categories:
          type: array
          description: Categories associated to receipt
          items:
            $ref: "#/components/schemas/UpsertCategoryCommand"
        tags:
          type: array
          description: Tags associated to receipt
          items:
            $ref: "#/components/schemas/UpsertTagCommand"
        note:
          type: string
          nullable: true
          maxLength: 10000
