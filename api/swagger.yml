openapi: 3.1.0
info:
  title: CartVibe API.
  termsOfService:
    there are no TOS at this moment, use at your own risk we take no
    responsibility
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.en.html
  # Not a version of its own: the contract ships with the app, whose one version is the release tag (GET /about
  # answers it). Kept at 0.0.0 so it cannot drift from the tag (desktop/tools/check-traps.cjs).
  version: 0.0.0
servers:
  - url: /api
security:
  - bearerAuth: [ ]
paths:
  /report/generate:
    post:
      tags:
        - Report
      summary: Generate a report
      description:
        Generates a report over the receipts of one or more groups and streams it
        back as a file, or a zip when several formats are requested. Runs under the
        caller's group permissions and requires group.reports.read in every covered
        group.
      operationId: generateReport
      requestBody:
        description: The report builder configuration
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequestCommand"
      responses:
        200:
          description: The generated report file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /report/preview:
    post:
      tags:
        - Report
      summary: Preview a report
      description:
        Renders the current report configuration as HTML for the builder's live
        preview, along with the number of receipts it covers. Requires the
        app-level app.reports.read (or app.reports.readAll) and group.reports.read
        in every covered group. The preview is a row-capped sample of the engine's
        own output.
      operationId: previewReport
      requestBody:
        description: The report builder configuration
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequestCommand"
      responses:
        200:
          description: The rendered preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportPreviewResponse"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /report/receipts:
    post:
      tags:
        - Report
      summary: List the receipts a report covers
      description:
        Lists the receipts the report configuration covers, newest first, for
        the builder's drill-in. The period and filter resolve exactly as they do
        for the report, so the list agrees with the preview's receipt count.
        Capped at 100 receipts; totalCount is every covered receipt. Requires the
        same permissions as the preview.
      operationId: getReportReceipts
      requestBody:
        description: The report builder configuration
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequestCommand"
      responses:
        200:
          description: The covered receipts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedData"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /report/template:
    post:
      tags:
        - Report
      summary: Save a report template
      description:
        Saves the current report configuration as a reusable template. App-scoped
        (requires app.reports.create) — it persists a configuration and touches no
        group's receipts.
      operationId: createReportTemplate
      requestBody:
        description: The report builder configuration to save
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequestCommand"
      responses:
        200:
          description: The saved report template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportTemplate"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /report/template/list:
    post:
      tags:
        - Report
      summary: Get paged report templates
      description:
        Returns a paged, sorted list of saved report templates. App-scoped
        (requires app.reports.read).
      operationId: getReportTemplates
      requestBody:
        description: Paging and sorting data
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PagedRequestCommand"
      responses:
        200:
          description: Paged report templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedData"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /report/template/{id}:
    get:
      tags:
        - Report
      summary: Get a report template
      description:
        Returns a saved report template by id. Access is resolved per template
        (readAll, or read plus group.reports.read in every household it covers).
      operationId: getReportTemplate
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Id of the report template to get
      responses:
        200:
          description: The report template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportTemplate"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
    put:
      tags:
        - Report
      summary: Update a report template
      description:
        Updates a saved report template in place, replacing its name and stored
        configuration. App-scoped (requires app.reports.update).
      operationId: updateReportTemplate
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Id of the report template to update
      requestBody:
        description: The report builder configuration to save over the existing template
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportRequestCommand"
      responses:
        200:
          description: The updated report template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportTemplate"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
    delete:
      tags:
        - Report
      summary: Delete a report template
      description: Deletes a saved report template by id. Requires app.reports.delete.
      operationId: deleteReportTemplate
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Id of the report template to delete
      responses:
        200:
          $ref: "#/components/responses/Ok"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /report/template/{id}/duplicate:
    post:
      tags:
        - Report
      summary: Duplicate a report template
      description:
        Duplicates a saved report template by id, returning the new copy. App-scoped
        (requires app.reports.duplicate).
      operationId: duplicateReportTemplate
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Id of the report template to duplicate
      responses:
        200:
          description: The duplicated report template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportTemplate"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /report/template/{id}/generate:
    post:
      tags:
        - Report
      summary: Generate a report from a saved template
      description:
        Generates a saved report template by id and streams the file. Access is resolved
        per template (generateAll, or generate plus group.reports.read in every household
        it covers), and the stored configuration is loaded server-side.
      operationId: generateReportFromTemplate
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Id of the report template to generate
      responses:
        200:
          description: The generated report file (or a zip of several formats)
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        404:
          $ref: "#/components/responses/NotFound"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /category/{categoryName}:
    parameters:
      - in: path
        name: categoryName
        schema:
          type: string
        required: true
        description: Category name to get count of
    get:
      tags:
        - Category
      summary: Get category count by name
      description: This will return a count of categories with the same name
      operationId: getCategoryCountByName
      responses:
        200:
          description: The number of categories with the same name
          content:
            text/plain:
              schema:
                type: integer
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /category/getPagedCategories:
    post:
      tags:
        - Category
      summary: Get paged categories
      description: This will return paged categories
      operationId: getPagedCategories
      requestBody:
        description: Paging and sorting data
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PagedRequestCommand"
      responses:
        200:
          description: Paged categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedData"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /category/:
    get:
      tags:
        - Category
      summary: Get all categories
      description: This will return all categories in the system
      operationId: getAllCategories
      responses:
        200:
          description: All categories in the system
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
    post:
      tags:
        - Category
      summary: Create category
      description: This will create a category
      operationId: createCategory
      requestBody:
        description: Category to create
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Category"
      responses:
        200:
          description: The created category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /category/{categoryId}:
    parameters:
      - in: path
        name: categoryId
        schema:
          type: integer
        required: true
        description: Category Id to get
    put:
      tags:
        - Category
      summary: Update category
      description: This will update a category
      operationId: updateCategory
      requestBody:
        description: Category to update
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Category"
      responses:
        200:
          $ref: "#/components/responses/Ok"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
    delete:
      tags:
        - Category
      summary: Delete category
      description: This will delete a category by id
      operationId: deleteCategory
      responses:
        200:
          $ref: "#/components/responses/Ok"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /backup/summary:
    get:
      tags:
        - Backup
      summary: What a household export would hold
      description: Row counts per export file and the bytes of the photos and PDFs. Admin only (app.backup.export).
      operationId: getBackupSummary
      responses:
        200:
          description: The summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupSummary"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /backup/export:
    get:
      tags:
        - Backup
      summary: Export the whole household
      description:
        Streams a ZIP with manifest.json, one CSV per entity and, with includeFiles, the receipt photos and PDFs.
        No secrets are included. Admin only (app.backup.export), because it holds every household and person of the install.
      operationId: exportBackup
      parameters:
        - in: query
          name: includeFiles
          required: false
          description: Include the receipt photos, PDFs and shopping-trip photos (default false)
          schema:
            type: boolean
      responses:
        200:
          description: The ZIP stream
          content:
            application/zip:
              schema:
                type: string
                format: binary
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /backup/import:
    get:
      tags:
        - Backup
      summary: The latest household imports
      description: The newest five imports, newest first. Admin only (app.backup.import).
      operationId: getBackupImports
      responses:
        200:
          description: The imports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BackupImportJob"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
    post:
      tags:
        - Backup
      summary: Upload a household export and preview the import
      description:
        Streams the ZIP to the server (up to 4 GB), checks it against its manifest and answers what the import would
        do. Nothing is written to the household. A file that is not an export, is damaged or comes from a newer
        CartVibe answers 400. Admin only (app.backup.import).
      operationId: previewBackupImport
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/BackupImportUploadCommand"
      responses:
        200:
          description: What the import would do
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupImportPreview"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /backup/import/{jobId}:
    parameters:
      - in: path
        name: jobId
        required: true
        schema:
          type: integer
    get:
      tags:
        - Backup
      summary: One household import, with its progress
      operationId: getBackupImport
      responses:
        200:
          description: The import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupImportJob"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
    delete:
      tags:
        - Backup
      summary: Drop a previewed import and its file
      operationId: deleteBackupImport
      responses:
        200:
          $ref: "#/components/responses/Ok"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /backup/import/{jobId}/start:
    parameters:
      - in: path
        name: jobId
        required: true
        schema:
          type: integer
    post:
      tags:
        - Backup
      summary: Start a previewed import
      description:
        Queues the import. It runs once in the background, into an empty household only; a failure changes nothing.
      operationId: startBackupImport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupImportStartCommand"
      responses:
        202:
          description: The queued import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupImportJob"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /export/{groupId}:
    post:
      tags:
        - Export
      summary: Exports receipts
      description:
        This will export all receipts that belong to a group based on a filter [SYSTEM
        USER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptPagedRequestCommand"
      parameters:
        - in: query
          name: format
          schema:
            $ref: "#/components/schemas/ExportFormat"
          required: true
        - in: path
          name: groupId
          schema:
            type: integer
          required: true
          description: Get all receipts that belong to groupId
      operationId: exportReceiptsForGroup
      responses:
        200:
          description: The csv stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /export:
    post:
      tags:
        - Export
      summary: Exports receipts
      description:
        This will export individual receipts [SYSTEM USER]
      parameters:
        - in: query
          name: format
          schema:
            $ref: "#/components/schemas/ExportFormat"
          required: true
        - in: query
          name: receiptIds
          schema:
            type: array
            items:
              type: integer
      operationId: exportReceiptsById
      responses:
        200:
          description: The csv stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /cspReport:
    post:
      tags:
        - FeatureConfig
      summary: Receive a Content-Security-Policy report
      description:
        Sent by the browser on its own when a page breaks the Content-Security-Policy (the policy's report-uri).
        Each new violation is written to the log once an hour; nothing is stored. No sign-in is needed, and the
        answer is always 204. The web app never calls it.
      operationId: receiveCspReport
      requestBody:
        required: false
        content:
          application/csp-report:
            schema:
              type: object
      responses:
        204:
          description: The report was read (or ignored)
      security: []
  /clientReport:
    post:
      tags:
        - ClientReport
      summary: Tell the server what went wrong in the browser
      description:
        The web app reports a failure the server could not have seen (a phone that closed the page while its camera
        was open, a file the app left out of a Quick Scan), and the server writes one line to its log. Needs
        sign-in and nothing else. Nothing is stored, the same report from one person is logged once in ten minutes,
        and the answer is always 204, also for a report that was ignored.
      operationId: sendClientReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientReportCommand"
      responses:
        204:
          description: The report was read (or ignored)
        403:
          $ref: "#/components/responses/Forbidden"
  /featureConfig:
    get:
      tags:
        - FeatureConfig
      summary: Get feature config
      description: This will get the server's feature config
      operationId: getFeatureConfig
      responses:
        200:
          description: The feature config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureConfig"
        500:
          $ref: "#/components/responses/Internal"
      security: []
  /group:
    get:
      tags:
        - Groups
      summary: Get groups for user
      description: This will get groups for the currently logged in user
      operationId: getGroupsForuser
      responses:
        200:
          description: The groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
    post:
      tags:
        - Groups
      summary: Create group
      description: This will create a group
      requestBody:
        description: Group to create
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertGroupCommand"
      operationId: createGroup
      responses:
        200:
          $ref: "#/components/responses/Ok"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /group/{groupId}:
    parameters:
      - in: path
        name: groupId
        schema:
          type: integer
        required: true
        description: Group Id to get
    get:
      tags:
        - Groups
      summary: Gets a group by Id
      description: This will get a group by Id
      operationId: getGroupById
      responses:
        200:
          $ref: "#/components/responses/Ok"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
    put:
      tags:
        - Groups
      summary: Update a group
      description: This will update a group
      requestBody:
        description: Group to update
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Group"
      operationId: updateGroup
      responses:
        200:
          $ref: "#/components/responses/Ok"
        400:
          $ref: "#/components/responses/BadRequest"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
    delete:
      tags:
        - Groups
      summary: Delete group
      description: This will delete a group by id
      operationId: deleteGroup
      responses:
        200:
          $ref: "#/components/responses/Ok"
        400:
          $ref: "#/components/responses/BadRequest"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /group/{groupId}/groupReceiptSettings:
    put:
      tags:
        - Groups
      summary: Update group receipt settings
      description: This will update the group receipt settings for a group
      operationId: updateGroupReceiptSettings
      parameters:
        - in: path
          name: groupId
          schema:
            type: integer
          required: true
          description: Group Id to update
      requestBody:
        description: Group settings to update
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGroupReceiptSettingsCommand"
      responses:
        200:
          description: The updated group receipt settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupReceiptSettings"
        400:
          $ref: "#/components/responses/BadRequest"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /group/getPagedGroups:
    post:
      tags:
        - Groups
      summary: Get paged groups
      description: This will return paged groups
      operationId: getPagedGroups
      requestBody:
        description: Paging and sorting data
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PagedGroupRequestCommand"
      responses:
        200:
          description: Paged groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedData"
        500:
          $ref: "#/components/responses/Internal"
        400:
          $ref: "#/components/responses/BadRequest"
      security:
        - bearerAuth: [ ]

  /login/:
    post:
      tags:
        - Auth
      summary: Login
      description: This will log a user into the system
      parameters:
        - name: tokensInBody
          in: query
          description: When true, tokens are returned in the response body only without setting cookies
          required: false
          schema:
            type: boolean
            default: false
      requestBody:
