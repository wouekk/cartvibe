        - "group.shopping-lists.read"
        - "group.shopping-lists.update"
        - "group.shopping-lists.delete"
    ShoppingList:
      type: object
      required:
        - id
        - groupId
        - name
        - items
      properties:
        id:
          type: integer
          format: uint64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: integer
          format: uint64
          nullable: true
        groupId:
          type: integer
          format: uint64
          description: Group the list belongs to
        name:
          type: string
          description: List name, e.g. Supermarket
        items:
          type: array
          description: The list's items, ordered by creation. Always an array, never null.
          items:
            $ref: "#/components/schemas/ShoppingListItem"
    ShoppingListItem:
      type: object
      required:
        - health
        - foodGroup
        - seasonality
        - classificationOverridden
        - id
        - shoppingListId
        - name
        - unit
        - quantity
        - note
        - isChecked
      properties:
        id:
          type: integer
          format: uint64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: integer
          format: uint64
          nullable: true
        shoppingListId:
          type: integer
          format: uint64
          description: List the item belongs to
        clientId:
          type: string
          description: >-
            The key the adding client made up for this item (see UpsertShoppingListItemCommand); absent on
            items added without one
        name:
          type: string
        amount:
          type: string
          nullable: true
          description: How much to buy, as a decimal string (e.g. "1.5"); null when not given
        unit:
          type: string
          description: >-
            Unit of the amount: one of pcs, kg, g, l, ml, pack, bottle, can, box, bag, jar, bunch, dozen;
            empty when there is no amount or it is a plain count. A plain string, never an enum, so a
            unit added later cannot break an older client.
        quantity:
          type: string
          description: >-
            The original free-text quantity, kept for items written before amount and unit existed.
            Superseded by amount and unit; empty when not set.
        note:
          type: string
          description: Empty when not set
        isChecked:
          type: boolean
          description: Whether the item is crossed off
        checkedAt:
          type: string
          format: date-time
          nullable: true
          description: When the item was crossed off; null while it is on the list
        checkedByUserId:
          type: integer
          format: uint64
          nullable: true
          description: Who crossed the item off; null while it is on the list
        health:
          type: string
          description: >-
            HEALTHY, MEDIUM, UNHEALTHY, NOT_FOOD, UNKNOWN, or empty while not yet classified. A plain
            string, never an enum, so a new rating cannot break an older client.
        foodGroup:
          type: string
          description: A short lowercase food group, e.g. "fresh produce"; empty while not yet classified
        seasonality:
          type: string
          description: >-
            For fresh fruit and vegetables, SEASONAL or OUT_OF_SEASON in Western Europe in the month
            bought; NOT_PRODUCE otherwise; empty while not yet classified. A plain string.
        classifiedAt:
          type: string
          format: date-time
          nullable: true
          description: When the tags were set; null while waiting to be classified
        classificationOverridden:
          type: boolean
          description: The tags were corrected by a person
    UpsertShoppingListCommand:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 100
    UpsertShoppingListItemCommand:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 200
        amount:
          type: string
          nullable: true
          description: How much to buy, as a decimal string; greater than 0, below 100000, at most 3 decimals
        unit:
          type: string
          description: One of the ShoppingListItem units; requires an amount
        quantity:
          type: string
          maxLength: 50
        note:
          type: string
          maxLength: 500
        clientId:
          type: string
          maxLength: 64
          description: >-
            A key the client makes up for a new item (a UUID; letters, digits, "-" and "_"), unique within
            the list. Sending the same add again with the same key answers with the item the first one made,
            as it is now, instead of adding a second line. Read by an add only.
    PreviewShoppingListRecipeCommand:
      type: object
      description: Exactly one of url and text.
      properties:
        url:
          type: string
          maxLength: 2048
          description: An http or https page carrying a recipe
        text:
          type: string
          description: Pasted ingredient lines, at most 200 KB
    RecipePreview:
      type: object
      required:
        - title
        - sourceUrl
        - servings
        - source
        - failureReason
        - items
      properties:
        title:
          type: string
          description: The recipe's name when the page gave one
        sourceUrl:
          type: string
          description: The page that was read, after redirects; empty for pasted text
        servings:
          type: integer
          nullable: true
          description: The first whole number from 1 to 100 in the page's recipeYield, when there is one
        source:
          type: string
          description: Where the rows came from (jsonld, microdata or text); empty when nothing was read
        failureReason:
          type: string
          description: >-
            Empty when items can be shown. Otherwise why not, for example blocked, timeout, unreachable,
            not_found, not_html, too_large, invalid_url, no_recipe, no_ingredients or busy. Open string.
        items:
          type: array
          items:
            $ref: "#/components/schemas/RecipePreviewItem"
    RecipePreviewItem:
      type: object
      required:
        - name
        - quantity
        - unit
        - original
      properties:
        name:
          type: string
          description: The ingredient in the recipe's own language
        quantity:
          type: string
          nullable: true
          description: A decimal string; null when the line gave none ("salt to taste")
        unit:
          type: string
          description: The unit as the recipe wrote it; open string, empty for none
        original:
          type: string
          description: The cleaned source line
    ImportShoppingListRecipeCommand:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/ImportShoppingListRecipeItem"
    ImportShoppingListRecipeItem:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 200
        amount:
          type: string
          nullable: true
          description: Already scaled, as a decimal string; greater than 0, below 100000, at most 3 decimals
        unit:
          type: string
          maxLength: 50
          description: The recipe's own word for the unit; open string, not limited to the item units
    ImportShoppingListRecipeResult:
      type: object
      required:
        - list
        - added
        - merged
        - revived
      properties:
        list:
          $ref: "#/components/schemas/ShoppingList"
        added:
          type: integer
          description: Rows inserted as new items
        merged:
          type: integer
          description: Existing unchecked items that took a quantity (or already had the item)
        revived:
          type: integer
          description: Crossed-off items that were put back on the list
    SetShoppingListItemCheckedCommand:
      type: object
      required:
        - isChecked
      properties:
        isChecked:
          type: boolean
          description: The target state. Setting the state an item is already in changes nothing.
    SetShoppingListCheckedCommand:
      type: object
      required:
        - isChecked
      properties:
        isChecked:
          type: boolean
          description: The target state for the items.
        itemIds:
          type: array
          description: Only these items of the list; omitted means every item. Ids of other lists' items are ignored.
          items:
            type: integer
    ShoppingListEvent:
      type: object
      description: >-
        One shopping list mutation, as sent on the group's event stream. It carries the full changed
        entity, so applying it is an idempotent upsert or remove by id.
      required:
        - type
        - groupId
        - shoppingListId
      properties:
        type:
          type: string
          description: >-
            One of LIST_CREATED, LIST_UPDATED, LIST_DELETED, ITEM_ADDED, ITEM_UPDATED, ITEM_TOGGLED,
            ITEM_DELETED, CHECKED_CLEARED, TRIPS_CHANGED, RECEIPT_READ. TRIPS_CHANGED carries no entity:
            refetch the list's trips, which need receipt access the stream does not check. RECEIPT_READ
            carries receiptId only (shoppingListId is 0): the AI finished with that receipt, so a page
            showing it refetches its product lines. Deliberately a plain
            string rather than an enum, so a client built before a new event type ships can ignore it
            instead of failing to deserialize.
        groupId:
          type: integer
          format: uint64
        shoppingListId:
          type: integer
          format: uint64
        list:
          $ref: "#/components/schemas/ShoppingList"
        item:
          $ref: "#/components/schemas/ShoppingListItem"
        itemIds:
          type: array
          description: Ids of the items removed by CHECKED_CLEARED
          items:
            type: integer
            format: uint64
        receiptId:
          type: integer
          format: uint64
          description: The receipt a RECEIPT_READ is about
    GroupOverview:
      type: object
      required:
        - month
        - total
        - previousTotal
        - receiptCount
        - openReceiptCount
        - unhealthyTotal
        - categories
        - months
      properties:
        month:
          type: string
          description: The month described, yyyy-MM
        total:
          type: string
          description: The month's spend, as a decimal string
        previousTotal:
          type: string
          description: The previous month's spend, as a decimal string
        receiptCount:
          type: integer
          format: int64
        openReceiptCount:
          type: integer
          format: int64
          description: The month's receipts still to check (OPEN)
        warrantyCount:
          type: integer
          format: int64
          description: The receipts the caller can see whose warranty ends today or later, whatever the period
        unhealthyTotal:
          type: string
          description: >-
            What the month's products rated UNHEALTHY cost, as a decimal string, whatever the
            receipt's category. Products without a price or not rated yet do not count.
        categories:
          type: array
          description: >-
            Spend per category in the period, largest first: what each category's product lines cost,
            and under Uncategorized what a receipt's lines do not account for. Always an array.
          items:
            $ref: "#/components/schemas/GroupOverviewCategory"
        tags:
          type: array
          description: >-
            One tile per tag marked showOnDashboard, by name: what the period's priced product lines
            carrying the tag cost. A line with two such tags counts toward both. Always an array.
          items:
            $ref: "#/components/schemas/GroupOverviewTag"
        months:
          type: array
          description: The six months ending with month, oldest first; a month without receipts is a zero
          items:
            $ref: "#/components/schemas/GroupOverviewMonth"
        from:
          type: string
          description: The period's first day, yyyy-MM-dd
        to:
          type: string
          description: The period's last day, yyyy-MM-dd
        previousFrom:
          type: string
          description: The first day of the period the previous* figures describe
        previousTo:
          type: string
          description: The last day of the period the previous* figures describe
        previousReceiptCount:
          type: integer
          format: int64
        previousUnhealthyTotal:
          type: string
          description: As unhealthyTotal, for the previous period
        unplannedTotal:
          type: string
          description: >-
            What the period's products marked as not on the shopping list cost, as a decimal string
        previousUnplannedTotal:
          type: string
          description: As unplannedTotal, for the previous period
        trend:
          type: array
          description: >-
            What the chart draws: months for a period of a month or more, days for a shorter one.
            Each point's month is yyyy-MM or yyyy-MM-dd (see trendUnit).
          items:
            $ref: "#/components/schemas/GroupOverviewMonth"
        trendUnit:
          type: string
          description: MONTH or DAY. A plain string, so another unit can follow.
    GroupOverviewCategory:
      type: object
      required:
        - name
        - total
      properties:
        categoryId:
          type: integer
          nullable: true
          description: >-
            The category; null for Uncategorized, and for a name kept by lines whose category was
            deleted before categories were stored by id
        name:
          type: string
        total:
          type: string
    GroupOverviewTag:
      type: object
      description: A Dashboard tag tile
      required:
        - tagId
        - name
        - total
        - previousTotal
      properties:
        tagId:
          type: integer
        name:
          type: string
        total:
          type: string
          description: What the period's priced lines carrying the tag cost, as a decimal string
        previousTotal:
          type: string
          description: As total, for the previous period
    GroupOverviewProduct:
      type: object
      description: A product line behind a Dashboard tile, with the receipt it is on
      required:
        - id
        - receiptId
        - receiptName
        - receiptDate
        - name
        - quantity
        - health
      properties:
        id:
          type: integer
        receiptId:
          type: integer
        receiptName:
          type: string
        receiptDate:
          type: string
          description: yyyy-MM-dd
        name:
          type: string
        amount:
          type: string
          nullable: true
        quantity:
          type: string
        health:
          type: string
        planned:
          type: boolean
          nullable: true
    GroupOverviewMonth:
      type: object
      required:
        - month
        - total
      properties:
        month:
          type: string
          description: yyyy-MM
        total:
          type: string
    UpsertReceiptProductCommand:
      type: object
      description: A person's own entry of a receipt product line
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 200
        amount:
          type: string
          nullable: true
          description: What the line cost, as a decimal string with at most 2 decimals; null for no price
        quantity:
          type: string
          maxLength: 50
          description: Quantity or weight; may be empty
        categoryId:
          type: integer
          nullable: true
          description: >-
            The line's one category; null for Uncategorized. An update replaces it, so send the
            line's current one to keep it.
        tagIds:
          type: array
          description: The line's tags; an update replaces them. Repeats are ignored.
          items:
            type: integer
    SetReceiptProductLabelsCommand:
      type: object
      description: A product line's category and tags, set together
      required:
        - tagIds
      properties:
        categoryId:
          type: integer
          nullable: true
          description: The line's one category; null for Uncategorized
        tagIds:
          type: array
          description: The line's tags, replacing the ones it had. Repeats are ignored.
          items:
            type: integer
    ReceiptProduct:
      type: object
      required:
        - health
        - foodGroup
        - seasonality
        - classificationOverridden
        - id
        - receiptId
        - name
        - displayName
        - quantity
        - position
        - tags
        - categoryOverridden
      properties:
        id:
          type: integer
          format: uint64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: integer
          format: uint64
          nullable: true
        receiptId:
          type: integer
          format: uint64
        name:
          type: string
          description: The product line as printed on the receipt
        displayName:
          type: string
          description: A short plain name for the product; empty when the AI gave none
        amount:
          type: string
          nullable: true
          description: What the line cost, as a decimal string; null when the receipt shows no price
        quantity:
          type: string
          description: Quantity or weight as printed; empty when not printed
        position:
          type: integer
          description: The line's order on the receipt
        health:
          type: string
          description: >-
            HEALTHY, MEDIUM, UNHEALTHY, NOT_FOOD, UNKNOWN, or empty while not yet classified. A plain
            string, never an enum, so a new rating cannot break an older client.
        foodGroup:
          type: string
          description: A short lowercase food group, e.g. "fresh produce"; empty while not yet classified
        seasonality:
          type: string
          description: >-
            For fresh fruit and vegetables, SEASONAL or OUT_OF_SEASON in Western Europe in the month
            bought; NOT_PRODUCE otherwise; empty while not yet classified. A plain string.
        classifiedAt:
          type: string
          format: date-time
          nullable: true
          description: When the tags were set; null while waiting to be classified
        classificationOverridden:
          type: boolean
          description: The tags were corrected by a person
        planned:
          type: boolean
          nullable: true
          description: >-
            Set once the receipt's shopping trip is compared with its list: true when the product was on
            the list, false when it was not. Null when the receipt is on no list or not compared yet,
            which counts as planned.
        matchedShoppingListItemId:
          type: integer
          format: uint64
          nullable: true
          description: The list item a planned product matched; it may since have left the list
        categoryId:
          type: integer
          format: uint64
          nullable: true
          description: The line's one category (Manage Categories); null for Uncategorized
        categoryOverridden:
          type: boolean
          description: A person chose the category; the AI no longer changes it
        tags:
          type: array
          description: The line's tags, by name. Always an array.
          items:
            $ref: "#/components/schemas/Tag"
    ShoppingTrip:
      type: object
      description: A receipt attached to a shopping list, or a photo waiting to become one.
      required:
        - id
        - shoppingListId
        - status
        - lastError
      properties:
        id:
          type: integer
          format: uint64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: integer
          format: uint64
          nullable: true
        createdByString:
          type: string
        shoppingListId:
          type: integer
          format: uint64
        receiptId:
          type: integer
          format: uint64
          nullable: true
          description: Null while an uploaded photo waits to become a receipt
        status:
          type: string
          description: >-
            PENDING, RUNNING, DONE, UNAVAILABLE (the AI could not be reached; retried automatically) or
            FAILED. A plain string, never an enum, so a new state cannot break an older client.
        lastError:
          type: string
          description: Why the last step did not succeed; empty otherwise
    ShoppingTripReceipt:
      type: object
      required:
        - id
        - name
        - date
        - amount
      properties:
        id:
          type: integer
          format: uint64
        name:
          type: string
        date:
          type: string
          format: date-time
        amount:
          type: string
          description: The receipt's total, as a decimal string
    ShoppingTripView:
      type: object
      description: >-
        A shopping trip as a list shows it. receipt is null while the photo waits, and for a receipt
        the caller may not see.
      required:
        - id
        - shoppingListId
        - createdAt
        - status
        - lastError
        - waitingForPhoto
        - plannedItemCount
        - productCount
        - unplannedProducts
      properties:
        id:
          type: integer
          format: uint64
        shoppingListId:
          type: integer
          format: uint64
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          description: The trip's status (see ShoppingTrip.status); a plain string
        lastError:
          type: string
        waitingForPhoto:
          type: boolean
          description: True while an uploaded photo has not become a receipt yet
        receipt:
          $ref: "#/components/schemas/ShoppingTripReceipt"
        plannedItemCount:
          type: integer
          description: How many list items counted as planned
        productCount:
          type: integer
          description: How many products the receipt has; 0 until the trip is DONE
        unplannedAmount:
          type: string
          nullable: true
          description: >-
            What the products not on the list cost, as a decimal string. Null until the trip is DONE,
            and for a receipt the caller may not see.
        unplannedProducts:
          type: array
          description: Names of the products that were not on the list. Always an array.
          items:
            type: string
    AttachShoppingTripReceiptCommand:
      type: object
      required:
        - receiptId
      properties:
        receiptId:
          type: integer
          format: uint64
    ReceiptProductsView:
      type: object
      required:
        - status
        - lastError
        - products
      properties:
        status:
          type: string
          description: >-
            NOT_QUEUED, PENDING, RUNNING, DONE, UNAVAILABLE (the AI could not be reached; retried
            automatically) or FAILED. A plain string, never an enum, so a new state cannot break an
            older client.
        lastError:
          type: string
          description: Why the last read did not succeed; empty otherwise
        products:
          type: array
          description: The products in receipt order. Always an array.
          items:
            $ref: "#/components/schemas/ReceiptProduct"
    QueuedReceiptsView:
      type: object
      required:
        - queued
      properties:
        queued:
          type: integer
          description: How many receipts were queued
    SetFoodClassificationCommand:
      type: object
      required:
        - health
      properties:
        health:
          type: string
          description: HEALTHY, MEDIUM, UNHEALTHY or NOT_FOOD
        seasonality:
          type: string
          description: SEASONAL, OUT_OF_SEASON or NOT_PRODUCE; empty leaves it as it was
    PermissionScope:
      description: Whether a permission applies app-wide or within a single group.
      type: string
      enum:
        - "APP"
        - "GROUP"
    PermissionDescriptor:
      type: object
      required:
        - key
        - label
        - description
        - category
        - scope
      properties:
        key:
          $ref: "#/components/schemas/Permission"
        label:
          type: string
          description: Short human-readable label for the role editor.
        description:
          type: string
          description: Full description used as tooltip/help text in the role editor.
        category:
          type: string
          description: Logical grouping for the role editor UI (e.g., "User Management", "Receipts").
        scope:
          $ref: "#/components/schemas/PermissionScope"
    Role:
      type: object
      required:
        - id
        - name
        - scope
        - isDefault
        - isSystem
        - permissions
      properties:
        id:
          type: integer
          format: uint64
        name:
          type: string
        description:
          type: string
        scope:
          $ref: "#/components/schemas/PermissionScope"
        isDefault:
          type: boolean
          description: >-
            Whether this role is the default for its scope — assigned to new
            accounts (APP) or to group creators (GROUP). Exactly one role per
            scope is the default.
        isSystem:
          type: boolean
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        assignedCount:
          type: integer
          description: Number of users or group members currently assigned this role
    SortDirection:
      type: string
      enum:
        - asc
        - desc
        - ""
    AiType:
      type: string
      description: >-
        The AI provider: ANTHROPIC (Claude), GEMINI, OPEN_AI (ChatGPT), OPEN_AI_CUSTOM (a local OpenAI-compatible
        server such as LM Studio) or OLLAMA. A plain string on purpose, so a new provider never breaks a client
        that does not know it yet.
    OcrEngine:
      type: string
      enum:
        - "TESSERACT"
        - "EASY_OCR"
    SystemTaskStatus:
      type: string
      enum:
        - "SUCCEEDED"
        - "FAILED"
    SystemTaskType:
      type: string
      enum:
        - "OCR_PROCESSING"
        - "CHAT_COMPLETION"
        - "MAGIC_FILL"
        - "QUICK_SCAN"
        - "RECEIPT_PROCESSING_SETTINGS_CONNECTIVITY_CHECK"
        - "RECEIPT_UPLOADED"
        - "RECEIPT_UPDATED"
        - "PROMPT_GENERATED"
        - "HTML_TO_PDF"
    AssociatedEntityType:
      type: string
      enum:
        - "NOOP_ENTITY_TYPE"
        - "RECEIPT"
        - "RECEIPT_PROCESSING_SETTINGS"
    AssociatedGroup:
      type: string
      enum:
        - "MINE"
        - "ALL"
    CurrencySeparator:
      type: string
      enum:
        - ","
        - "."
    CurrencySymbolPosition:
      type: string
      enum:
