      summary: What the AI has not read yet
      description: >-
        The quick scans the queue still holds (waiting, being read, between tries or failed), oldest first, and the
        receipts that were saved without a read, most recently touched first. For the AI page: it needs
        app.receipt-processing-settings.read. The flags on each row are resolved for the caller.
      operationId: getScanQueue
