        level:
          type: string
        message:
          type: string
      required:
        - timestamp
        - level
        - message
    SystemSettings:
      allOf:
        - $ref: "#/components/schemas/BaseModel"
        - type: object
          properties:
            enableLocalSignUp:
              type: boolean
              description: Whether local sign up is enabled
              default: false
            currencyDisplay:
              type: string
              description: Currency display
              default: "$"
            currencyThousandthsSeparator:
              $ref: "#/components/schemas/CurrencySeparator"
            currencyDecimalSeparator:
              $ref: "#/components/schemas/CurrencySeparator"
            currencySymbolPosition:
              $ref: "#/components/schemas/CurrencySymbolPosition"
            currencyHideDecimalPlaces:
              type: boolean
              description: Whether to hide decimal places
              default: false
            debugOcr:
              type: boolean
              description: Debug OCR
              default: false
            receiptProcessingSettingsId:
              type: integer
              description: Receipt processing settings foreign key
            fallbackReceiptProcessingSettingsId:
              type: integer
              description: Fallback receipt processing settings foreign key
            pdfDpi:
              type: integer
              description: DPI used when rasterizing PDFs for OCR/vision processing
              default: 300
            mcpEnabled:
              type: boolean
              description: Whether the OAuth 2.1-protected MCP server is enabled
              default: false
            mcpPublicUrl:
              type: string
              description: Externally reachable origin used for MCP OAuth/metadata/redirect URLs and token audience
            serverPublicUrl:
              type: string
              description: Externally reachable origin of this API, used to build each OIDC provider's redirect URI. Separate from mcpPublicUrl, which is bound into the MCP token audience.
            refreshTokenValidForHours:
              type: integer
              description: >-
                How long a refresh token stays valid, in hours. Refresh tokens rotate on every use,
                so this is how long a user can be away and still return signed in, not an absolute
                session cap. 1-8760 (one year); 0 means unset and falls back to the default.
              default: 24
            mcpRefreshTokenValidForHours:
              type: integer
              description: >-
                The same for MCP/OAuth connector refresh tokens, kept separate so a long window
                chosen for human convenience does not extend third-party client tokens.
                1-720 (30 days); 0 means unset and falls back to the default.
              default: 24
            tempFileRetentionHours:
              type: integer
              description: >-
                How long a file in temp/ is kept once nothing can still act on it, i.e. how long a
                user has to rerun, preview or download the source image of a failed upload.
                24-8760 (1 year); 0 means unset and falls back to the default.
              default: 720
            timeZone:
              type: string
              description: >-
                The app time zone, an IANA name such as America/New_York. Every calendar boundary
                (which day an Added At or Resolved Date falls on, "today", "this month", report
                periods) is worked out in it. A receipt's Date is a calendar day and never shifts
                with it.
              default: UTC
            dateFormat:
              type: string
              description: >-
                How the household shows dates: DD/MM/YYYY, MM/DD/YYYY, YYYY/MM/DD, DD.MM.YYYY or
                YYYY-MM-DD. Display only; dates on the wire stay ISO.
              default: DD/MM/YYYY
            secureCookies:
              type: boolean
              description: >-
                Marks every cookie the server sets as Secure, so browsers only send them over
                HTTPS. Recommended for any install served over HTTPS. Off by default, because a
                browser drops a Secure cookie set over plain HTTP, which breaks login.
              default: false
            shopLogoKeySet:
              type: boolean
              description: >-
                Whether a Logo.dev secret key is saved. The key itself is stored encrypted and never
                returned; with one the server downloads the shop logos and serves them (GET /shopLogo).
              default: false
    UpsertSystemSettingsCommand:
      type: object
      required:
        - currencyThousandthsSeparator
        - currencyDecimalSeparator
        - currencyHideDecimalPlaces
        - currencySymbolPosition
      properties:
        enableLocalSignUp:
          type: boolean
          description: Whether local sign up is enabled
        currencyDisplay:
          type: string
          description: Currency display
        currencyThousandthsSeparator:
          $ref: "#/components/schemas/CurrencySeparator"
        currencyDecimalSeparator:
          $ref: "#/components/schemas/CurrencySeparator"
        currencySymbolPosition:
          $ref: "#/components/schemas/CurrencySymbolPosition"
        currencyHideDecimalPlaces:
          type: boolean
          description: Whether to hide decimal places
        debugOcr:
          type: boolean
        receiptProcessingSettingsId:
          type: integer
          description: Receipt processing settings foreign key
        fallbackReceiptProcessingSettingsId:
          type: integer
          description: Fallback receipt processing settings foreign key
        pdfDpi:
          type: integer
          description: DPI used when rasterizing PDFs for OCR/vision processing
          minimum: 72
          maximum: 1200
        mcpEnabled:
          type: boolean
          description: Whether the OAuth 2.1-protected MCP server is enabled
        mcpPublicUrl:
          type: string
          description: Externally reachable origin used for MCP OAuth/metadata/redirect URLs and token audience
        serverPublicUrl:
          type: string
          description: Externally reachable origin of this API, used to build each OIDC provider's redirect URI. Separate from mcpPublicUrl, which is bound into the MCP token audience.
        refreshTokenValidForHours:
          type: integer
          description: >-
            How long a refresh token stays valid, in hours. Accepted values are 1-8760 (one year), or
            0 meaning unset, which falls back to the default of 720 (30 days). Omit the key entirely
            to leave the currently configured value unchanged.
          minimum: 0
          maximum: 8760
        mcpRefreshTokenValidForHours:
          type: integer
          description: >-
            How long an MCP/OAuth connector refresh token stays valid, in hours. Accepted values are
            1-720 (30 days), or 0 meaning unset, which falls back to the default of 24. Omit the key
            entirely to leave the currently configured value unchanged.
          minimum: 0
          maximum: 720
        tempFileRetentionHours:
          type: integer
          description: >-
            How long a temp file is kept once nothing can still act on it, in hours. Accepted values
            are 24-8760 (1 year), or 0 meaning unset, which falls back to the default of 720 (30
            days). Omit the key entirely to leave the currently configured value unchanged.
          minimum: 0
          maximum: 8760
        timeZone:
          type: string
          description: >-
            The app time zone, an IANA name such as America/New_York that the server can load
            (an unknown name is a 400 under the timeZone key). Omit the key entirely to leave the
            currently configured value unchanged.
        dateFormat:
          type: string
          description: >-
            One of DD/MM/YYYY, MM/DD/YYYY, YYYY/MM/DD, DD.MM.YYYY or YYYY-MM-DD (anything else is a
            400 under the dateFormat key). Omit the key entirely to leave the current value unchanged.
        secureCookies:
          type: boolean
          description: >-
            Marks every cookie the server sets as Secure. Only turn it on when the app is served
            over HTTPS: a browser drops a Secure cookie set over plain HTTP, which breaks login.
            Omit the key entirely to leave the currently configured value unchanged.
        shopLogoKey:
          type: string
          description: >-
            The household's Logo.dev secret key (starts with sk_), which the server downloads the
            shop logos with through Logo.dev's API; stored encrypted. "" removes the key and stops the
            downloads; the logos already downloaded stay. A publishable key (pk_) or anything else is a 400 under the shopLogoKey
            key. Omit the key entirely to leave the saved key unchanged.
    SystemTask:
      allOf:
        - $ref: "#/components/schemas/BaseModel"
        - type: object
          properties:
            type:
              $ref: "#/components/schemas/SystemTaskType"
            status:
              $ref: "#/components/schemas/SystemTaskStatus"
            startedAt:
              type: string
            endedAt:
              type: string
            associatedEntityId:
              type: integer
            associatedEntityType:
              $ref: "#/components/schemas/AssociatedEntityType"
            ranByUserId:
              type: integer
              format: uint64
            receiptId:
              type: integer
              format: uint64
            groupId:
              type: integer
              format: uint64
            resultDescription:
              type: string
            childSystemTasks:
              type: array
              items:
                $ref: "#/components/schemas/SystemTask"
            hasSourceFile:
              type: boolean
              description: >-
                Whether the upload behind this task is still on disk AND the caller may reach it.
                Resolved per caller, since this listing is app-scoped and spans groups the caller
                may not belong to.
    ClientReportCommand:
      type: object
      description: Something that went wrong in the browser, for the server's log.
      required:
        - kind
        - detail
      properties:
        kind:
          type: string
          description: What happened, in lower-case words joined by hyphens, for example quick-scan-camera-closed (a plain string)
        detail:
          type: string
          description: One line of what the app knew at that moment; may be empty, and is cut at 500 bytes
    ScanQueue:
      type: object
      description: What the AI has not read yet. Both lists are arrays, never null.
      required:
        - scans
        - unreadReceipts
        - unreadReceiptCount
      properties:
        scans:
          type: array
          items:
            $ref: "#/components/schemas/ScanQueueScan"
        unreadReceipts:
          type: array
          description: The most recently touched receipts without a read (at most 50)
          items:
            $ref: "#/components/schemas/ScanQueueReceipt"
        unreadReceiptCount:
          type: integer
          format: int64
          description: How many receipts are without a read in all
    ScanQueueScan:
      type: object
      description: A quick scan the queue holds, a photo that is not a receipt yet.
      required:
        - id
        - status
        - fileName
        - groupId
        - uploadedByUserId
        - uploadedAt
        - attempts
        - maxAttempts
        - lastError
        - hasFile
        - canRerun
      properties:
        id:
          type: integer
        status:
          type: string
          description: WAITING, READING, RETRYING or FAILED (a plain string; others may follow)
        fileName:
          type: string
          description: The upload's original file name
        groupId:
          type: integer
        uploadedByUserId:
          type: integer
        uploadedAt:
          type: string
          format: date-time
        attempts:
          type: integer
          description: How many tries failed so far
        maxAttempts:
          type: integer
        nextAttemptAt:
          type: string
          format: date-time
          nullable: true
          description: When a RETRYING scan is tried again; null otherwise
        lastError:
          type: string
          description: What the last failed try said; empty when none failed
        hasFile:
          type: boolean
          description: Whether the caller can open the photo (GET /scanQueue/{id}/file)
        canRerun:
          type: boolean
          description: Whether the caller can run it again (POST /scanQueue/{id}/rerun)
    ScanQueueReceipt:
      type: object
      description: A receipt whose products the AI has not read.
      required:
        - receiptId
        - name
        - groupId
        - date
        - status
        - attempts
        - lastError
        - updatedAt
        - canReadAgain
      properties:
        receiptId:
          type: integer
        name:
          type: string
        groupId:
          type: integer
        date:
          type: string
          format: date-time
        status:
          type: string
          description: PENDING, RUNNING, UNAVAILABLE or FAILED (the read's own status, a plain string)
        attempts:
          type: integer
          description: How many answers of the AI could not be read
        lastError:
          type: string
        updatedAt:
          type: string
          format: date-time
        canReadAgain:
          type: boolean
          description: Whether the caller can ask for another read (POST /receiptProduct/receipt/{receiptId}/read)
    ScanQueueSummary:
      type: object
      required:
        - waiting
        - failed
      properties:
        waiting:
          type: integer
          description: Quick scans waiting, being read or between tries
        failed:
          type: integer
          description: Quick scans that used up their tries
    SystemTaskSourceFileView:
      type: object
      required:
        - name
        - encodedImage
      properties:
        name:
          type: string
          description: The upload's original file name
        encodedImage:
          type: string
          description: Base64 encoded image, converted for display
    GetSystemTaskCommand:
      allOf:
        - $ref: "#/components/schemas/PagedRequestCommand"
        - type: object
          properties:
            associatedEntityId:
              type: integer
              description: Associated entity id
            associatedEntityType:
              $ref: "#/components/schemas/AssociatedEntityType"
            filter:
              $ref: "#/components/schemas/SystemTaskPagedRequestFilter"
    ReceiptProcessingSettings:
      allOf:
        - $ref: "#/components/schemas/BaseModel"
        - type: object
          properties:
            name:
              type: string
              description: Name of the settings
            description:
              type: string
              description: Description of the settings
            aiType:
              $ref: "#/components/schemas/AiType"
            url:
              type: string
              description: URL for custom endpoints
            key:
              type: string
              description: Key for endpoints that require authentication
            model:
              type: string
              description: LLM model
            isVisionModel:
              type: boolean
              description: Is vision model
            enforceJsonResponseFormat:
              type: boolean
              description: Enforce JSON response format on the LLM provider. Disable if the provider does not support this flag.
            contextSize:
              type: integer
              description: Ollama only. The context size (num_ctx) in tokens; 0 leaves the model server its own default, which is a few thousand and cuts a long receipt short.
            ocrEngine:
              $ref: "#/components/schemas/OcrEngine"
    UpsertReceiptProcessingSettingsCommand:
      type: object
      required:
        - name
        - aiType
        - ocrEngine
      properties:
        name:
          type: string
          description: Name of the settings
        description:
          type: string
          description: Description of the settings
        aiType:
          $ref: "#/components/schemas/AiType"
        url:
          type: string
          description: URL for custom endpoints
        key:
          type: string
          description: Key for endpoints that require authentication
        model:
          type: string
          description: LLM model
        isVisionModel:
          type: boolean
          description: Is vision model
        enforceJsonResponseFormat:
          type: boolean
          description: Enforce JSON response format on the LLM provider. Disable if the provider does not support this flag.
        contextSize:
          type: integer
          description: Ollama only. The context size (num_ctx) in tokens; 0 leaves the model server its own default, which is a few thousand and cuts a long receipt short.
        ocrEngine:
          $ref: "#/components/schemas/OcrEngine"
    CheckReceiptProcessingSettingsConnectivityCommand:
      type: object
      properties:
        id:
          type: integer
          description: Receipt processing settings id
        name:
          type: string
          description: Name of the settings
        aiType:
          $ref: "#/components/schemas/AiType"
        url:
          type: string
          description: URL for custom endpoints
        key:
          type: string
          description: Key for endpoints that require authentication
        model:
          type: string
          description: LLM model
        enforceJsonResponseFormat:
          type: boolean
          description: Enforce JSON response format on the LLM provider. Disable if the provider does not support this flag.
        contextSize:
          type: integer
          description: Ollama only. The context size (num_ctx) in tokens; 0 leaves the model server its own default, which is a few thousand and cuts a long receipt short.
        ocrEngine:
          $ref: "#/components/schemas/OcrEngine"
    Icon:
      type: object
      required:
        - value
        - displayValue
      properties:
        value:
          type: string
          description: Icon value
        displayValue:
          type: string
          description: Icon display value
    About:
      type: object
      required:
        - buildDate
        - version
      properties:
        buildDate:
          type: string
          description: Build date
        version:
          type: string
          description: Version
        runsAsRoot:
          type: boolean
          description: True when the server process is root (the container was started with ALLOW_ROOT=1)
    InternalErrorResponse:
      type: object
      required:
        - errorMsg
      properties:
        errorMsg:
          type: string
          description: Error message
    ReportRequestCommand:
      type: object
      required:
        - groupIds
        - period
        - detail
        - columns
        - formats
      properties:
        name:
          type: string
          description: Report name; used for the download filename
        groupIds:
          type: array
          items:
            type: string
          description: Ids of the groups the report covers
        period:
          $ref: "#/components/schemas/ReportPeriod"
        filter:
          $ref: "#/components/schemas/ReceiptPagedRequestFilter"
          description: Which receipts go into the report
        groupBy:
          type: array
          items:
            type: string
          description: >-
            Ordered engine field keys to nest the report by. category, tag,
            health and planned are read off the receipts' product lines: cutting
            by one divides each receipt by what its lines cost, and what the
            lines leave over is the empty bucket.
        groupByLabels:
          type: object
          additionalProperties:
            type: string
          description: >-
            Column-heading overrides for the grouping levels, keyed by the
            groupBy field key. A key that is absent, blank, or not present in
            groupBy falls back to the field catalog's label.
        detail:
          $ref: "#/components/schemas/ReportDetail"
        columns:
          type: array
          items:
            $ref: "#/components/schemas/ReportColumn"
        subtotals:
          type: boolean
          description: Emit a subtotal row at each grouping level
        grandTotals:
          type: boolean
          description: Emit one grand-total row across everything
        document:
          $ref: "#/components/schemas/ReportDocument"
        formats:
          type: array
          items:
            type: string
            enum:
              - csv
              - xlsx
              - pdf
          description: One or more output formats; multiple are zipped together
    ReportPeriod:
      type: object
      required:
        - preset
      properties:
        preset:
          type: string
          enum:
            - this_month
            - last_month
            - mtd
            - qtd
            - ytd
            - custom
        startDate:
          type: string
          description: Start date (YYYY-MM-DD), read only when preset is custom
        endDate:
          type: string
          description: End date (YYYY-MM-DD), read only when preset is custom
        dateField:
          type: string
          description: >-
            Which receipt date the period covers, as a ReceiptPagedRequestFilter
            date key: date, resolvedDate or createdAt. Omitted means date. A plain
            string rather than an enum on purpose: this rides inside
            ReportTemplate.configuration, and a value added to a closed enum
            would fail that whole payload on already-released mobile builds.
    ReportDetail:
      type: object
      required:
        - mode
      properties:
        mode:
          type: string
          enum:
            - records
            - aggregate
        by:
          type: string
          description: Dimension field key to aggregate leaf rows by (aggregate mode)
    ReportColumn:
      type: object
      required:
        - kind
        - name
      properties:
        kind:
          type: string
          enum:
            - dimension
            - aggregate
            - formula
        name:
          type: string
          description: Machine identifier; formula expressions reference this
        label:
          type: string
        field:
          type: string
          description: Field key the column displays (dimension columns)
        aggFunc:
          type: string
          enum:
            - SUM
            - COUNT
            - AVG
            - MIN
            - MAX
          description: Aggregate function (aggregate columns)
        measure:
          type: string
          description: Measure field key (aggregate columns, omitted for COUNT)
        expr:
          type: string
          description: Expression over other column names (formula columns)
    ReportDocument:
      type: object
      properties:
        title:
          type: string
        intro:
          type: string
        footer:
          type: string
    ReportPreviewResponse:
      type: object
      required:
        - html
        - receiptCount
      properties:
        html:
          type: string
          description: The rendered report preview as a self-contained HTML document.
        receiptCount:
          type: integer
          description: The number of receipts the current configuration covers.
        allowedActions:
          type: array
          description: >-
            The actions the requesting user may perform on the template
            (read, generate, update, delete, duplicate), resolved per user and
            populated only by the dashboard report-widget render endpoint. Drives
            the widget's download button.
          items:
            type: string
    ReportTemplate:
      allOf:
        - $ref: "#/components/schemas/BaseModel"
        - type: object
          required:
            - name
            - configuration
            - configurationVersion
          properties:
            name:
              type: string
              description: The template name (mirrors the saved report's name).
            configuration:
              $ref: "#/components/schemas/ReportRequestCommand"
            configurationVersion:
              type: integer
              description: Schema version the stored configuration was written under.
            allowedActions:
              type: array
              description: >-
                The actions the requesting user may perform on this template
                (read, generate, update, delete, duplicate), resolved per user and
                populated only on the list response. Drives the row action buttons.
              items:
                type: string
