      summary: Run a failed scan again
      description: >-
        Queues a failed quick scan again with a fresh set of tries. Needs group.activities.rerun in the scan's
        household. A scan that is not failed, or whose photo is gone, is a 400; an unknown id answers like a
        refusal.
      operationId: rerunQueuedScan
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Id of the queued scan
      responses:
