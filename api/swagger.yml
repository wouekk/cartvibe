      description:
        Ends every session of the signed-in user - each browser they are signed in on
        and each assistant they connected (MCP) - and clears this browser's session
        cookies. It needs no permission beyond being signed in. Another device keeps
        working until its access token runs out (20 minutes at most); its next token
        refresh is refused with 401.
      operationId: signOutEverywhere
      responses:
        200:
          $ref: "#/components/responses/Ok"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
