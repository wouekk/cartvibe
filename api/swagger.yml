  /role:
    get:
      tags:
        - Role
      summary: List all roles
      description: >-
        Returns the roles, app-scoped and group-scoped. They are fixed: Admin and User in the app (the rows are
        named "Legacy Admin" and "User"), Owner and Member in a household ("Legacy Owner" and "Member"). No route
        creates, changes or deletes a role.
      operationId: getRoles
      responses:
        200:
          description: All roles in the system
