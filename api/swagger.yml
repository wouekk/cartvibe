        groupIds:
          type: array
          items:
            type: integer
            description: Group foreign key
        paidByUserIds:
          type: array
          items:
            type: integer
            description: User foreign key
        statuses:
          type: array
          items:
            $ref: "#/components/schemas/ReceiptStatus"
        categoryIds:
          type: array
          items:
            type: string
            description: Comma-joined category ids for the file at the same index
        tagIds:
          type: array
          items:
            type: string
            description: Comma-joined tag ids for the file at the same index
        notes:
          type: array
          items:
            type: string
            maxLength: 10000
            description:
              Note for the file at the same index (empty for none). Kept only where the household's Quick Scan
              asks for a note. The field was called comments before 2026-11, and that name is still read.
    ShopLogo:
      type: object
      required:
        - slug
        - name
        - aliases
      properties:
        slug:
          type: string
          description: The brand's id; its logo is GET /shopLogo/{slug}
        name:
          type: string
          description: The brand's name
        aliases:
          type: array
          description: Other spellings seen on receipts, matched as whole words
          items:
            type: string
    ShopLogoStatus:
      type: object
      required:
        - running
        - downloaded
        - total
        - lastError
      properties:
        running:
          type: boolean
          description: Whether a download is going on now
        downloaded:
          type: integer
          description: How many of the known brands on the household's receipts have a downloaded logo
        total:
          type: integer
          description: How many known brands appear on the household's receipts (only these are downloaded)
        lastRun:
          type: string
          format: date-time
          nullable: true
          description: When the last download finished; null before the first
        lastError:
          type: string
          description:
            Why the last download stopped early, such as a refused key or the month's API credits being used
            up; "" when it went well
    DashboardLayout:
      allOf:
        - $ref: "#/components/schemas/BaseModel"
        - type: object
          required:
            - userId
            - layout
            - canCustomise
          properties:
            userId:
              type: integer
              description: User foreign key
            layout:
              type: string
              description:
                The layout as a JSON document owned by the clients, `{"version":1,"panels":[{"id","visible","cols","rows"}],"compactOrder":[...]}`;
                panel ids are plain strings. Empty means the default layout.
            canCustomise:
              type: boolean
              description: Whether this person may save a layout (computed, not stored)
    UpdateDashboardLayoutCommand:
      type: object
      required:
        - layout
      properties:
        layout:
          type: string
          description: The layout JSON document (an object with a numeric version, at most 16 KB)
    UserPreferences:
      allOf:
        - $ref: "#/components/schemas/BaseModel"
        - type: object
          required:
            - id
            - userId
          properties:
            id:
              type: integer
              description: User preferences id
            userId:
              type: integer
              description: User foreign key
            quickScanDefaultGroupId:
              type: integer
              description: Group foreign key
              default: 0
            quickScanDefaultPaidById:
              type: integer
              description: User foreign key
              default: 0
            quickScanDefaultStatus:
              type: string
              $ref: "#/components/schemas/ReceiptStatus"
              description: Default quick scan status
              default: "OPEN"
            closeChipSelectOnSelect:
              type: boolean
              description:
                Whether multi-select chip fields close their option list after
                each selection
              default: false
            monthlySpendingGoal:
              type: string
              nullable: true
              description: The most this person wants to spend in a month, as a decimal string; null or 0 means no goal
            displayCurrency:
              type: string
              description: The ISO code of the currency this person sees the Dashboard in; empty means the household currency
              default: ""
            displayCurrencyRate:
              type: string
              nullable: true
              description: How many units of displayCurrency one unit of the household currency is worth, as a decimal string; only the Dashboard converts
            language:
              type: string
              default: ""
              description: The interface language this person chose (a language code such as en or pl); empty follows the browser
            aiLanguage:
              type: string
              default: ""
              description: The language the AI writes this person's product names and new categories in (a language code such as en or pl); empty follows language, then English
            onboardingPending:
              type: boolean
              default: false
              description: >-
                True until this person has been through the first sign-in welcome (language, theme and, for an admin,
                the household currency). New accounts start with it on; the desktop sends false when it is done.
            region:
              type: string
              description: >-
                The person's country, ISO 3166-1 alpha-2 ("PL"); empty means the browser's region. It decides the
                Automatic warranty period.
            warrantyPeriodYears:
              type: integer
              nullable: true
              description: Where a new warranty date starts, in years after the receipt day (1, 2, 3 or 5); null is Automatic
            warrantyReminderLeadDays:
              type: integer
              nullable: true
              description: Days before a warranty ends that its reminder comes, 0 on the day; null is 30
    GroupReceiptSettings:
      description:
        What a household set for its receipts. A Quick Scan is a photo and nothing else; the household can add a
        note field to it (never required), and can change the two defaults a scan falls back on.
      allOf:
        - $ref: "#/components/schemas/BaseModel"
        - type: object
          required:
            - groupId
          properties:
            groupId:
              type: integer
              description: Group foreign key
            hideImages:
              type: boolean
              description: Hide receipt images
            hideReceiptCategories:
              type: boolean
              description: Hide receipt categories
            hideReceiptTags:
              type: boolean
              description: Hide receipt tags
            hideNote:
              type: boolean
              description: Take the note off the household's receipts (the form, the list and Quick Scan)
            quickScanNoteEnabled:
              type: boolean
              description: Quick Scan asks for a note (not while hideNote is on)
            quickScanDefaultPaidByType:
              $ref: "#/components/schemas/QuickScanDefaultPaidByType"
            quickScanDefaultPaidById:
              type: integer
              nullable: true
              description: Who paid when a scan does not say and the type is USER
            quickScanDefaultStatus:
              $ref: "#/components/schemas/ReceiptStatus"
    UpdateGroupReceiptSettingsCommand:
      type: object
      properties:
        hideImages:
          type: boolean
          description: Hide receipt images
        hideReceiptCategories:
          type: boolean
          description: Hide receipt categories
        hideReceiptTags:
          type: boolean
          description: Hide receipt tags
        hideNote:
          type: boolean
          description: Take the note off the household's receipts (the form, the list and Quick Scan)
        quickScanNoteEnabled:
          type: boolean
          description: Quick Scan asks for a note (not while hideNote is on)
        quickScanDefaultPaidByType:
          $ref: "#/components/schemas/QuickScanDefaultPaidByType"
        quickScanDefaultPaidById:
          type: integer
          nullable: true
          description: Who paid when a scan does not say; required when the type is USER
        quickScanDefaultStatus:
          $ref: "#/components/schemas/ReceiptStatus"
    CreateReceiptWithFilesCommand:
      type: object
      required:
        - receipt
      properties:
        receipt:
          $ref: "#/components/schemas/UpsertReceiptCommand"
        files:
          type: array
          description: >-
            Images (or PDFs) to attach to the new receipt. Together with the
            receipt they share the server's 50 MB request body limit.
          items:
            type: string
            format: binary
    ReceiptFileUploadCommand:
      type: object
      required:
        - file
        - receiptId
      properties:
        file:
          type: string
          format: binary
        receiptId:
          type: integer
          description: Receipt foreign key
        encodedImage:
          type: string
          description: Base64 encoded image for file types that aren't viewable natively in the browser, such as PDFs
    FileDataView:
      allOf:
        - $ref: "#/components/schemas/BaseModel"
        - type: object
          required:
            - encodedImage
            - name
          properties:
            encodedImage:
              type: string
              description: Base64 encoded image
            name:
              type: string
              description: File name
    EncodedImage:
      type: object
      required:
        - encodedImage
      properties:
        encodedImage:
          type: string
          description: base64 encoded jpg
    AppData:
      type: object
      required:
        - about
        - claims
        - groups
        - users
        - userPreferences
        - featureConfig
        - categories
        - tags
        - currencyDisplay
        - icons
        - appPermissions
        - groupPermissions
      properties:
        about:
          $ref: "#/components/schemas/About"
        claims:
          $ref: "#/components/schemas/Claims"
        groups:
          type: array
          description: Groups in the system
          items:
            $ref: "#/components/schemas/Group"
        users:
          type: array
          description: Users in the system
          items:
            $ref: "#/components/schemas/UserView"
        userPreferences:
          $ref: "#/components/schemas/UserPreferences"
        featureConfig:
          $ref: "#/components/schemas/FeatureConfig"
        categories:
          type: array
          description: Categories in the system
          items:
            $ref: "#/components/schemas/Category"
        tags:
          type: array
          description: Tags in the system
          items:
            $ref: "#/components/schemas/Tag"
        jwt:
          type: string
          description: JWT token
        refreshToken:
          type: string
          description: Refresh token
        currencyDisplay:
          type: string
          description: Currency display
        currencyThousandthsSeparator:
          $ref: "#/components/schemas/CurrencySeparator"
        currencyDecimalSeparator:
          $ref: "#/components/schemas/CurrencySeparator"
        currencySymbolPosition:
          $ref: "#/components/schemas/CurrencySymbolPosition"
        currencyHideDecimalPlaces:
          type: boolean
          description: Whether to hide decimal places
        timeZone:
          type: string
          description: >-
            The app time zone, an IANA name such as America/New_York ("UTC" when unset or
            invalid). Clients work out "today" and display instants (Added At, Resolved Date) in
            it. A receipt's Date is a calendar day and is always read in UTC. A plain string, not
            an enum, so a released client never fails the payload on a zone it does not know.
        dateFormat:
          type: string
          description: >-
            How the household shows dates: DD/MM/YYYY (the default), MM/DD/YYYY, YYYY/MM/DD,
            DD.MM.YYYY or YYYY-MM-DD. Display only; dates on the wire stay ISO. A plain string, not
            an enum, so a client treats a format it does not know as the default.
        icons:
          type: array
          description: Icons in the system
          items:
            $ref: "#/components/schemas/Icon"
        appPermissions:
          type: array
          description: >-
            The calling user's effective app-level permissions. Deliberately
            typed as plain strings rather than the Permission enum: this is
            server-resolved data, not a contract. A granted entry may be a
            wildcard (e.g. "app.*"), which is not an enum member, and a client
            built before a newly added permission must still be able to parse
            the payload. Clients match these with the wildcard matcher.
          items:
            type: string
        groupPermissions:
          type: object
          description: >-
            The calling user's effective group-level permissions, keyed by group
            id. Plain strings for the same reason as appPermissions.
          additionalProperties:
            type: array
            items:
              type: string
        groupCategories:
          type: object
          description: >-
            The categories the calling user may use in each group, keyed by group
            id: the whole pool, for every household they are in. People without
            app.categories.read receive categories only through this map.
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/Category"
        groupTags:
          type: object
          description: >-
            The tags the calling user may use in each group, keyed by group id:
            the whole pool, for every household they are in. People without
            app.tags.read receive tags only through this map.
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/Tag"
    TokenPair:
      type: object
      required:
