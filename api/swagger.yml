        - bearerAuth: [ ]
  /shopping-list/group/{groupId}:
    parameters:
      - in: path
        name: groupId
        schema:
          type: integer
        required: true
        description: Id of the group the shopping lists belong to. The "All" group is rejected with 400.
    get:
      tags:
        - ShoppingList
      summary: Get shopping lists for a group
      description: >-
        This will get every shopping list in a group, each with its items [group.shopping-lists.read]. The
        answer carries an ETag and "Cache-Control: private, no-cache": a request with a matching
        If-None-Match is answered 304 without a body.
      operationId: getShoppingListsForGroup
      responses:
        200:
          description: The group's shopping lists, ordered by name, each with its items ordered by creation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShoppingList"
        304:
          description: Nothing changed since the answer the If-None-Match tag came from
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
    post:
      tags:
        - ShoppingList
      summary: Create shopping list
      description: This will create a shopping list in a group [group.shopping-lists.create]
      operationId: createShoppingList
      requestBody:
        description: Shopping list to create
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertShoppingListCommand"
      responses:
        200:
          description: The created shopping list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingList"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /shopping-list/group/{groupId}/stream:
    parameters:
      - in: path
        name: groupId
        schema:
          type: integer
        required: true
        description: Id of the group to receive shopping list updates for
    get:
      tags:
        - ShoppingList
      summary: Stream shopping list updates
      description: >-
        Server-Sent Events stream of every shopping list mutation in the group [group.shopping-lists.read].
        Each event is named after its ShoppingListEvent type and its data is a ShoppingListEvent as JSON.
        A heartbeat event named PING (data "{}") is sent every 25 seconds, so a client can tell a stream that
        went silent from a quiet one, and the server ends the stream after 15 minutes
        (or when the caller loses access) so that reconnecting re-authenticates. Events missed while
        disconnected are not replayed; refetch the lists after (re)connecting.
      operationId: streamShoppingListEvents
      responses:
        200:
          description: An open event stream
          content:
            text/event-stream:
              schema:
                type: string
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /shopping-list/group/{groupId}/going-shopping:
    parameters:
      - in: path
        name: groupId
        schema:
          type: integer
        required: true
        description: Id of the group
    post:
      tags:
        - ShoppingList
      summary: Tell the household you are going shopping
      description: >-
        This will notify everyone else in the group to add what they need to the lists. A repeat within
        15 minutes is ignored. Not available for the All group [group.shopping-lists.update]
      operationId: announceGoingShopping
      responses:
        200:
          $ref: "#/components/responses/Ok"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /shopping-list/group/{groupId}/recipe/preview:
    parameters:
      - in: path
        name: groupId
        schema:
          type: integer
        required: true
        description: Id of the group the recipe is being imported into
    post:
      tags:
        - ShoppingList
      summary: Preview a recipe's ingredients
      description: >-
        Reads the ingredients of a recipe page (a URL) or of pasted text and returns them as rows, without
        writing anything [group.shopping-lists.update]. Send exactly one of url and text. The parsing is
        rule-based (schema.org Recipe data on the page, or plain lines of text): no AI is called and nothing
        is translated, so names and units stay in the recipe's language. A page that cannot be read still
        answers 200, with an empty items array and a failureReason; the client then asks for pasted text.
        Fetches never reach private networks. Not available for the All group.
      operationId: previewShoppingListRecipe
      requestBody:
        description: The recipe page or text to read
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewShoppingListRecipeCommand"
      responses:
        200:
          description: The parsed ingredients, or why none could be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipePreview"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /shopping-list/{listId}:
    parameters:
      - in: path
        name: listId
        schema:
          type: integer
        required: true
        description: Id of the shopping list to operate on
    put:
      tags:
        - ShoppingList
      summary: Rename shopping list
      description: This will rename a shopping list [group.shopping-lists.update]
      operationId: updateShoppingList
      requestBody:
        description: Shopping list to update
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertShoppingListCommand"
      responses:
        200:
          description: The updated shopping list, with its items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingList"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
    delete:
      tags:
        - ShoppingList
      summary: Delete shopping list
      description: This will delete a shopping list and all of its items [group.shopping-lists.delete]
      operationId: deleteShoppingList
      responses:
        200:
          $ref: "#/components/responses/Ok"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /shopping-list/{listId}/item:
    parameters:
      - in: path
        name: listId
        schema:
          type: integer
        required: true
        description: Id of the shopping list to add the item to
    post:
      tags:
        - ShoppingList
      summary: Add shopping list item
      description: >-
        This will add an item to a shopping list [group.shopping-lists.update]. When the name matches a
        crossed-off item on the same list (ignoring case), that item is un-checked instead of a duplicate
        being created; a supplied quantity or note replaces the stored one. An add that carries a clientId
        may be sent again safely: the repeat answers with the same item and adds nothing.
      operationId: addShoppingListItem
      requestBody:
        description: Item to add
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertShoppingListItemCommand"
      responses:
        200:
          description: The added (or revived) item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingListItem"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /shopping-list/{listId}/recipe/import:
    parameters:
      - in: path
        name: listId
        schema:
          type: integer
        required: true
        description: Id of the shopping list to add the recipe's ingredients to
    post:
      tags:
        - ShoppingList
      summary: Add recipe ingredients to a shopping list
      description: >-
        Merges the chosen preview rows into a list in one step [group.shopping-lists.update]. A row whose name
        (ignoring case and spacing) matches an unchecked item with a compatible unit adds its quantity onto that
        item; a match with an incompatible unit is added as its own row; a match with a crossed-off item
        un-checks it and replaces its quantity. g, kg, ml and l fill the item's amount and unit (dag, mg, cl
        and dl are converted); a bare count is an amount with no unit; any other unit stays in the recipe's
        language in the item's free-text quantity. The list is sent to the group's event stream once, as
        LIST_UPDATED.
      operationId: importShoppingListRecipe
      requestBody:
        description: The rows to add, with their final (scaled) amounts
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportShoppingListRecipeCommand"
      responses:
        200:
          description: The list after the merge and how many rows were handled each way
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportShoppingListRecipeResult"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /shopping-list/{listId}/clearChecked:
    parameters:
      - in: path
        name: listId
        schema:
          type: integer
        required: true
        description: Id of the shopping list to clear
    post:
      tags:
        - ShoppingList
      summary: Clear crossed-off items
      description: This will delete every crossed-off item on a shopping list [group.shopping-lists.update]
      operationId: clearCheckedShoppingListItems
      responses:
        200:
          $ref: "#/components/responses/Ok"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /shopping-list/{listId}/checked:
    parameters:
      - in: path
        name: listId
        schema:
          type: integer
        required: true
        description: Id of the shopping list to cross off or put back
    put:
      tags:
        - ShoppingList
      summary: Set whether a whole shopping list is crossed off
      description: >-
        This will move every item on the list, or only the given items of it, to the given checked state
        [group.shopping-lists.update]. Items already in that state keep their stamp. Used by "Mark as
        complete", "Restore" and Undo.
      operationId: setShoppingListChecked
      requestBody:
        description: Target checked state and, optionally, which items
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetShoppingListCheckedCommand"
      responses:
        200:
          description: The list in its new state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingList"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /shopping-list/{listId}/trip:
    parameters:
      - in: path
        name: listId
        schema:
          type: integer
        required: true
        description: Id of the shopping list
    get:
      tags:
        - ShoppingList
      summary: Get a shopping list's trips
      description: >-
        This will return the list's most recent trips (receipts attached to it), newest first, with
        what was bought that was not on the list [group.shopping-lists.read, group.receipts.read].
      operationId: getShoppingTrips
      responses:
        200:
          description: The trips. Always an array.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShoppingTripView"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
    post:
      tags:
        - ShoppingList
      summary: Attach an existing receipt to a shopping list
      description: >-
        This will attach a receipt of the list's group to the list and queue the comparison of its
        products with what was planned: the open items, plus those crossed off since the day of the
        receipt or in the last day [group.shopping-lists.update, group.receipts.read]. A receipt is on
        one list at most.
      operationId: attachShoppingTripReceipt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachShoppingTripReceiptCommand"
      responses:
        200:
          description: The new trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingTrip"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /shopping-list/{listId}/trip/upload:
    parameters:
      - in: path
        name: listId
        schema:
          type: integer
        required: true
        description: Id of the shopping list
    post:
      tags:
        - ShoppingList
      summary: Start a shopping trip from a receipt photo
      description: >-
        This will keep the photo and turn it into a receipt the way Quick Scan does, with the group's
        quick-scan defaults, then compare it with the list. While the AI is unavailable the photo
        waits, for up to 14 days [group.shopping-lists.update, group.receipts.quick-scan].
      operationId: uploadShoppingTripPhoto
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: A photo or PDF of the receipt
      responses:
        200:
          description: The new trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingTrip"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /shopping-list/trip/{tripId}:
    parameters:
      - in: path
        name: tripId
        schema:
          type: integer
        required: true
        description: Id of the shopping trip
    delete:
      tags:
        - ShoppingList
      summary: Remove a receipt from its shopping list
      description: >-
        This will detach the trip; the receipt stays, and its products lose their planned marks
        [group.shopping-lists.update]
      operationId: detachShoppingTrip
      responses:
        200:
          $ref: "#/components/responses/Ok"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /shopping-list/trip/{tripId}/retry:
    parameters:
      - in: path
        name: tripId
        schema:
          type: integer
        required: true
        description: Id of the shopping trip
    post:
      tags:
        - ShoppingList
      summary: Try a failed shopping trip again
      description: >-
        This will queue a FAILED trip again, re-reading its receipt's products if that is what failed
        [group.shopping-lists.update]
      operationId: retryShoppingTrip
      responses:
        200:
          $ref: "#/components/responses/Ok"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /shopping-list/item/{itemId}:
    parameters:
      - in: path
        name: itemId
        schema:
          type: integer
        required: true
        description: Id of the shopping list item to operate on
    put:
      tags:
        - ShoppingList
      summary: Update shopping list item
      description: This will update an item's name, quantity and note [group.shopping-lists.update]
      operationId: updateShoppingListItem
      requestBody:
        description: Item to update
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertShoppingListItemCommand"
      responses:
        200:
          description: The updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingListItem"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
    delete:
      tags:
        - ShoppingList
      summary: Delete shopping list item
      description: This will delete an item from its shopping list [group.shopping-lists.update]
      operationId: deleteShoppingListItem
      responses:
        200:
          $ref: "#/components/responses/Ok"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /shopping-list/item/{itemId}/checked:
    parameters:
      - in: path
        name: itemId
        schema:
          type: integer
        required: true
        description: Id of the shopping list item to check off or un-check
    put:
      tags:
        - ShoppingList
      summary: Set whether a shopping list item is crossed off
      description: >-
        This will move an item to the given checked state [group.shopping-lists.update]. It sets the state
        rather than toggling it, so concurrent requests converge; re-sending the current state changes
        nothing.
      operationId: setShoppingListItemChecked
      requestBody:
        description: Target checked state
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetShoppingListItemCheckedCommand"
      responses:
        200:
          description: The item in its new state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingListItem"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /overview/group/{groupId}:
    parameters:
      - in: path
        name: groupId
        schema:
          type: integer
        required: true
        description: Id of the group to describe; the All group spans every group the caller can read
      - in: query
        name: month
        schema:
          type: string
        required: false
        description: Month to describe, yyyy-MM. Defaults to the current month in the app time zone.
      - in: query
        name: from
        schema:
          type: string
        required: false
        description: First day to describe, yyyy-MM-dd. With to, replaces month; the period before it (the previous calendar months for whole months, otherwise the same number of days) is the comparison.
      - in: query
        name: to
        schema:
          type: string
        required: false
        description: Last day to describe, yyyy-MM-dd
    get:
      tags:
        - Overview
      summary: Get the group's period at a glance
      description: >-
        This will get a month's spend, receipt counts, spending by category and the six-month trend
        ending with it, over the receipts the caller can see [group.receipts.read]
      operationId: getGroupOverview
      responses:
        200:
          description: The group overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupOverview"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /overview/group/{groupId}/products:
    parameters:
      - in: path
        name: groupId
        schema:
          type: integer
        required: true
        description: Id of the group; the All group spans every group the caller can read
      - in: query
        name: kind
        schema:
          type: string
        required: true
        description: >-
          UNHEALTHY, UNPLANNED, FOODGROUP (the lines of one category slice) or TAG (the lines carrying one
          tag). A plain string.
      - in: query
        name: foodGroup
        schema:
          type: string
        required: false
        description: >-
          With kind FOODGROUP and no categoryId, the slice's name as the Dashboard shows it; empty for
          Uncategorized
      - in: query
        name: categoryId
        schema:
          type: integer
        required: false
        description: With kind FOODGROUP, the slice's category (its categoryId on the overview)
      - in: query
        name: tagId
        schema:
          type: integer
        required: false
        description: With kind TAG (required there), the tile's tag
      - in: query
        name: month
        schema:
          type: string
        required: false
        description: Month, yyyy-MM. Defaults to the current month in the app time zone.
      - in: query
        name: from
        schema:
          type: string
        required: false
        description: First day, yyyy-MM-dd. With to, replaces month.
      - in: query
        name: to
        schema:
          type: string
        required: false
        description: Last day, yyyy-MM-dd
    get:
      tags:
        - Overview
      summary: List the products behind a Dashboard tile
      description: >-
        This will list the product lines that make up the Unhealthy or Unplanned figure for a period,
        newest receipt first, over the receipts the caller can see [group.receipts.read]
      operationId: getOverviewProducts
      responses:
        200:
          description: The products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupOverviewProduct"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /receipt-product/receipt/{receiptId}:
    parameters:
      - in: path
        name: receiptId
        schema:
          type: integer
        required: true
        description: Id of the receipt
    get:
      tags:
        - ReceiptProduct
      summary: Get a receipt's products
      description: This will get the products the AI read off a receipt, and where reading them stands [group.receipts.read]
      operationId: getReceiptProducts
      responses:
        200:
          description: The receipt's products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptProductsView"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /receipt-product/receipt/{receiptId}/read:
    parameters:
      - in: path
        name: receiptId
        schema:
          type: integer
        required: true
        description: Id of the receipt
    post:
      tags:
        - ReceiptProduct
      summary: Read a receipt's products again
      description: This will queue the receipt to have its products read again by the AI [group.receipts.update]
      operationId: readReceiptProducts
      responses:
        200:
          description: The receipt's products, now queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptProductsView"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /receipt-product/group/{groupId}/backfill:
    parameters:
      - in: path
        name: groupId
        schema:
          type: integer
        required: true
        description: Id of the group; the All group is rejected
    post:
      tags:
        - ReceiptProduct
      summary: Read the products of a group's older receipts
      description: >-
        This will queue every receipt in the group that has an image but has never had its products read
        [group.receipts.update]. Receipts are read a few at a time in the background.
      operationId: queueGroupReceiptProducts
      responses:
        200:
          description: How many receipts were queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedReceiptsView"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /shopping-list/item/{itemId}/classification:
    parameters:
      - in: path
        name: itemId
        schema:
          type: integer
        required: true
        description: Id of the shopping list item
    put:
      tags:
        - ShoppingList
      summary: Correct a shopping list item's health and seasonality tags
      description: >-
        This will set the item's tags and remember the health rating for the group's future
        products [group.shopping-lists.update]
      operationId: setShoppingListItemClassification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetFoodClassificationCommand"
      responses:
        200:
          description: The item with its corrected tags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShoppingListItem"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /receipt-product/product/{productId}/classification:
    parameters:
      - in: path
        name: productId
        schema:
          type: integer
        required: true
        description: Id of the receipt product
    put:
      tags:
        - ReceiptProduct
      summary: Correct a receipt product's health and seasonality tags
      description: >-
        This will set the product's tags and remember the health rating for the group's future
        products [group.receipts.update]
      operationId: setReceiptProductClassification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetFoodClassificationCommand"
      responses:
        200:
          description: The product with its corrected tags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptProduct"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /receipt-product/product/{productId}/labels:
    parameters:
      - in: path
        name: productId
        schema:
          type: integer
        required: true
        description: Id of the receipt product
    put:
      tags:
        - ReceiptProduct
      summary: Set a receipt product line's category and tags
      description: >-
        This will set the line's one category and its tags, and nothing else: the line is not renamed
        or classified again. A category other than the current one counts as chosen by a person from
        then on [group.receipts.update]
      operationId: setReceiptProductLabels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetReceiptProductLabelsCommand"
      responses:
        200:
          description: The product with its category and tags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptProduct"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /receipt-product/receipt/{receiptId}/product:
    parameters:
      - in: path
        name: receiptId
        schema:
          type: integer
        required: true
        description: Id of the receipt
    post:
      tags:
        - ReceiptProduct
      summary: Add a product line to a receipt
      description: This will add a product line the AI missed, at the end of the receipt's list [group.receipts.update]
      operationId: addReceiptProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertReceiptProductCommand"
      responses:
        200:
          description: The added product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptProduct"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /receipt-product/product/{productId}:
    parameters:
      - in: path
        name: productId
        schema:
          type: integer
        required: true
        description: Id of the receipt product
    put:
      tags:
        - ReceiptProduct
      summary: Correct a receipt product line
      description: >-
        This will change the product's name, amount and quantity. A new name clears its health and
        seasonality tags (unless a person corrected them) so it is classified again [group.receipts.update]
      operationId: updateReceiptProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertReceiptProductCommand"
      responses:
        200:
          description: The updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptProduct"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
    delete:
      tags:
        - ReceiptProduct
      summary: Remove a receipt product line
      description: This will remove one product line from a receipt [group.receipts.update]
      operationId: deleteReceiptProduct
      responses:
        200:
          $ref: "#/components/responses/Ok"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
  /exchangeRate:
    get:
      tags:
        - ExchangeRate
      summary: Get the exchange rates
      description: This will get the main currency and the household's rate for each foreign currency [app.system-settings.read]
      operationId: getExchangeRates
      responses:
        200:
          description: The rate table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrencyRateTable"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
    put:
      tags:
        - ExchangeRate
      summary: Replace the exchange rates
      description: >-
        This will replace the rate table. A rate that is now set converts the receipts saved in that
        currency while it had none; receipts that already carry a rate are not changed
        [app.system-settings.update]
      operationId: updateExchangeRates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CurrencyRateTable"
      responses:
        200:
          description: The saved rate table
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrencyRateTable"
        400:
          $ref: "#/components/responses/BadRequest"
        403:
          $ref: "#/components/responses/Forbidden"
        500:
          $ref: "#/components/responses/Internal"
      security:
        - bearerAuth: [ ]
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Ok:
      description: Request was successfully processed
    BadRequest:
      description: The request was malformed
    NotFound:
      description: The requested resource was not found
    Forbidden:
      description: The request was not allowed
    Unauthorized:
      description: The request was not authorized
    Internal:
      description: There was an error processing the request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalErrorResponse'
  schemas:
    ReceiptStatus:
      description:
        Where a receipt stands, OPEN (shown as "To check") or RESOLVED ("Settled"). The server still accepts the
        three statuses it had before 2026-11 and stores them as one of these (NEEDS_ATTENTION and DRAFT as OPEN,
        DECLINED as RESOLVED); it never returns them.
      type: string
      enum:
        - "OPEN"
        - "RESOLVED"
        - ""
    QuickScanDefaultPaidByType:
      description:
        Who paid when a Quick Scan does not say. UPLOADER, or empty, is the person scanning; USER is the member
        named by quickScanDefaultPaidById.
      type: string
      enum:
        - "UPLOADER"
        - "USER"
        - ""
    GroupStatus:
      type: string
      enum:
        - "ACTIVE"
        - "ARCHIVED"
    FilterOperation:
      type: string
      enum:
        - CONTAINS
        - EQUALS
        - GREATER_THAN
        - LESS_THAN
        - BETWEEN
        - WITHIN_CURRENT_MONTH
        - ""
    Permission:
      description: All permission keys the API recognizes.
      type: string
      enum:
        - "app.users.create"
        - "app.users.read"
        - "app.users.update"
        - "app.users.delete"
        - "app.categories.create"
        - "app.categories.read"
        - "app.categories.update"
        - "app.categories.delete"
        - "app.tags.create"
        - "app.tags.read"
        - "app.tags.update"
        - "app.tags.delete"
        - "app.system-settings.read"
        - "app.system-settings.update"
        - "app.receipt-processing-settings.create"
        - "app.receipt-processing-settings.read"
        - "app.receipt-processing-settings.update"
        - "app.receipt-processing-settings.delete"
        - "app.system-tasks.read"
        - "app.backup.export"
        - "app.backup.import"
        - "app.groups.create"
        - "app.groups.read"
        - "app.groups.update"
        - "app.groups.delete"
        - "app.oidc-providers.create"
        - "app.oidc-providers.read"
        - "app.oidc-providers.update"
        - "app.oidc-providers.delete"
        - "app.roles.read"
        - "app.notifications.read"
        - "app.notifications.delete"
        - "app.user-preferences.read"
        - "app.user-preferences.update"
        - "app.account.read"
        - "app.account.update"
        - "app.account.delete"
        - "app.receipts.search"
        - "app.reports.create"
        - "app.reports.delete"
        - "app.reports.duplicate"
        - "app.reports.generate"
        - "app.reports.read"
        - "app.reports.update"
        - "app.reports.readAll"
        - "app.reports.createAll"
        - "app.reports.updateAll"
        - "app.reports.deleteAll"
        - "app.reports.duplicateAll"
        - "app.reports.generateAll"
        - "group.view"
