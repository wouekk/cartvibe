    post:
      tags:
        - User
      summary: Delete own account
      description:
        Deletes the signed-in user's own account once it is confirmed. An account with
        a password of its own confirms with that password (401 when it is wrong). An
        account without one - created by signing in with an identity provider -
        confirms with the confirmationCode that oidcDeleteConfirmationStart hands back
        (400 when it is missing, spent, expired or not this account's). Which applies
        is decided by the account, not by which field is sent.
      requestBody:
        description: Confirmation for account deletion
        required: true
        content:
          application/json:
            schema:
